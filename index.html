  reportCard.appendChild(el('p',{style:'font-size:11.5px;color:var(--ink-soft);margin:8px 0 0 0;'},
    isEditingSaved
      ? 'Update saved request replaces the saved record with what is on screen now. Items marked "Not needed" are left out of the totals and the PDF.'

}


/* ---- Items left unfunded in a saved Fund Request stay with that request
   ("waiting for funds") instead of carrying over automatically. They can be
   ticked Funded right there, or moved into the current request if they still
   need to be requested. ---- */
function fundLineIsWaiting(l){ return !l.released && !l.cancelled && !l.carriedOver && (l.description || num(l.amount)); }
function fundWaitingLines(rec){
  const out = [];
  if(!rec.trackWaiting) return out;
  Object.entries((rec.data && rec.data.sections) || {}).forEach(([key, sec])=>{
    (sec.lines||[]).forEach((l, idx)=>{ if(fundLineIsWaiting(l)) out.push({ key, idx, sec, line:l }); });
  });
  return out;
}
function renderFundWaitingList(rec, history, draft, isEditingSaved){
  if(!rec.trackWaiting) return null;
  const all = [];
  Object.entries((rec.data && rec.data.sections) || {}).forEach(([key, sec])=>{
    (sec.lines||[]).forEach((l, idx)=>{ if(!l.cancelled && (l.description || num(l.amount))) all.push({ key, idx, sec, line:l }); });
  });
  if(!all.length) return null;
  const waiting = all.filter(x=> fundLineIsWaiting(x.line));
  const funded = all.filter(x=> x.line.released);
  const box = el('div',{style:'margin:0 0 10px 0; padding:8px 12px; border-radius:10px; background:'+(waiting.length ? '#FFF7FB; border:1px solid #F3D3E3;' : '#F4FAF6; border:1px solid #D4EBDC;')});
  const toggleKey = 'frWait_'+rec.id;
  if(!state.frWaitOpen) state.frWaitOpen = {};
  const open = state.frWaitOpen[toggleKey] !== undefined ? state.frWaitOpen[toggleKey] : waiting.length>0;
  const head = el('div',{style:'display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px;'});
  head.appendChild(el('span',{style:'font-weight:700; color:'+(waiting.length ? '#9b3d6e' : '#2f6e42')+';'},
    waiting.length ? `⏳ ${waiting.length} still waiting for funds · ₱${money(waiting.reduce((t,x)=>t+num(x.line.amount),0))}` : '✓ Everything in this request is funded or moved'));
  head.appendChild(el('span',{style:'color:var(--ink-soft);'}, `(${funded.length} funded${all.length-funded.length-waiting.length ? ', '+(all.length-funded.length-waiting.length)+' moved to a later request' : ''})`));
  head.appendChild(el('span',{style:'margin-left:auto; color:var(--ink-soft);'}, open ? '▾' : '▸'));
  head.addEventListener('click', ()=>{ state.frWaitOpen[toggleKey] = !open; render(); });
  box.appendChild(head);
  if(!open) return box;
  const t = el('table',{style:'width:100%; font-size:12px; margin-top:6px;'});
  /* Funded (and moved) items drop off the list; they can be shown again. */
  const showDoneKey = 'frWaitDone_'+rec.id;
  if(!state.frWaitShowDone) state.frWaitShowDone = {};
  const showDone = !!state.frWaitShowDone[showDoneKey];
  const doneCount = all.length - waiting.length;
  const visible = showDone ? all : waiting;
  visible.forEach(x=>{
    const l = x.line;
    const tr = el('tr',{style: l.released ? 'background:#E6F5EA;' : (l.carriedOver ? 'color:var(--ink-soft);' : '')});
    const cbTd = el('td',{style:'width:70px; text-align:center; white-space:nowrap;'});
    if(l.carriedOver){ cbTd.appendChild(el('span',{style:'font-size:11px;'}, '↪ moved')); }
    else {
      const cb = el('input',{type:'checkbox', style:'width:16px; height:16px; accent-color:#5CA678; cursor:pointer;'});
      cb.checked = !!l.released;
      cb.title = 'Tick once funded';
      cb.addEventListener('change', async ()=>{
        const h = await loadObj('fund_request_history', []);
        const r = h.find(z=>z.id===rec.id); if(!r) return;
        const ln = r.data.sections[x.key].lines[x.idx];
        ln.released = cb.checked;
        if(cb.checked) ln.fundedAt = todayISO(); else delete ln.fundedAt;
        _auditMuted = true; try{ await saveObj('fund_request_history', h); } finally { _auditMuted = false; }
        auditPush([{ mod:'Fund Request', key:'fund_request_history', action: cb.checked ? 'Funded' : 'Unfunded', label:`${r.title||'Fund Request'} · ${(x.sec.label||'').replace(/^[A-E]\.\s*/,'')} · ${auditShort(ln.description)} · ₱${money(ln.amount)}`, detail: cb.checked ? 'Marked funded ✓ (from saved request)' : 'Funded mark removed' }]);
        render();
      });
      cbTd.appendChild(cb);
      if(l.released && l.fundedAt) cbTd.appendChild(el('div',{style:'font-size:10px; color:#4f8a62;'}, monthDisplay(l.fundedAt)));
    }
    tr.appendChild(cbTd);
    tr.appendChild(el('td',{style:'color:var(--ink-soft); white-space:nowrap;'}, (x.sec.label||'').replace(/^[A-E]\.\s*/,'')));
    tr.appendChild(el('td',{style:'white-space:normal;'}, l.description||'(no description)'));
    tr.appendChild(el('td',{style:'text-align:right; white-space:nowrap;'}, '₱'+money(l.amount)));
    const actTd = el('td',{style:'text-align:right; white-space:nowrap;'});
    if(fundLineIsWaiting(l) && !isEditingSaved){
      const mv = el('button',{class:'btn small ghost', style:'padding:2px 8px; font-size:11px;'}, '↪ Add to current request');
      mv.title = 'Still needs to be requested — copy it into the Fund Request above';
      mv.addEventListener('click', async ()=>{
        const h = await loadObj('fund_request_history', []);
        const r = h.find(z=>z.id===rec.id); if(!r) return;
        const ln = r.data.sections[x.key].lines[x.idx];
        ln.carriedOver = true;
        _auditMuted = true; try{ await saveObj('fund_request_history', h); } finally { _auditMuted = false; }
        if(!draft.sections[x.key]) draft.sections[x.key] = { label:x.sec.label, lines:[] };
        draft.sections[x.key].lines = draft.sections[x.key].lines || [];
        draft.sections[x.key].lines.push({ description: ln.description||'', amount: ln.amount||0, dueDate: ln.dueDate||'', remarks: 'Carried over from '+(r.title||'previous request') });
        await saveObj('fund_request', draft);
        render();
      });
      actTd.appendChild(mv);
    }
    tr.appendChild(actTd);
    t.appendChild(tr);
  });
  if(visible.length) box.appendChild(t);
  if(doneCount){
    const tg = el('button',{class:'btn small ghost', style:'margin-top:6px; font-size:11px; padding:3px 10px;'}, showDone ? `Hide funded / moved (${doneCount})` : `Show funded / moved (${doneCount})`);
    tg.addEventListener('click', ()=>{ state.frWaitShowDone[showDoneKey] = !showDone; render(); });
    box.appendChild(tg);
  }
  return box;
}
function openNewFundRequestModal(data, finals, overall){
  const items = [];
  Object.entries(data.sections).forEach(([key, sec])=>{
    (sec.lines||[]).forEach((l, idx)=>{ if(!l.released && !l.cancelled && (l.description || num(l.amount))) items.push({ key, idx, sec, line:l }); });
  });
  const overlay = el('div',{class:'modal-overlay', id:'frNewOverlay'});
  const box = el('div',{class:'modal-box', style:'max-width:640px;'});
  box.appendChild(el('h3',{}, '🌱 Start a new Fund Request'));
  if(items.length){
    box.appendChild(el('p',{style:'font-size:12.5px;'}, `${items.length} item${items.length>1?'s are':' is'} not yet funded. Tick only what you want to request again. Everything you leave unticked stays under “${data.title}” in Saved Fund Requests as “waiting for funds” — tick it Funded there once the money comes in.`));
    const t = el('table',{style:'width:100%; font-size:12.5px; margin:6px 0;'});
    t.appendChild(el('thead',{},el('tr',{},[el('th',{style:'width:80px;'},'Carry over'),el('th',{},'Section'),el('th',{},'Description'),el('th',{style:'text-align:right;'},'Amount')])));
    const tb = el('tbody');
    items.forEach(x=>{
      x.cb = el('input',{type:'checkbox', style:'width:16px; height:16px;'});
      tb.appendChild(el('tr',{},[ el('td',{style:'text-align:center;'},[x.cb]), el('td',{style:'color:var(--ink-soft);'}, (x.sec.label||'').replace(/^[A-E]\.\s*/,'')), el('td',{}, x.line.description||'(no description)'), el('td',{style:'text-align:right;'}, '₱'+money(x.line.amount)) ]));
    });
    t.appendChild(tb);
    box.appendChild(t);
    const allRow = el('div',{style:'display:flex; gap:8px; font-size:12px; margin-bottom:6px;'});
    const allBtn = el('button',{class:'btn small ghost'}, 'Tick all'); allBtn.addEventListener('click', ()=> items.forEach(x=> x.cb.checked = true));
    const noneBtn = el('button',{class:'btn small ghost'}, 'Untick all'); noneBtn.addEventListener('click', ()=> items.forEach(x=> x.cb.checked = false));
    allRow.appendChild(allBtn); allRow.appendChild(noneBtn);
    box.appendChild(allRow);
  } else {
    box.appendChild(el('p',{style:'font-size:12.5px;'}, 'Everything here is funded or marked not needed. The current request will be kept in Saved Fund Requests and the form will be cleared.'));
  }
  const actions = el('div',{class:'modal-actions'});
  const go = el('button',{class:'savebtn primary'}, 'Start new request');
  go.addEventListener('click', async ()=>{
    const history = await loadObj('fund_request_history', []);
    const snap = JSON.parse(JSON.stringify(data));
    delete snap.savedId;
    items.forEach(x=>{ if(x.cb && x.cb.checked) snap.sections[x.key].lines[x.idx].carriedOver = true; });
    let rec = data.savedId ? history.find(r=>r.id===data.savedId) : null;
    if(rec){
      rec.data = snap;   /* same request — keep it in step with the latest funded marks */
      rec.trackWaiting = true;
    } else if(Object.values(data.sections).some(sec=> (sec.lines||[]).some(l=> l.description || num(l.amount)))){
      history.unshift({ id:'fr_'+Date.now().toString(36), savedAt:new Date().toISOString(), title:data.title, data:snap, finals: JSON.parse(JSON.stringify(finals)), overall, autoSaved:true, trackWaiting:true });
    }
    await saveObj('fund_request_history', history);
    const fresh = JSON.parse(JSON.stringify(FUND_REQUEST_DEFAULT));
    items.forEach(x=>{
      if(!(x.cb && x.cb.checked) || !fresh.sections[x.key]) return;
      fresh.sections[x.key].lines.push({ description:x.line.description||'', amount:x.line.amount||0, dueDate:x.line.dueDate||'', remarks:'Carried over from '+(data.title||'previous request') });
    });
    fresh.title = 'Fund Request — [Enter Date]';
    _auditMuted = true; try{ await saveObj('fund_request', fresh); } finally { _auditMuted = false; }
    const nCarry = items.filter(x=> x.cb && x.cb.checked).length;
    auditPush([{ mod:'Fund Request', key:'fund_request', action:'Saved', label:`Started a new request after ${data.title||'previous request'}`, detail:`${nCarry} item${nCarry===1?'':'s'} carried over · ${items.length-nCarry} left waiting for funds under the old request` }]);
    overlay.remove();
    render();
  });
  actions.appendChild(go);
  box.appendChild(actions);
  const close = el('button',{class:'modal-close'}, 'Cancel');
  close.addEventListener('click', ()=> overlay.remove());
  box.appendChild(close);
  overlay.appendChild(box);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

/* Copies Released / Not needed marks from an edited saved request onto the
   matching items (same description + amount) in the draft being restored. */
function syncFundLineStatuses(target, source){
  Object.entries(source.sections||{}).forEach(([key, srcSec])=>{
    const tgtLines = (target.sections && target.sections[key] && target.sections[key].lines) || [];
    const used = new Set();
    (srcSec.lines||[]).forEach(sl=>{
      const i = tgtLines.findIndex((tl,ti)=> !used.has(ti)
        && String(tl.description||'').trim().toLowerCase() === String(sl.description||'').trim().toLowerCase()
        && num(tl.amount) === num(sl.amount));
      if(i>=0){ used.add(i); tgtLines[i].released = !!sl.released; tgtLines[i].cancelled = !!sl.cancelled; }
    });
  });
}

function renderFundSection(key, sec, data, finals, hideFunded){
  const card = el('div',{class:'card'});
  const lines = sec.lines||[];
  const active = lines.filter(l=>!l.cancelled);
  const fundedCount = active.filter(l=>l.released).length;
  const head = el('div',{style:'display:flex; align-items:center; gap:10px; flex-wrap:wrap;'});
  head.appendChild(el('h3',{style:'margin:0;'}, sec.label));
  if(active.length) head.appendChild(el('span',{style:`font-size:11.5px; font-weight:700; border-radius:999px; padding:2px 10px; ${fundedCount===active.length ? 'background:#EAF6EE; color:#2f6e42;' : 'background:#FFF4FA; color:#9b3d6e;'}`}, fundedCount===active.length ? '✓ All funded' : `${fundedCount} of ${active.length} funded`));
  card.appendChild(head);
  const table = el('table',{style:'margin-top:10px;'});
  const thead = el('tr',{},[el('th',{},'#'),el('th',{style:'text-align:center;'},'✓ Funded'),el('th',{},'Description'),el('th',{},'Amount'),el('th',{},'Due Date'),el('th',{},'Remarks'),el('th',{},'Move to'),el('th',{},'')]);
  table.appendChild(el('thead',{},thead));
  const tbody = el('tbody');
  let hiddenCount = 0, n = 0;
  lines.forEach((line, idx)=>{
    if(hideFunded && line.released){ hiddenCount++; return; }
    n++;
    const tr = el('tr');
    if(line.released) tr.style.cssText = 'background:#E6F5EA;';
    else if(line.cancelled) tr.style.cssText = 'background:#F4F1F5; text-decoration:line-through; color:#9a90a0; opacity:0.6;';
    tr.appendChild(el('td',{}, String(idx+1)));
    const relTd = el('td',{style:'text-align:center; white-space:nowrap;'});
    const relCb = el('input',{type:'checkbox', style:'width:17px; height:17px; accent-color:#5CA678; cursor:pointer;'});
    relCb.checked = !!line.released;
    relCb.disabled = !!line.cancelled;
    relCb.title = 'Tick once this item is funded. Items not ticked carry over to the next Fund Request.';
    relCb.addEventListener('change', async ()=>{
      line.released = relCb.checked;
      if(relCb.checked){ line.cancelled = false; line.fundedAt = todayISO(); } else delete line.fundedAt;
      await saveObj('fund_request', data); render();
    });
    relTd.appendChild(relCb);
    if(line.released && line.fundedAt) relTd.appendChild(el('div',{style:'font-size:10px; color:#4f8a62;'}, monthDisplay(line.fundedAt)));
    tr.appendChild(relTd);
    tr.appendChild(lineInputTd(line,'description','text', sec, data));
    tr.appendChild(lineInputTd(line,'amount','number', sec, data));
    tr.appendChild(lineInputTd(line,'dueDate','date', sec, data));
    tr.appendChild(lineInputTd(line,'remarks','text', sec, data));
    const moveTd = el('td');
    const moveSel = el('select',{style:'font-size:11.5px; padding:4px 6px; border:1px solid #DED6E4; border-radius:6px;'});
    moveSel.appendChild(el('option',{value:''},'— Move to —'));
    Object.entries(data.sections).forEach(([k,s])=>{
      if(k===key) return;
      moveSel.appendChild(el('option',{value:k}, s.label));
    });
    moveSel.addEventListener('change', async ()=>{
      const targetKey = moveSel.value;
      if(!targetKey) return;
      sec.lines.splice(idx,1);
      data.sections[targetKey].lines = data.sections[targetKey].lines || [];
      data.sections[targetKey].lines.push(line);
      await saveObj('fund_request', data);
      render();

const SALES_MODULE_KEY = { bticket:'bticket_sales', daimasu:'daimasu_sales', midori:'midori_sales' };
const SALES_TOTAL_FIELD = { bticket:'total', daimasu:'grandTotal', midori:'reportedTotal' };

/* ============================= MONTHLY REPORT ============================= */
/* Cash advances released in an EARLIER month but liquidated (Date liquidated)
   in this month. Informational only — the expenses already sit in the month of
   their receipts and the sukli/abono in this month, so nothing is added to totals. */
async function priorMonthLiquidations(group, month){
  const out = [];
  for(const key of ['bgc_pettycash','bgc_borrowed']){
    const mod = MODULES.find(m=>m.key===key); if(!mod) continue;
    (await getModuleData(mod)).forEach(r=>{
      if(r.requestType!=='Cash Advance' || !r.liquidationDate) return;
      if(!inMonth(r.liquidationDate, month) || !((r.date||'') < month+'-01')) return;
      if(COMPANY_EXPENSE_KEY[r.linkCompany] !== group+'_expenses') return;
      const rcs = Array.isArray(r.receipts) ? r.receipts : [];
      const spent = rcs.reduce((t,x)=>t+num(x.amount),0);
      out.push({ fund: mod.label, released: r.date, liquidated: r.liquidationDate, ref: r.voucherRef||'', particulars: r.particulars||'', advance: num(r.cashOut), spent, diff: num(r.cashOut)-spent });
    });
  }
  return out.sort((a,b)=> (a.liquidated||'').localeCompare(b.liquidated||''));
}
function priorLiqDiffLabel(x){ return x.diff>0.005 ? 'Change ₱'+money(x.diff) : (x.diff<-0.005 ? 'Abono ₱'+money(-x.diff) : 'Exact'); }
function inMonth(dateStr, monthStr){
  return !!dateStr && dateStr.slice(0,7) === monthStr;
}
function topExpenseCategory(byCategoryOrRows){
  let byCat = byCategoryOrRows;
  if(Array.isArray(byCategoryOrRows)){
    byCat = {};
    byCategoryOrRows.filter(r=>r.status!=='Cancelled').forEach(r=>{
      const c = r.category || 'Uncategorized';
      byCat[c] = (byCat[c]||0) + num(r.amount);
    });
  }
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  return entries.length ? {name: entries[0][0], total: entries[0][1]} : null;
}
function buildPLSummarySentence(totalSales, totalExpenses, totalLaborCost, byCategoryOrRows){
  const totalCosts = totalExpenses + totalLaborCost;
  const diff = totalSales - totalCosts;
  const topCat = topExpenseCategory(byCategoryOrRows);
  if(Math.abs(diff) < 0.01){
    return 'Sales and total costs (expenses + payroll) were about even this month.';
  } else if(diff > 0){
    return `Sales exceeded total costs (expenses + payroll) by ₱${money(diff)} this month.`;
  } else {
    const gap = Math.abs(diff);
    return `Expenses and payroll exceeded sales by ₱${money(gap)} this month`
      + (topCat ? `, with ${esc(topCat.name)} the largest expense category at ₱${money(topCat.total)}.` : '.');
  }
}
/* Categories A–Z (case-insensitive), with Uncategorized always last. */
function sortCatsAlpha(a, b){
  const ka = a[0], kb = b[0];
  if(ka==='Uncategorized') return 1; if(kb==='Uncategorized') return -1;
  return ka.localeCompare(kb, undefined, {sensitivity:'base'});
}
function buildCategoryBreakdown(expRows){
  const byCat = {};
  expRows.filter(r=>r.status!=='Cancelled').forEach(r=>{
    const c = r.category || 'Uncategorized';
    if(!byCat[c]) byCat[c] = { total:0, count:0 };
    byCat[c].total += num(r.amount);
    byCat[c].count += 1;
  });
  const wrap = el('div',{class:'card'});
  wrap.appendChild(el('h3',{style:'font-size:14px;'}, 'Expenses by Category'));
  const entries = Object.entries(byCat).sort(sortCatsAlpha);
  if(!entries.length){
    wrap.appendChild(el('p',{style:'color:var(--ink-soft); font-size:13px;'}, 'No expenses logged for this month.'));
    return wrap;
  }
  const t = el('table',{style:'width:100%; border-collapse:collapse; font-size:12.5px;'});
  t.appendChild(el('thead',{},el('tr',{},['Category','Count','Total'].map(h=>el('th',{},h)))));
  const tbody = el('tbody');
  entries.forEach(([cat,v])=>{
    tbody.appendChild(el('tr',{},[
      el('td',{}, cat), el('td',{}, String(v.count)), el('td',{}, '₱'+money(v.total)),
    ]));
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  /* Show what is inside "Uncategorized" so it can be fixed (usually cash
     advances still waiting for receipts, or entries saved without a category). */
  const unc = expRows.filter(r=>r.status!=='Cancelled' && !r.category);
  if(unc.length){
    const det = el('details',{style:'margin-top:10px; font-size:12px;'});
    det.appendChild(el('summary',{style:'cursor:pointer; color:var(--ink-soft);'}, `What's in Uncategorized (${unc.length})`));
    const ut = el('table',{style:'width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;'});
    ut.appendChild(el('thead',{}, el('tr',{}, ['Date','Voucher','Description','Status','Amount'].map(h=>el('th',{},h)))));
    const ub = el('tbody');
    unc.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(r=> ub.appendChild(el('tr',{},[
      el('td',{}, r.date||''), el('td',{}, r.voucherNo||''), el('td',{style:'white-space:normal;'}, r.description||''), el('td',{}, r.status||''), el('td',{style:'text-align:right;'}, '₱'+money(r.amount)) ])));
    ut.appendChild(ub); det.appendChild(ut);
    det.appendChild(el('p',{class:'note', style:'margin:6px 0 0 0;'}, 'Cash advances get their category from the receipts once liquidated. For other entries, edit the expense and pick a category.'));
    wrap.appendChild(det);
  }
  return wrap;
}

/* ===== Monthly Report helpers =====
   B-Ticket and Betrnk Tours share one money pool and are reported to
   Sir Arnold as one P&L, so the B-Ticket report is the combined
   "B-Ticket & Tours" report: its payroll includes Tours employees, and
   where the money came from is shown separately (info only). */
const REPORT_ENTITIES = { bticket:['B-Ticket Inc.','Betrnk Tours'], daimasu:['Daimasu'], midori:['Midori No Mart'] };
/* Bank entries for a company, read straight from Bank Balances (the one
   place bank transactions are kept) — the old per-company Cash & Bank tabs
   were a copy of the same entries. */
async function bankRowsForGroup(group){
  const bm = MODULES.find(m=>m.key==='bank_balances');
  return (await getModuleData(bm)).filter(r=> BANK_ACCOUNT_TO_CASHBANK[r.account]===group+'_cashbank');
}
function reportLabel(group){ return group==='bticket' ? 'B-Ticket & Tours' : GROUPS[group].label; }
async function reportFundSources(group, month){
  const out = [];
  const cbRows = (await bankRowsForGroup(group)).filter(r=>inMonth(r.date, month));
  const byAcct = {};
  cbRows.forEach(r=>{ const a = r.account || '(no account)'; if(!byAcct[a]) byAcct[a] = {cashIn:0, cashOut:0}; byAcct[a].cashIn += num(r.cashIn); byAcct[a].cashOut += num(r.cashOut); });
  Object.entries(byAcct).forEach(([a,v])=> out.push({ source:a, ...v }));
  if(group==='bticket'){
    for(const [key,label] of [['bgc_pettycash','BGC Petty Cash Funds (shared)'],['bgc_borrowed','BGC Borrowed Funds (shared)']]){
      const mod = MODULES.find(m=>m.key===key);
      if(!mod) continue;
      const rows = (await getModuleData(mod)).filter(r=>inMonth(r.date, month) && !/beginning balance/i.test(r.particulars||''));
      out.push({ source:label, cashIn: rows.reduce((t,r)=>t+num(r.cashIn),0), cashOut: rows.reduce((t,r)=>t+num(r.cashOut),0) });
    }
  }
  return out;
}
/* BGC releases this month that are not linked to any company. Skips
   automatic change/abono rows, cash coming in, fund transfers and
   salaries (payroll is counted from Labor Cost). */
async function reportUnlinkedBgc(month){
  const list = [];
  for(const [key,label] of [['bgc_pettycash','Petty Cash'],['bgc_borrowed','Borrowed Funds']]){
    const mod = MODULES.find(m=>m.key===key);
    if(!mod) continue;
    (await getModuleData(mod)).forEach(r=>{
      if(!inMonth(r.date, month) || r._autoGenerated || !(num(r.cashOut)>0)) return;
      if((r.linkCompany||'').trim() || r.recordedSeparately) return;
      if(['Funds','Salary'].includes(r.requestType)) return;
      list.push({ modKey:key, id:r.id, fund:label, date:r.date, ref:r.voucherRef||'', particulars:r.particulars||'', tag:(r.projectCode||'').trim(), amount:num(r.cashOut) });
    });
  }
  return list.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}

/* SSS / PhilHealth / Pag-IBIG remittances (category "Employee's Mandatories: …")
   are already inside Labor Cost (EE share and loans are part of gross pay,
   ER share is the employer share), so the P&L leaves them out of Total
   Expenses and shows them on an info line instead. */
function isMandatoryExpense(r){ return /^\s*Employee'?s Mandatories/i.test(r.category||''); }
async function printMonthlyReport(group, month){
  const g = GROUPS[group];
  const priorLiqRows = await priorMonthLiquidations(group, month);

  const salesMod = MODULES.find(m=>m.key===SALES_MODULE_KEY[group]);
  const salesRows = withComputed(salesMod, await getModuleData(salesMod)).filter(r=>inMonth(r.date, month));
  const salesField = SALES_TOTAL_FIELD[group];
  const totalSales = salesRows.reduce((s,r)=>s+num(r[salesField]),0);

  const cbRows = (await bankRowsForGroup(group)).filter(r=>inMonth(r.date, month));
  const totalCashIn = cbRows.reduce((s,r)=>s+num(r.cashIn),0);
  const totalCashOut = cbRows.reduce((s,r)=>s+num(r.cashOut),0);

  const expMod = MODULES.find(m=>m.key===group+'_expenses');
  const allExpRows = (await getModuleData(expMod)).filter(r=>inMonth(r.date, month));
  const mandRows = allExpRows.filter(r=>isMandatoryExpense(r) && r.status!=='Cancelled');
  const expRows = allExpRows.filter(r=>!isMandatoryExpense(r));
  const totalMand = mandRows.reduce((t,r)=>t+num(r.amount),0);
  const totalExpenses = expRows.filter(r=>r.status!=='Cancelled').reduce((s,r)=>s+num(r.amount),0);
  const totalLiquidated = expRows.filter(r=>r.status==='Liquidated').reduce((s,r)=>s+num(r.amount),0);
  let totalUnliquidated = expRows.filter(r=>isUnliquidatedRow(r)).reduce((s,r)=>s+num(r.amount),0);
  const companyEntryForMonthly = Object.entries(COMPANY_EXPENSE_KEY).find(([name,key])=>key===expMod.key);
  if(companyEntryForMonthly){
    const prRowsMonthly = (await getModuleData(MODULES.find(m=>m.key==='pending_requests')))
      .filter(r=>r.company===companyEntryForMonthly[0] && !isPendingRequestResolved(r.status) && inMonth(r.date, month));
    totalUnliquidated += prRowsMonthly.reduce((s,r)=>s+num(r.amount),0);
  }
  const byCategory = {};
  expRows.filter(r=>r.status!=='Cancelled').forEach(r=>{
    const c = r.category || 'Uncategorized';
    byCategory[c] = (byCategory[c]||0) + num(r.amount);
  });

  const laborMod = MODULES.find(m=>m.key==='labor_cost');
  const laborRowsAll = withComputed(laborMod, await getModuleData(laborMod));
  const laborRows = laborRowsAll.filter(r=>(REPORT_ENTITIES[group]||[GROUP_ENTITY_NAME[group]]).includes(r.entity) && inMonth(r.payDate, month));
  const totalGross = laborRows.reduce((s,r)=>s+num(r.grossSalary),0);
  const totalEmployerShare = laborRows.reduce((s,r)=>s+num(r.totalEmployerShare),0);
  const totalLaborCost = laborRows.reduce((s,r)=>s+num(r.totalLaborCost),0);

  const netIncome = totalSales - totalExpenses - totalLaborCost;
  const rLabel = reportLabel(group);
  const fundSources = group==='bticket' ? await reportFundSources(group, month) : [];
  const laborSplitHtml = group==='bticket' ? REPORT_ENTITIES.bticket.map(ent=>{ const rs = laborRows.filter(r=>r.entity===ent); return `<div class="kv"><span>&nbsp;&nbsp;${esc(ent)} (${rs.length})</span><span>₱${money(rs.reduce((t,r)=>t+num(r.totalLaborCost),0))}</span></div>`; }).join('') : '';
  const fundHtml = fundSources.map(f=>`<tr><td>${esc(f.source)}</td><td style="text-align:right;">₱${money(f.cashIn)}</td><td style="text-align:right;">₱${money(f.cashOut)}</td><td style="text-align:right;">${f.cashIn-f.cashOut<0?'-':''}₱${money(Math.abs(f.cashIn-f.cashOut))}</td></tr>`).join('');
  const [yy,mm] = month.split('-');
  const monthLabel = MONTH_NAMES[parseInt(mm,10)-1]+' '+yy;

  const catRowsHtml = Object.entries(byCategory).sort(sortCatsAlpha).map(([c,amt])=>
    `<tr><td>${esc(c)}</td><td style="text-align:right;">₱${money(amt)}</td></tr>`).join('');
  const salesRowsHtml = sortedByDate(salesRows,'date').map(r=>
    `<tr><td>${esc(r.date)}</td><td style="text-align:right;">₱${money(r[salesField])}</td></tr>`).join('')
    || '<tr><td colspan="2" style="color:#999;">No entries</td></tr>';
  const expRowsHtml = sortedByDate(expRows,'date').map(r=>
    `<tr><td>${esc(r.date)}</td><td>${esc(r.category||'')}</td><td>${esc(r.description||'')}</td><td>${esc(r.status||'')}</td><td style="text-align:right;">₱${money(r.amount)}</td></tr>`).join('')
    || '<tr><td colspan="5" style="color:#999;">No entries</td></tr>';
  const laborRowsHtml = sortedByDate(laborRows,'payDate').map(r=>
    `<tr><td>${esc(r.payDate)}</td><td>${esc(r.employeeName||'')}</td><td style="text-align:right;">₱${money(r.grossSalary)}</td><td style="text-align:right;">₱${money(r.actualPay)}</td><td style="text-align:right;">₱${money(r.totalEmployerShare)}</td><td style="text-align:right;">₱${money(r.totalLaborCost)}</td></tr>`).join('')
    || '<tr><td colspan="5" style="color:#999;">No entries</td></tr>';

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(rLabel)} Monthly Report - ${esc(monthLabel)}</title>
  <style>
    body{ font-family: Arial, Helvetica, sans-serif; color:#1a1a1a; padding:24px; }
    .doc{ max-width:800px; margin:0 auto; }
    h1{ font-size:19px; text-align:center; margin-bottom:2px; }
    .sub{ text-align:center; color:#666; margin:0 0 18px 0; font-size:13px; }
    .section{ margin-bottom:16px; border:1px solid #ccc; border-radius:8px; padding:12px 16px; page-break-inside:avoid; }
    .section-title{ font-weight:700; font-size:13.5px; margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:6px; }
    .kv{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; }
    .kv.strong{ font-weight:700; border-top:1px solid #333; margin-top:4px; padding-top:6px; }
    table.itemtable{ width:100%; border-collapse:collapse; font-size:11.5px; margin-top:8px; }
    table.itemtable th{ border-bottom:1px solid #999; padding:4px; background:#F2EEF4; text-align:left; }
    table.itemtable td{ border-bottom:1px solid #eee; padding:4px; }
    .toolbar{ text-align:center; margin-bottom:14px; }
    .toolbar button{ background:#2E2A3B; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-size:12.5px; cursor:pointer; }
    @media print{ .toolbar{ display:none; } .doc{ max-width:none; } }
  </style></head><body>
  <div class="toolbar"><button onclick="window.print()">🖨️ Print / Save as PDF</button></div>
  <div class="doc">
    <h1>${esc(rLabel)} — Monthly Report</h1>
    <p class="sub">${esc(monthLabel)}</p>

    <div class="section">
      <div class="section-title">Sales</div>
      <div class="kv"><span>Total Sales</span><span>₱${money(totalSales)}</span></div>
      <div class="kv"><span>Entries logged</span><span>${salesRows.length}</span></div>
      <table class="itemtable"><thead><tr><th>Date</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${salesRowsHtml}</tbody></table>
    </div>

    ${group==='bticket' ? `<div class="section">
      <div class="section-title">Where the money came from (not part of the P&amp;L)</div>
      <table class="itemtable"><thead><tr><th>Source</th><th style="text-align:right;">Cash In</th><th style="text-align:right;">Cash Out</th><th style="text-align:right;">Net</th></tr></thead><tbody>${fundHtml||'<tr><td colspan="4" style="color:#999;">No entries</td></tr>'}</tbody></table>
      <p style="font-size:11px; color:#666; margin:6px 0 0 0;">BGC funds are shared by all companies.</p>
    </div>` : `<div class="section">
      <div class="section-title">Cash &amp; Bank</div>
      <div class="kv"><span>Total Cash In</span><span>₱${money(totalCashIn)}</span></div>
      <div class="kv"><span>Total Cash Out</span><span>₱${money(totalCashOut)}</span></div>
      <div class="kv strong"><span>Net Movement</span><span>₱${money(totalCashIn-totalCashOut)}</span></div>
    </div>`}

    <div class="section">
      <div class="section-title">Expenses</div>
      <div class="kv"><span>Total Requested</span><span>₱${money(totalExpenses)}</span></div>
      ${(()=>{ const lr = lateEntriesFor(expRows, month); return lr.length ? `<div class="kv"><span>&nbsp;&nbsp;Includes late entries added after the month ended (${lr.length})</span><span>₱${money(lr.reduce((t,r)=>t+num(r.amount),0))}</span></div>` : ''; })()}
      <div class="kv"><span>Liquidated</span><span>₱${money(totalLiquidated)}</span></div>
      <div class="kv strong"><span>Unliquidated</span><span>₱${money(totalUnliquidated)}</span></div>
      ${catRowsHtml ? `<table class="itemtable"><thead><tr><th>Category</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${catRowsHtml}</tbody></table>` : ''}
      <table class="itemtable"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Status</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${expRowsHtml}</tbody></table>
      ${priorLiqRows.length ? `<div class="kv" style="margin-top:10px;"><span><b>Prior-month liquidations</b> (released before this month, liquidated this month — for information only, not added to totals)</span><span></span></div>
      <table class="itemtable"><thead><tr><th>Released</th><th>Liquidated</th><th>Voucher</th><th>Particulars</th><th style="text-align:right;">Advance</th><th style="text-align:right;">Receipts</th><th>Result</th></tr></thead><tbody>${priorLiqRows.map(x=>`<tr><td>${esc(x.released)}</td><td>${esc(x.liquidated)}</td><td>${esc(x.ref)}</td><td>${esc(x.particulars)}</td><td style="text-align:right;">₱${money(x.advance)}</td><td style="text-align:right;">₱${money(x.spent)}</td><td>${priorLiqDiffLabel(x)}</td></tr>`).join('')}</tbody></table>` : ''}
    </div>

    <div class="section">
      <div class="section-title">Payroll</div>
      <div class="kv"><span>Declared Gross (for mandatories)</span><span>₱${money(totalGross)}</span></div>
      <div class="kv"><span>Actual Pay (from payroll)</span><span>₱${money(laborRows.reduce((t,r)=>t+num(r.actualPay),0))}</span></div>
      <div class="kv"><span>Employer Mandatory Share</span><span>₱${money(totalEmployerShare)}</span></div>
      <div class="kv strong"><span>Total Labor Cost</span><span>₱${money(totalLaborCost)}</span></div>
      ${laborSplitHtml}
      <table class="itemtable"><thead><tr><th>Pay Date</th><th>Employee</th><th style="text-align:right;">Declared Gross</th><th style="text-align:right;">Actual Pay</th><th style="text-align:right;">Employer Share</th><th style="text-align:right;">Total</th></tr></thead><tbody>${laborRowsHtml}</tbody></table>
    </div>

    <div class="section">
      <div class="section-title">P&amp;L Summary</div>
      <p style="font-size:12px; color:#555; margin:0 0 10px 0; line-height:1.5;">${buildPLSummarySentence(totalSales, totalExpenses, totalLaborCost, byCategory)}</p>
      <div class="kv"><span>Total Sales</span><span>₱${money(totalSales)}</span></div>
      <div class="kv"><span>Less: Total Expenses</span><span>-₱${money(totalExpenses)}</span></div>
      <div class="kv"><span>Less: Total Labor Cost (Actual Pay + Employer Share)</span><span>-₱${money(totalLaborCost)}</span></div>
      <div class="kv strong" style="font-size:14.5px;"><span>Net Income</span><span>${netIncome<0?'-':''}₱${money(Math.abs(netIncome))}</span></div>
      ${mandRows.length ? `<div class="kv" style="margin-top:8px; color:#555;"><span>Mandatories remitted this month (already in Labor Cost, not deducted again)</span><span>₱${money(totalMand)}</span></div>` : ''}
    </div>
  </div>
  </body></html>`;
  const w = window.open('', '_blank', 'width=820,height=960');
  if(!w){ alert('Please allow pop-ups to view/print the monthly report.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

async function renderMonthlyReport(container, group){
  container.innerHTML = '';
  const g = GROUPS[group];
  container.appendChild(el('span',{class:'pill', style:`background:${g.color}`}, g.label));
  container.appendChild(el('div',{class:'pagehead'},[
    el('h1',{}, reportLabel(group)+' — Monthly Report'),
    el('p',{}, group==='bticket'
      ? 'B-Ticket and Betrnk Tours together, same as the P&L for Sir Arnold. Payroll includes Tours employees. Where the money came from is shown separately and is not part of the P&L.'
      : 'Consolidated view pulled from Sales, Cash & Bank, Expenses and Labor Cost for the month you pick — ending in a P&L summary.'),
  ]));
  container.appendChild(sharedFlag());

  const monthCard = el('div',{class:'card'});
  monthCard.appendChild(el('h3',{},'Month'));
  const monthInput = el('input',{type:'month', value: state.reportMonth || todayISO().slice(0,7)});
  monthCard.appendChild(monthInput);
  const monthlyPdfBtn = el('button',{class:'btn ghost', style:'margin-left:10px;'}, '🖨️ Download as PDF');
  monthlyPdfBtn.addEventListener('click', ()=> printMonthlyReport(group, monthInput.value || todayISO().slice(0,7)));
  monthCard.appendChild(monthlyPdfBtn);
  container.appendChild(monthCard);

  const resultsWrap = el('div',{});
  container.appendChild(resultsWrap);

  async function draw(){
    const month = monthInput.value || todayISO().slice(0,7);
    state.reportMonth = month;
    resultsWrap.innerHTML = '';

    // Sales
    const salesMod = MODULES.find(m=>m.key===SALES_MODULE_KEY[group]);
    const salesRows = withComputed(salesMod, await getModuleData(salesMod)).filter(r=>inMonth(r.date, month));
    const salesField = SALES_TOTAL_FIELD[group];
    const totalSales = salesRows.reduce((s,r)=>s+num(r[salesField]),0);

    // Cash & Bank
    const cbRows = (await bankRowsForGroup(group)).filter(r=>inMonth(r.date, month));
    const totalCashIn = cbRows.reduce((s,r)=>s+num(r.cashIn),0);
    const totalCashOut = cbRows.reduce((s,r)=>s+num(r.cashOut),0);

    // Expenses
    const expMod = MODULES.find(m=>m.key===group+'_expenses');
    const allExpRows = (await getModuleData(expMod)).filter(r=>inMonth(r.date, month));
    const mandRows = allExpRows.filter(r=>isMandatoryExpense(r) && r.status!=='Cancelled');
    const expRows = allExpRows.filter(r=>!isMandatoryExpense(r));
    const totalMand = mandRows.reduce((t,r)=>t+num(r.amount),0);
    const totalExpenses = expRows.filter(r=>r.status!=='Cancelled').reduce((s,r)=>s+num(r.amount),0);
    const totalLiquidated = expRows.filter(r=>r.status==='Liquidated').reduce((s,r)=>s+num(r.amount),0);
    let totalUnliquidated = expRows.filter(r=>isUnliquidatedRow(r)).reduce((s,r)=>s+num(r.amount),0);
    const companyEntryForMonthly = Object.entries(COMPANY_EXPENSE_KEY).find(([name,key])=>key===expMod.key);
    if(companyEntryForMonthly){
      const prRowsMonthly = (await getModuleData(MODULES.find(m=>m.key==='pending_requests')))
        .filter(r=>r.company===companyEntryForMonthly[0] && !isPendingRequestResolved(r.status) && inMonth(r.date, month));
      totalUnliquidated += prRowsMonthly.reduce((s,r)=>s+num(r.amount),0);
    }

    // Labor Cost & Mandatories
    const laborMod = MODULES.find(m=>m.key==='labor_cost');
    const laborRowsAll = withComputed(laborMod, await getModuleData(laborMod));
    const laborRows = laborRowsAll.filter(r=>(REPORT_ENTITIES[group]||[GROUP_ENTITY_NAME[group]]).includes(r.entity) && inMonth(r.payDate, month));
    const totalGross = laborRows.reduce((s,r)=>s+num(r.grossSalary),0);
    const totalEmployerShare = laborRows.reduce((s,r)=>s+num(r.totalEmployerShare),0);
    const totalLaborCost = laborRows.reduce((s,r)=>s+num(r.totalLaborCost),0);

    resultsWrap.appendChild(sectionHead('Sales'));
    resultsWrap.appendChild(el('div',{class:'grid-summary'},[
      statBox('Total Sales', '₱'+money(totalSales)),
      statBox('Entries logged', String(salesRows.length)),
    ]));
    resultsWrap.appendChild(buildBreakdownToggle('Sales', salesMod, sortedByDate(salesRows, 'date')));

    const unlinked = await reportUnlinkedBgc(month);
    if(unlinked.length){
      const uc = el('div',{class:'card', style:'border:1px solid #F5BCD0; background:#FFF6F9;'});
      uc.appendChild(el('h3',{style:'margin-top:0;'}, `⚠️ ${unlinked.length} BGC release${unlinked.length>1?'s':''} this month not linked to any company`));
      uc.appendChild(el('p',{class:'note', style:'margin:-4px 0 8px 0;'}, 'These are not in any company’s report yet. Open the entry in BGC Petty Cash / Borrowed Funds and set "Also record as company expense" if it is an expense. If it is already typed in a company’s Expenses tab, click "Already recorded" so it stops showing here. Salaries, fund transfers and change/abono rows are not listed.'));
      const t = el('table');
      t.appendChild(el('thead',{}, el('tr',{}, ['Fund','Date','Voucher','Particulars','Tag','Amount',''].map(h=>el('th',{},h)))));
      const tb = el('tbody');
      unlinked.forEach(u=>{
        const tr = el('tr'); [u.fund,u.date,u.ref,u.particulars,u.tag].forEach(v=>{ const td = el('td',{style:'white-space:normal;'}, v); tr.appendChild(td); });
        tr.appendChild(el('td',{style:'text-align:right;'}, '₱'+money(u.amount)));
        const b = el('button',{type:'button', title:'Already typed in a company Expenses tab', style:'font-size:11px; padding:2px 8px; border:1px solid #E5D6EA; border-radius:999px; background:#fff; cursor:pointer;'}, '✓ Already recorded');
        b.addEventListener('click', async ()=>{
          const mod = MODULES.find(m=>m.key===u.modKey);
          const rows = await getModuleData(mod);
          const i = rows.findIndex(x=>x.id===u.id);
          if(i>-1){ rows[i] = { ...rows[i], recordedSeparately:true }; state.cache[mod.key] = rows; await saveRows(mod.key, rows); }
          draw();
        });
        tr.appendChild(el('td',{}, b));
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      uc.appendChild(el('div',{class:'tablewrap'}, t));
      resultsWrap.appendChild(uc);
    }

    resultsWrap.appendChild(sectionHead(group==='bticket' ? 'Where the money came from (info only — not part of the P&L)' : 'Cash & Bank'));
    if(group==='bticket'){
      const fs = await reportFundSources(group, month);
      const fc = el('div',{class:'card'});
      const t = el('table');
      t.appendChild(el('thead',{}, el('tr',{}, ['Source','Cash In','Cash Out','Net'].map(h=>el('th',{},h)))));
      const tb = el('tbody');
      fs.forEach(f=>{ tb.appendChild(el('tr',{},[ el('td',{}, f.source), el('td',{style:'text-align:right;'}, '₱'+money(f.cashIn)), el('td',{style:'text-align:right;'}, '₱'+money(f.cashOut)), el('td',{style:'text-align:right;'}, (f.cashIn-f.cashOut<0?'-':'')+'₱'+money(Math.abs(f.cashIn-f.cashOut))) ])); });
      t.appendChild(tb);
      fc.appendChild(el('div',{class:'tablewrap'}, t));
      fc.appendChild(el('p',{class:'note'}, 'BGC funds are shared by all companies, so their totals here include releases for Daimasu and Midori too.'));
      resultsWrap.appendChild(fc);
    } else {
      resultsWrap.appendChild(el('div',{class:'grid-summary'},[
        statBox('Total Cash In', '₱'+money(totalCashIn)),
        statBox('Total Cash Out', '₱'+money(totalCashOut)),
        statBox('Net Movement', '₱'+money(totalCashIn-totalCashOut)),
      ]));
    }

    resultsWrap.appendChild(sectionHead('Expenses'));
    resultsWrap.appendChild(el('div',{class:'grid-summary'},[
      statBox('Total Requested', '₱'+money(totalExpenses)),
      statBox('Liquidated', '₱'+money(totalLiquidated)),
      statBox('Unliquidated', '₱'+money(totalUnliquidated)),
    ]));
    resultsWrap.appendChild(buildCategoryBreakdown(expRows));
    resultsWrap.appendChild(buildBreakdownToggle('Expenses', expMod, sortedByDate(expRows, 'date')));
    const priorLiq = await priorMonthLiquidations(group, month);
    if(priorLiq.length){
      const pc = el('div',{class:'card', style:'background:#F4EEFA; border:1px solid #E2D6F0;'});
      pc.appendChild(el('h3',{style:'margin-top:0;'}, `🔁 Prior-month liquidations (${priorLiq.length})`));
      pc.appendChild(el('p',{class:'note', style:'margin:-4px 0 8px 0;'}, 'Cash advances released in an earlier month and liquidated this month. For information only — the expenses stay in the month of their receipts, and the change/abono is already in this month. Not added to the totals.'));
      const t = el('table'); t.appendChild(el('thead',{}, el('tr',{}, ['Released','Liquidated','Fund','Voucher','Particulars','Advance','Receipts','Result'].map(h=>el('th',{},h)))));
      const tb = el('tbody');
      priorLiq.forEach(x=> tb.appendChild(el('tr',{},[ el('td',{},x.released), el('td',{},x.liquidated), el('td',{},x.fund), el('td',{},x.ref), el('td',{style:'white-space:normal;'},x.particulars), el('td',{style:'text-align:right;'},'₱'+money(x.advance)), el('td',{style:'text-align:right;'},'₱'+money(x.spent)), el('td',{}, priorLiqDiffLabel(x)) ])));
      t.appendChild(tb); pc.appendChild(el('div',{class:'tablewrap'}, t));
      resultsWrap.appendChild(pc);
    }
    const lateRows = lateEntriesFor(expRows, month);
    if(lateRows.length){
      const lc = el('div',{class:'card', style:'background:#FFF6DC; border:1px solid #F2DFA6;'});
      lc.appendChild(el('h3',{style:'margin-top:0;'}, `🕓 Late entries — added after ${ymLabel(month)} ended (${lateRows.length}, ₱${money(lateRows.reduce((t,r)=>t+num(r.amount),0))})`));
      lc.appendChild(el('p',{class:'note', style:'margin:-4px 0 8px 0;'}, 'Already included in the totals above. Once you have told Sir Arnold (or it is fine as is), click "Noted" so it stops showing in Needs Attention.'));
      const markNoted = async (ids)=>{ const all = (await getModuleData(expMod)).map(x=> ids.includes(x.id) ? { ...x, _lateNoted:true } : x); state.cache[expMod.key] = all; await saveRows(expMod.key, all); draw(); };
      const t = el('table'); t.appendChild(el('thead',{}, el('tr',{}, ['Date','Description','Category','Amount','Added on',''].map(h=>el('th',{},h)))));
      const tb = el('tbody');
      lateRows.forEach(r=>{
        let act;
        if(r._lateNoted) act = el('span',{style:'color:#2E7D5B; font-size:11.5px; font-weight:600;'}, '✓ Noted');
        else { act = el('button',{type:'button', style:'font-size:11px; padding:2px 9px; border:1px solid #E5C76B; border-radius:999px; background:#fff; cursor:pointer;'}, '✓ Noted'); act.addEventListener('click', ()=> markNoted([r.id])); }
        tb.appendChild(el('tr',{},[ el('td',{}, r.date), el('td',{style:'white-space:normal;'}, r.description||''), el('td',{}, r.category||''), el('td',{style:'text-align:right;'}, '₱'+money(r.amount)), el('td',{}, new Date(num(r._seq)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})), el('td',{}, act) ]));
      });
      t.appendChild(tb); lc.appendChild(el('div',{class:'tablewrap'}, t));
      const open = lateRows.filter(r=>!r._lateNoted);
      if(open.length>1){ const all = el('button',{type:'button', class:'savebtn secondary', style:'width:auto; padding:6px 14px; margin-top:8px;'}, '✓ Mark all as noted'); all.addEventListener('click', ()=> markNoted(open.map(r=>r.id))); lc.appendChild(all); }
      resultsWrap.appendChild(lc);
    }

    resultsWrap.appendChild(sectionHead('Payroll'));
    resultsWrap.appendChild(el('div',{class:'grid-summary'},[
      statBox('Declared Gross', '₱'+money(totalGross)),
      statBox('Actual Pay', '₱'+money(laborRows.reduce((t,r)=>t+num(r.actualPay),0))),
      statBox('Employer Mandatory Share', '₱'+money(totalEmployerShare)),
      statBox('Total Labor Cost', '₱'+money(totalLaborCost)),
    ]));
    if(group==='bticket'){
      const split = REPORT_ENTITIES.bticket.map(ent=>{ const rs = laborRows.filter(r=>r.entity===ent); return statBox(ent+' ('+rs.length+')', '₱'+money(rs.reduce((t,r)=>t+num(r.totalLaborCost),0))); });
      resultsWrap.appendChild(el('div',{class:'grid-summary', style:'margin-top:8px;'}, split));
    }
    resultsWrap.appendChild(buildBreakdownToggle('Labor Cost', laborMod, sortedByDate(laborRows, 'payDate')));

    resultsWrap.appendChild(sectionHead('P&L Summary'));
    const netIncome = totalSales - totalExpenses - totalLaborCost;
    const plCard = el('div',{class:'card'});
    plCard.appendChild(el('p',{style:'font-size:13px; color:var(--ink-soft); margin:0 0 12px 0; line-height:1.5;'},
      buildPLSummarySentence(totalSales, totalExpenses, totalLaborCost, expRows)));
    const plRow = (label, value, bold)=> el('div',{style:`display:flex; justify-content:space-between; padding:6px 0; ${bold?'border-top:1px solid var(--line); margin-top:6px; font-weight:700; font-size:14.5px;':'font-size:13.5px;'}`},[
      el('span',{}, label), el('span',{}, (value<0?'-':'')+'₱'+money(Math.abs(value))),
    ]);
    plCard.appendChild(plRow('Total Sales', totalSales));
    plCard.appendChild(plRow('Less: Total Expenses', -totalExpenses));
    plCard.appendChild(plRow('Less: Total Labor Cost (Actual Pay + Employer Share)', -totalLaborCost));
    plCard.appendChild(plRow('Net Income', netIncome, true));
    if(mandRows.length){
      const cats = {}; mandRows.forEach(r=>{ const k = (r.category||'').replace(/^\s*Employee'?s Mandatories:?\s*/i,'') || 'Other'; cats[k] = (cats[k]||0)+num(r.amount); });
      plCard.appendChild(el('div',{style:'margin-top:12px; padding:10px 12px; background:#F7F4FD; border-radius:10px; font-size:12.5px;'},[
        el('div',{style:'display:flex; justify-content:space-between; font-weight:700;'},[ el('span',{}, 'ℹ️ Mandatories remitted this month (already in Labor Cost — not deducted again)'), el('span',{}, '₱'+money(totalMand)) ]),
        el('div',{style:'color:var(--ink-soft); margin-top:4px;'}, Object.entries(cats).map(([k,v])=>`${k} ₱${money(v)}`).join(' · '))
      ]));
    }
    resultsWrap.appendChild(plCard);
  }
  monthInput.addEventListener('change', draw);
  await draw();
}

/* ============================= DASHBOARD ============================= */
async function renderDashboard(container){
  container.innerHTML = '';
  container.appendChild(el('div',{class:'pagehead'},[
    el('h1',{},'Dashboard'),
    el('p',{},'Live snapshot pulled automatically from every module below.'),
  ]));
  container.appendChild(sharedFlag());

  /* --- Needs Attention --- */
  const attentionItems = [];

  const daimasuMod = MODULES.find(m=>m.key==='daimasu_sales');
  const daimasuRows = withComputed(daimasuMod, await getModuleData(daimasuMod));
  const daimasuChecks = daimasuRows.filter(r=>r.floatCheck==='CHECK');
  if(daimasuChecks.length) attentionItems.push({text:`${daimasuChecks.length} Daimasu Sales entr${daimasuChecks.length>1?'ies':'y'} with a Float Check mismatch`, route:'daimasu_sales'});

  const midoriMod = MODULES.find(m=>m.key==='midori_sales');
  const midoriRows = withComputed(midoriMod, await getModuleData(midoriMod));
  const midoriFloatChecks = midoriRows.filter(r=>r.floatCheck==='CHECK');
  const midoriShiftChecks = midoriRows.filter(r=>r.check==='CHECK');
  if(midoriFloatChecks.length) attentionItems.push({text:`${midoriFloatChecks.length} Midori Sales entr${midoriFloatChecks.length>1?'ies':'y'} with a Float Check mismatch`, route:'midori_sales'});
  if(midoriShiftChecks.length) attentionItems.push({text:`${midoriShiftChecks.length} Midori Sales entr${midoriShiftChecks.length>1?'ies':'y'} with a Shift Total mismatch`, route:'midori_sales'});
  const midoriDepositMissingExpense = midoriRows.filter(r=>num(r.actualDeposit)>0 && (r.otherExpense==='' || r.otherExpense===undefined || r.otherExpense===null));
  if(midoriDepositMissingExpense.length) attentionItems.push({text:`${midoriDepositMissingExpense.length} Midori Sales deposit day${midoriDepositMissingExpense.length>1?'s':''} missing Other Expense — Float Check may be inaccurate`, route:'midori_sales'});
  if(midoriRows.length){
    const sorted = sortedByDate(midoriRows, 'date');
    const latestRow = sorted[sorted.length-1];
    const depositRows = sorted.filter(r=>num(r.actualDeposit)>0);
    const lastDeposit = depositRows.length ? depositRows[depositRows.length-1] : null;
    const anchorDate = lastDeposit ? lastDeposit.date : sorted[0].date;
    const daysSince = Math.round((new Date(latestRow.date) - new Date(anchorDate)) / 86400000);
    if(daysSince >= MIDORI_DEPOSIT_ALERT_DAYS) attentionItems.push({text:`Midori: ${daysSince} days since last deposit — cash on hand may be building up`, route:'midori_sales'});
  }

  /* Pending Requests with a Due Date coming up (or already passed) and not
     yet marked Proceed -- this is what surfaces Last Pay and similar
     time-sensitive items without Danna needing to open that tab to check. */
  const prMod = MODULES.find(m=>m.key==='pending_requests');
  const prRowsForReminders = await getModuleData(prMod);
  const today0 = new Date(); today0.setHours(0,0,0,0);
  const dueSoon = prRowsForReminders.filter(r=>{
    if(isPendingRequestResolved(r.status) || !r.dueDate) return false;
    const due = new Date(r.dueDate+'T00:00:00');
    const daysUntil = Math.round((due - today0) / 86400000);
    return daysUntil <= DUE_DATE_ALERT_DAYS;
  });
  const overdue = dueSoon.filter(r=> new Date(r.dueDate+'T00:00:00') < today0);
  const upcoming = dueSoon.filter(r=> new Date(r.dueDate+'T00:00:00') >= today0);
  if(overdue.length || upcoming.length){
    const rowsForTable = [...overdue, ...upcoming].map(r=>{
      const daysUntilDue = Math.round((new Date(r.dueDate+'T00:00:00') - today0) / 86400000);
      const when = daysUntilDue < 0 ? `${-daysUntilDue}d overdue` : (daysUntilDue===0 ? 'Due today' : `Due in ${daysUntilDue}d`);
      return { cells:[r.description||'', r.company||'', r.amount!==undefined&&r.amount!=='' ? '₱'+money(r.amount) : '', monthDisplay(r.dueDate), when], overdue: daysUntilDue<0 };
    });
    attentionItems.push({
      heading: `${overdue.length+upcoming.length} pending request${(overdue.length+upcoming.length)>1?'s':''} due or overdue`,
      route: 'pending_requests',
      tableHeaders: ['Description','Company','Amount','Due Date','Status'],
      tableRows: rowsForTable,
    });
  }

  /* Office Dues: a recurring "Due Day of the month" rather than a one-time
     date. Flag it if that day has arrived or is within the alert window
     AND this month's status in the payment log isn't already settled
     (Paid / Skip / End of contract). If no log entry exists yet for the
     current month at all, that counts as not-yet-settled too. */
  const officeDuesMod = MODULES.find(m=>m.key==='office_dues');
  const officeDuesRows = officeDuesMod ? await getModuleData(officeDuesMod) : [];
  const now = new Date();
  const curMonthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const SETTLED_STATUSES = ['Paid','Skip','End of contract','Covered by advance'];
  const todayMid = new Date(); todayMid.setHours(0,0,0,0);
  const duesDaysUntil = r=>{
    const due = officeDuesDueDate(officeDuesCurrentPeriod(r).month, r.dueDay);
    return due ? Math.round((due - todayMid)/86400000) : null;
  };
  const duesFlagged = officeDuesRows.filter(r=>{
    const d = duesDaysUntil(r);
    if(d===null) return false;
    if(SETTLED_STATUSES.includes(officeDuesDisplayStatus(r))) return false;
    return d <= DUE_DATE_ALERT_DAYS;
  });
  if(duesFlagged.length){
    const rowsForTable = duesFlagged.map(r=>{
      const daysUntilDue = duesDaysUntil(r);
      const when = daysUntilDue < 0 ? `${-daysUntilDue}d overdue` : (daysUntilDue===0 ? 'Due today' : `Due in ${daysUntilDue}d`);
      const amt = officeDuesCurrentAmount(r);
      return { cells:[r.payee||'', r.detail||'', r.category||'', amt!==undefined&&amt!=='' ? '₱'+money(amt) : '', r.dueDay, when], overdue: daysUntilDue<0 };
    });
    attentionItems.push({
      heading: `${duesFlagged.length} Office Due${duesFlagged.length>1?'s':''} needing attention this month`,
      route: 'office_dues',
      tableHeaders: ['Payee','Detail','Category','Amount','Due Day','Status'],
      tableRows: rowsForTable,
    });
  }

  /* Security deposits still held by the lessor when the contract ends
     within 30 days (or has already ended) — time to follow up the refund. */
  const depositDue = officeDuesRows.filter(r=>{
    if(!(num(r.depositAmount) > 0) || !r.contractEnd) return false;
    if(r.depositStatus && r.depositStatus!=='Held by lessor') return false;
    return Math.round((isoToDate(r.contractEnd) - todayMid)/86400000) <= 30;
  });
  if(depositDue.length){
    attentionItems.push({
      heading: `${depositDue.length} Security Deposit${depositDue.length>1?'s':''} to follow up (contract ending)`,
      route: 'office_dues',
      tableHeaders: ['Payee','Detail','Deposit','Contract End','Status'],
      tableRows: depositDue.map(r=>{
        const d = Math.round((isoToDate(r.contractEnd) - todayMid)/86400000);
        return { cells:[r.payee||'', r.detail||'', '₱'+money(r.depositAmount), mdy(isoToDate(r.contractEnd)), d<0 ? `Ended ${-d}d ago` : `Ends in ${d}d`], overdue: d<0 };
      }),
    });
  }

  const ccMod = MODULES.find(m=>m.key==='creditcards');
  const ccRows = withComputed(ccMod, await getModuleData(ccMod));
  const cardholders = (ccMod.fields.find(f=>f.key==='cardholder')||{}).options || [];
  const minAvailableMap = await loadObj('credit_card_min_available', {});
  const ccRecurring = await ccLoadRecurring();
  const lowCards = [];
  cardholders.forEach(name=>{
    const minThreshold = (minAvailableMap[name]!==undefined && minAvailableMap[name]!=='') ? num(minAvailableMap[name]) : CREDIT_CARD_MIN_AVAILABLE;
    const e = ccEstimate(name, ccRows, ccRecurring, minThreshold);
    if(e && e.needTopUp>0) lowCards.push(`${name} (top up ₱${money(e.needTopUp)}${e.lowNow ? '' : ' before upcoming subscriptions'})`);
  });
  if(lowCards.length) attentionItems.push({text:`${lowCards.length} credit card${lowCards.length>1?'s':''} need${lowCards.length>1?'':'s'} a top-up: ${lowCards.join(', ')}`, route:'creditcards'});

  try{ (await extraAttentionItems()).forEach(x=> attentionItems.push(x)); }catch(e){ console.error(e); }
  const attentionCard = el('div',{class:'card'});
  if(attentionItems.length){
    attentionCard.style.border = '1px solid #F3C6CB';
    attentionCard.appendChild(el('h3',{style:'color:var(--danger);'}, '🔔 Needs Attention'));
    attentionItems.forEach(item=>{
      if(item.tableRows){
        const block = el('div',{style:'padding:10px 0; border-bottom:1px solid #F2EEF4;'});
        const headRow = el('div',{style:'display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;'});
        headRow.appendChild(el('span',{style:'font-size:13px; font-weight:700;'}, item.heading));
        const goBtn = el('button',{style:'flex-shrink:0; font-size:11px; padding:5px 10px; border-radius:6px; border:1px solid var(--danger); background:#fff; color:var(--danger); cursor:pointer;'}, 'View →');
        goBtn.addEventListener('click', ()=>{ if(item.reportMonth) state.reportMonth = item.reportMonth; state.route=item.route; render(); });
        headRow.appendChild(goBtn);
        block.appendChild(headRow);
        const table = el('table',{style:'width:100%; border-collapse:collapse; font-size:12px;'});
        const thead = el('tr',{}, item.tableHeaders.map(h=>el('th',{style:'text-align:left; padding:4px 8px; background:#FBF3F5; border-bottom:1px solid #F2EEF4; font-weight:600; color:var(--ink-soft);'}, h)));
        table.appendChild(el('thead',{},thead));
        const tbody = el('tbody');
        item.tableRows.forEach(r=>{
          const tr = el('tr');
          r.cells.forEach((c,i)=>{
            const isLast = i===r.cells.length-1;
            const td = el('td',{style:`padding:4px 8px; border-bottom:1px solid #F8F5F6;${isLast && r.overdue ? ' color:var(--danger); font-weight:600;' : ''}`}, String(c));
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        block.appendChild(table);
        attentionCard.appendChild(block);
      } else {
        const row = el('div',{style:'display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F2EEF4;'});
        row.appendChild(el('span',{style:'font-size:13px;'}, item.text));
        const goBtn = el('button',{style:'flex-shrink:0; font-size:11px; padding:5px 10px; border-radius:6px; border:1px solid var(--danger); background:#fff; color:var(--danger); cursor:pointer;'}, 'View →');
        goBtn.addEventListener('click', ()=>{ if(item.reportMonth) state.reportMonth = item.reportMonth; state.route=item.route; render(); });
        row.appendChild(goBtn);
        attentionCard.appendChild(row);
      }
    });
  } else {
    attentionCard.appendChild(el('h3',{style:'color:#2f6e42;'}, '✅ All Clear'));
    attentionCard.appendChild(el('p',{style:'font-size:12.5px; color:var(--ink-soft); margin:0;'}, 'No Float Check mismatches, shift mismatches, low credit cards, or overdue Midori deposits right now.'));
  }
  /* Minimize / maximize: the whole list can be folded to one line (remembered
     on this device), and each item's table is folded until you open it. */
  if(attentionItems.length){
    const MINKEY = STORAGE_PREFIX+'meta:attnMin';
    if(!state.attnOpen) state.attnOpen = {};
    const h3 = attentionCard.querySelector('h3');
    const body = el('div');
    [...attentionCard.children].filter(c=>c!==h3).forEach(c=> body.appendChild(c));
    body.querySelectorAll('table').forEach(tbl=>{
      const block = tbl.parentElement, headRow = block.firstChild, title = headRow.firstChild;
      const key = title.textContent;
      const tog = el('button',{type:'button', style:'flex-shrink:0; font-size:11px; padding:4px 9px; border-radius:6px; border:1px solid #E5D6EA; background:#fff; color:var(--ink-soft); cursor:pointer; margin-left:auto;'});
      const apply = ()=>{ const open = !!state.attnOpen[key]; tbl.style.display = open ? '' : 'none'; tog.textContent = open ? '▾ Hide details' : '▸ Show details'; };
      const flip = ()=>{ state.attnOpen[key] = !state.attnOpen[key]; apply(); };
      tog.addEventListener('click', flip);
      title.style.cursor = 'pointer'; title.addEventListener('click', flip);
      headRow.insertBefore(tog, headRow.children[1]);
      apply();
    });
    const minimized = localStorage.getItem(MINKEY)==='1';
    const bar = el('div',{style:'display:flex; align-items:center; gap:10px;'});
    h3.textContent = `🔔 Needs Attention (${attentionItems.length})`;
    h3.style.margin = '0';
    const mm = el('button',{type:'button', style:'margin-left:auto; font-size:11.5px; padding:5px 12px; border-radius:999px; border:1px solid #F3C6CB; background:#fff; color:var(--danger); cursor:pointer;'});
    const hint = el('span',{style:'font-size:12px; color:var(--ink-soft);'});
    const applyMin = (m)=>{ body.style.display = m ? 'none' : ''; mm.textContent = m ? '▸ Show' : '▾ Minimize'; hint.textContent = m ? 'hidden for now — open it when you are ready' : ''; body.style.marginTop = m ? '0' : '10px'; };
    mm.addEventListener('click', ()=>{ const m = body.style.display!=='none'; try{ localStorage.setItem(MINKEY, m?'1':'0'); }catch(e){} applyMin(m); });
    bar.appendChild(h3); bar.appendChild(hint); bar.appendChild(mm);
    attentionCard.innerHTML = '';
    attentionCard.appendChild(bar); attentionCard.appendChild(body);
    applyMin(minimized);
  }
  container.appendChild(attentionCard);

  const screenshotCard = el('div',{class:'card'});
  screenshotCard.appendChild(el('h3',{}, '📸 Screenshot Summary for Sir Kento'));
  screenshotCard.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft); margin:-6px 0 12px 0;'},
    'Same details as the notepad version — company name, itemized entries, Less/Cash Available, per-account transactions — plus Daimasu & Midori\'s daily sales totals, just laid out as a card you can screenshot instead of copy-pasting text.'));
  const ssGrid = el('div',{class:'form-grid', style:'align-items:end;'});
  const ssDateWrap = el('div',{class:'field'});
  ssDateWrap.appendChild(el('label',{},'Date'));
  const ssDateInput = el('input',{type:'date'});
  ssDateInput.value = todayISO();
  ssDateWrap.appendChild(ssDateInput);
  ssGrid.appendChild(ssDateWrap);
  const ssCompanyWrap = el('div',{class:'field'});
  ssCompanyWrap.appendChild(el('label',{},'Company Name'));
  const ssCompanyInput = el('input',{type:'text'});
  ssCompanyInput.value = 'Betrnk Tours';
  ssCompanyWrap.appendChild(ssCompanyInput);
  ssGrid.appendChild(ssCompanyWrap);
  const ssLessPCWrap = el('div',{class:'field'});
  ssLessPCWrap.appendChild(el('label',{},'Less — Petty Cash (Other Proj Expense)'));
  const ssLessPCInput = el('input',{type:'number', step:'any'});
  ssLessPCInput.value = 0;
  ssLessPCWrap.appendChild(ssLessPCInput);
  ssGrid.appendChild(ssLessPCWrap);
  const ssLessBFWrap = el('div',{class:'field'});
  ssLessBFWrap.appendChild(el('label',{},'Less — Borrowed Funds (Other Proj Expenses)'));
  const ssLessBFInput = el('input',{type:'number', step:'any'});
  ssLessBFInput.value = 0;
  ssLessBFWrap.appendChild(ssLessBFInput);
  ssGrid.appendChild(ssLessBFWrap);
  screenshotCard.appendChild(ssGrid);
  const ssBtn = el('button',{class:'btn', style:'margin-top:10px;'}, 'Generate Summary');
  ssBtn.addEventListener('click', ()=> openScreenshotSummary(ssDateInput.value || todayISO(), ssCompanyInput.value, ssLessPCInput.value, ssLessBFInput.value));
  screenshotCard.appendChild(ssBtn);
  container.appendChild(screenshotCard);

  const cashGroups = ['bticket','daimasu','midori'];
  const cashCards = [];
  const bankModD = MODULES.find(m=>m.key==='bank_balances');
  const bankCompD = withComputed(bankModD, await getModuleData(bankModD));
  for(const g of cashGroups){
    const accts = BANK_ACCOUNTS.filter(a=> BANK_ACCOUNT_TO_CASHBANK[a]===g+'_cashbank');
    let total = 0, any = false;
    accts.forEach(a=>{ const rs = bankCompD.filter(r=>r.account===a); if(rs.length){ any = true; total += num(rs[rs.length-1].runningBalance); } });
    cashCards.push(statBox(GROUPS[g].label+' — Bank Balance', any ? '₱'+money(total) : '—'));
  }
  container.appendChild(sectionHead('Cash & Bank Position'));
  container.appendChild(el('div',{class:'grid-summary'}, cashCards));

  const bgcCards = [];
  for(const key of ['bgc_pettycash','bgc_borrowed']){
    const mod = MODULES.find(m=>m.key===key);
    const rows = withComputed(mod, await getModuleData(mod));
    const last = rows[rows.length-1];
    bgcCards.push(statBox(mod.label, last? '₱'+money(last.runningBalance) : '—'));
  }
  container.appendChild(sectionHead('BGC / Head Office Funds'));
  container.appendChild(el('div',{class:'grid-summary'}, bgcCards));

  const prRowsAll = await getModuleData(MODULES.find(m=>m.key==='pending_requests'));
  const expCards = [], prCards = [];
  for(const g of cashGroups){
    const mod = MODULES.find(m=>m.key===g+'_expenses');
    const rows = await getModuleData(mod);
    const unliq = rows.filter(r=>isUnliquidatedRow(r)).reduce((s,r)=>s+num(r.amount),0);
    const companyName = Object.entries(COMPANY_EXPENSE_KEY).find(([name,key])=>key===mod.key)[0];
    const unpaidPending = unpaidPendingTotalForCompany(prRowsAll, companyName);
    expCards.push(statBox(GROUPS[g].label, '₱'+money(unliq)));
    prCards.push(statBox(GROUPS[g].label, '₱'+money(unpaidPending)));
  }
  /* Two separate cards so unpaid bills (rent, utilities…) sitting in Pending
     Requests are not mixed up with cash advances still out with people. */
  container.appendChild(sectionHead('Expenses — Unliquidated Cash Advances'));
  container.appendChild(el('div',{class:'grid-summary'}, expCards));
  container.appendChild(sectionHead('Pending Requests — Not Yet Paid'));
  container.appendChild(el('div',{class:'grid-summary'}, prCards));
  // (Fund Request summary card removed — it duplicated the Fund Request tab.)
}
function sectionHead(text){ return el('h3',{style:'margin:22px 0 10px 0; font-size:14px;'}, text); }


/* ============================= AUDIT TRAIL PAGE ============================= */
function auditLocalDay(t){ const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function auditTimeLabel(t){ return new Date(t).toLocaleString('en-PH',{month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}); }
const AUDIT_ACTION_STYLE = {
  Deleted:'background:#FCEAEC; color:#B4434F;', Removed:'background:#FCEAEC; color:#B4434F;', Unlocked:'background:#FCF1E3; color:#A5641A;', Unfunded:'background:#FCF1E3; color:#A5641A;',
  Added:'background:#EAF3FB; color:#2F6BA3;', Saved:'background:#EAF3FB; color:#2F6BA3;', Edited:'background:#F3EEFA; color:#6D4F99;',
  Funded:'background:#EAF6EE; color:#2f6e42;', Locked:'background:#EAF6EE; color:#2f6e42;', Reviewed:'background:#EAF6EE; color:#2f6e42;',
  'Not needed':'background:#F4F1F5; color:#7a6f80;', Restored:'background:#EAF3FB; color:#2F6BA3;',
};
function auditReviewHTML(entries, opts){

  const rows = entries.map((e,i)=>`<tr>
    <td>${i+1}</td><td style="white-space:nowrap;">${esc(auditTimeLabel(e.t))}</td><td>${esc(e.mod||'')}</td>

    <td>${esc(e.label||'')}</td><td class="det">${esc(e.detail||'')}</td>
    <td style="text-align:center;">${o.interactive ? '<input type="checkbox" class="ck">' : '<span class="box"></span>'}</td>
    <td>${o.interactive ? '<input type="text" class="rm" placeholder="Remarks">' : ''}</td></tr>`).join('');
  const counts = {};
  entries.forEach(e=>{ counts[e.action] = (counts[e.action]||0)+1; });
  const chips = Object.entries(counts).map(([a,n])=>`<span class="act" style="${AUDIT_ACTION_STYLE[a]||''}">${esc(a)}: ${n}</span>`).join(' ');
  const script = o.interactive ? `<script>
function notes(){
  var trs=[].slice.call(document.querySelectorAll('tbody tr')); var ck=0, lines=[];
  trs.forEach(function(tr){ var c=tr.querySelector('.ck'), r=tr.querySelector('.rm'); if(c&&c.checked) ck++;
    if(r&&r.value.trim()){ var td=tr.children; lines.push('#'+td[0].textContent+' '+td[1].textContent+' | '+td[2].textContent+' | '+td[3].textContent.trim()+' | '+td[4].textContent+' => '+r.value.trim()); } });
  var txt='Audit review (${esc(o.period||'')}): checked '+ck+' of '+trs.length+' changes.'+(lines.length?'\\n\\nRemarks:\\n'+lines.join('\\n'):'\\n\\nNo remarks.');
  var ta=document.getElementById('out'); ta.style.display='block'; ta.value=txt; ta.select();
  try{ navigator.clipboard.writeText(txt); document.getElementById('cmsg').textContent='Copied — paste it back to Danna.'; }catch(e){ try{document.execCommand('copy');}catch(_){} }
}
function allck(v){ [].slice.call(document.querySelectorAll('.ck')).forEach(function(c){c.checked=v;}); }
<\/script>` : '';
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Audit Trail — ${esc(o.period||'')}</title>
<style>
  body{ font-family: Arial, Helvetica, sans-serif; color:#2E2A3B; padding:22px; background:#FFF8FB; }
  .doc{ max-width:1100px; margin:0 auto; background:#fff; border:1px solid #F5D9E6; border-radius:14px; padding:22px; }
  h1{ font-size:19px; margin:0 0 4px 0; color:#9b3d6e; } .sub{ font-size:12px; color:#6b6578; margin-bottom:12px; }
  table{ width:100%; border-collapse:collapse; font-size:11.5px; } th{ background:#FDEFF5; text-align:left; padding:6px; border-bottom:1px solid #F5D9E6; }
  td{ padding:5px 6px; border-bottom:1px solid #F7EEF3; vertical-align:top; } .det{ color:#6b6578; max-width:320px; }
  .act{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 8px; margin:1px 0; }
  .box{ display:inline-block; width:13px; height:13px; border:1.5px solid #999; border-radius:3px; }
  .rm{ width:130px; font-size:11px; padding:3px 5px; border:1px solid #E5D6EA; border-radius:5px; }
  .sig{ display:flex; gap:40px; margin-top:34px; font-size:12px; } .sig div{ flex:1; border-top:1px solid #555; padding-top:4px; }
  .bar{ margin:12px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .bar button{ padding:7px 14px; border-radius:8px; border:1px solid #E5C2D6; background:#FDEFF5; cursor:pointer; font-size:12px; }
  textarea{ display:none; width:100%; height:130px; margin-top:8px; font-size:12px; }
  @media print{ .bar, textarea{ display:none !important; } body{ background:#fff; padding:0; } .doc{ border:none; } }
</style></head><body><div class="doc">
  <h1>🕵️ Accounting Dashboard — Audit Trail</h1>
  <div class="sub">Period: <b>${esc(o.period||'')}</b> · ${entries.length} change${entries.length===1?'':'s'} · Generated ${esc(new Date().toLocaleString('en-PH'))} · Prepared by Ma. Danna Elyza Ruzol</div>
  <div style="margin-bottom:10px;">${chips}</div>

function summarizeDeletedRow(row){
  const parts = [];
  if(row.voucherRef) parts.push(row.voucherRef);
  if(row.voucherNo) parts.push(row.voucherNo);
  const desc = row.description || row.particulars || row.detail || row.payee || '';
  if(desc) parts.push(desc);
  const amt = row.amount ?? row.cashOut ?? row.cashIn ?? row.balance;
  if(amt!==undefined && amt!=='' && amt!==0) parts.push('₱'+money(amt));
  if(row.date) parts.push(dmy2(row.date));
  return parts.filter(Boolean).join(' — ') || '(no description)';
}

      tbody.appendChild(tr);
    });
    const totalTr = el('tr',{class:'totalrow'});
    ['TOTAL','','','','','', sumVat?money(sumVat):'—', sumWtax?money(sumWtax):'—', money(sumAmt)].forEach((v,i)=>{
      totalTr.appendChild(el('td',{style: i>=6 ? 'text-align:right; font-weight:700;' : 'font-weight:700;'}, String(v)));
    });
    tbody.appendChild(totalTr);
    table.appendChild(tbody);
    card.appendChild(table);
    container.appendChild(card);

    // Per-payee 2307 generation -- only payees with actual withholding tax
    // for this period (2307 certifies tax withheld, not VAT alone).
    const byPayee = {};
    group.filter(l=>l.withholdingTax>0).forEach(l=>{
      const key = (l.payee||'(no name)') + '|' + (l.tin||'');
      (byPayee[key] = byPayee[key] || {payee:l.payee, tin:l.tin, lines:[]}).lines.push(l);
    });
    const payeeKeys = Object.keys(byPayee);
    if(payeeKeys.length){
      const genCard = el('div',{class:'card', style:'margin-top:-10px;'});
      genCard.appendChild(el('h4',{style:'margin:0 0 8px 0; font-size:12.5px; color:var(--ink-soft);'}, `Suppliers with Withholding Tax this period — ${regName}`));
      payeeKeys.forEach(key=>{
        const p = byPayee[key];
        const totalWtax = p.lines.reduce((s,l)=>s+l.withholdingTax,0);
        const row = el('div',{style:'display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #F2EEF4;'});
        row.appendChild(el('span',{style:'font-size:12.5px;'}, `${p.payee||'(no name)'} — TIN ${p.tin||'N/A'} — Total Withheld ₱${money(totalWtax)}`));
        const genBtn = el('button',{class:'btn small ghost'}, '🖨️ Generate 2307');
        genBtn.addEventListener('click', ()=> printBIRForm2307(regName, p, state[modeKey], state[monthKey], state[quarterKey]));
        row.appendChild(genBtn);
        genCard.appendChild(row);
      });
      container.appendChild(genCard);
    }
  });

  const grandVat = filtered.reduce((s,l)=>s+l.vatAmount,0);
  const grandWtax = filtered.reduce((s,l)=>s+l.withholdingTax,0);
  const grandAmt = filtered.reduce((s,l)=>s+l.amount,0);
  const grandCard = el('div',{class:'card', style:'background:#FBF6FA;'});
  grandCard.appendChild(el('div',{style:'display:flex; justify-content:space-between; font-weight:700; font-size:14px;'},[
    el('span',{}, 'Grand Total — All Entities'),
    el('span',{}, `VAT ₱${money(grandVat)} · Withholding Tax ₱${money(grandWtax)} · Amount ₱${money(grandAmt)}`),
  ]));
  container.appendChild(grandCard);
}

async function renderRecycleBin(container){
  container.innerHTML = '';
  container.appendChild(el('div',{class:'pagehead'},[ el('h1',{},'🗑️ Recycle Bin') ]));
  container.appendChild(el('p',{style:'font-size:13px; color:var(--ink-soft); margin-top:-8px;'},
    `Deleted entries land here instead of disappearing for good — restore one if it was removed by accident. Keeps the most recent ${RECYCLE_BIN_MAX} deletions; older ones drop off automatically.`));

  const bin = await loadObj('recycle_bin', []);
  if(!bin.length){
    container.appendChild(el('div',{class:'card'}, el('p',{style:'color:var(--ink-soft);'}, 'Nothing here right now — deleted entries will show up as they happen.')));
    return;
  }

  const listCard = el('div',{class:'card', style:'padding:0; overflow:hidden;'});
  bin.forEach(entry=>{
    const mod = MODULES.find(m=>m.key===entry.modKey);
    const modLabel = mod ? mod.label : entry.modKey;
    const when = new Date(entry.deletedAt);
    const row = el('div',{style:'display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #F2EEF4;'});
    const infoCol = el('div',{});
    infoCol.appendChild(el('div',{style:'font-size:13px; font-weight:700;'}, summarizeDeletedRow(entry.row)));
    const companionNote = entry.companions && entry.companions.length
      ? ` + ${entry.companions.length} linked ${entry.companions.length>1?'entries':'entry'}`
      : '';
    infoCol.appendChild(el('div',{style:'font-size:11.5px; color:var(--ink-soft); margin-top:2px;'},
      `From: ${modLabel}${companionNote} · Deleted ${when.toLocaleDateString('en-PH')} ${when.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})}`));
    row.appendChild(infoCol);
    const btnRow = el('div',{style:'display:flex; gap:6px; flex-shrink:0;'});
    const restoreBtn = el('button',{class:'btn small'}, '↩️ Restore');
    restoreBtn.addEventListener('click', async ()=>{
      await restoreFromRecycleBin(entry.id);
      render();
    });
    const purgeBtn = el('button',{class:'btn small ghost'}, '🗑️ Delete Forever');
    purgeBtn.addEventListener('click', async ()=>{
      if(confirm('Permanently delete this entry? This cannot be undone.')){
        await purgeFromRecycleBin(entry.id);
        render();
      }
    });
    btnRow.appendChild(restoreBtn);
    btnRow.appendChild(purgeBtn);
    row.appendChild(btnRow);
    listCard.appendChild(row);
  });
  container.appendChild(listCard);
}
