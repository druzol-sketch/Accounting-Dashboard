async function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(buildNav());
  const main = el('div',{class:'main'});
  main.appendChild(el('div',{class:'loading'}, 'Loading…'));
  root.appendChild(main);
  const _bb = backupBanner();

  if(state.route === 'dashboard'){
    await renderDashboard(main);
  } else if(state.route === 'recycle_bin'){
    await renderRecycleBin(main);
  } else if(state.route === 'audit_trail'){
    await renderAuditTrail(main);
  } else if(state.route === 'wtax_report'){
    await renderWithholdingTaxReport(main);
  } else if(state.route === 'fund_request'){
    await renderFundRequest(main);
  } else if(state.route === 'bank_balances'){
    await renderBankReconciliation(main);
  } else if(['bticket_cashbank','daimasu_cashbank','midori_cashbank'].includes(state.route)){
    await renderCashBankSheet(main, MODULES.find(m=>m.key===state.route));
  } else if(state.route.endsWith('_monthly')){
    await renderMonthlyReport(main, state.route.replace('_monthly',''));
  } else {
    const mod = MODULES.find(m=>m.key===state.route);
    if(mod) await renderModulePage(main, mod);
  }
  if(_bb) main.insertBefore(_bb, main.firstChild);
}

render();

// One-time bottom-of-page walking mascot (independent of render() re-draws,
// so its animation doesn't restart every time you edit something).
(function initBottomMascot(){
  const walker = document.createElement('div');
  walker.className = 'bottom-mascot';
  walker.innerHTML = `
    <svg width="60" height="60" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="36" cy="66" rx="20" ry="4" fill="#B0567C" opacity="0.15"/>
      <path d="M14 40 Q14 14 36 14 Q58 14 58 40 L58 46 Q58 54 50 54 L22 54 Q14 54 14 46 Z" fill="#F3C9DC"/>
      <ellipse cx="36" cy="42" rx="16" ry="14" fill="#FFE3EE"/>
      <path d="M27 12 L24 20 L31 17 Z" fill="#D98CB3"/>
      <path d="M45 12 L48 20 L41 17 Z" fill="#D98CB3"/>
      <circle cx="27" cy="36" r="9" fill="#FFFFFF"/>
      <circle cx="45" cy="36" r="9" fill="#FFFFFF"/>
      <circle cx="27" cy="37" r="4" fill="#5A3E4A"/>
      <circle cx="45" cy="37" r="4" fill="#5A3E4A"/>
      <circle cx="25.5" cy="35.5" r="1.2" fill="#fff"/>
      <circle cx="43.5" cy="35.5" r="1.2" fill="#fff"/>
      <path d="M33 44 L36 49 L39 44 Z" fill="#F0B429"/>
      <ellipse cx="15" cy="42" rx="6" ry="10" fill="#D98CB3" transform="rotate(-20 15 42)"/>
      <ellipse cx="57" cy="42" rx="6" ry="10" fill="#D98CB3" transform="rotate(20 57 42)"/>
      <ellipse cx="29" cy="58" rx="4" ry="2.4" fill="#F0B429"/>
      <ellipse cx="43" cy="58" rx="4" ry="2.4" fill="#F0B429"/>
    </svg>`;
  document.body.appendChild(walker);
  const face = walker.querySelector('svg'); face.classList.add('mascot-face');

  /* Its little rival: the Discrepancy monster. It chases the owl around the
     screen; when it gets close the owl fires a ✓ and it poofs — "Balanced!".
     You can also click it to balance it yourself. */
  const bug = document.createElement('div');
  bug.className = 'bug-monster';
  bug.title = 'Discrepancy monster — click to balance it!';
  bug.innerHTML = `
    <svg width="44" height="44" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="32" cy="58" rx="16" ry="3.5" fill="#6D4F99" opacity="0.15"/>
      <path d="M10 50 Q8 22 32 18 Q56 22 54 50 Q50 46 46 50 Q42 54 38 50 Q34 46 30 50 Q26 54 22 50 Q18 46 14 50 Q12 52 10 50 Z" fill="#C9B6EA"/>
      <path d="M20 12 L24 20 L27 16 Z" fill="#A98BD8"/><path d="M44 12 L40 20 L37 16 Z" fill="#A98BD8"/>
      <circle cx="24" cy="33" r="6" fill="#fff"/><circle cx="40" cy="33" r="6" fill="#fff"/>
      <circle cx="25" cy="34" r="3" fill="#3E2F55"/><circle cx="39" cy="34" r="3" fill="#3E2F55"/>
      <path d="M17 25 L29 29" stroke="#3E2F55" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M47 25 L35 29" stroke="#3E2F55" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M25 44 Q32 39 39 44" stroke="#3E2F55" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="32" y="15" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="#B4434F">-₱</text>
    </svg>`;
  document.body.appendChild(bug);

  const SIZE = 60, BSIZE = 44, LOOP_SEC = 42;
  const lines = ['✓ Balanced!','✨ Reconciled!','💕 No variance!','🔒 Locked in!','✓ All tallied!','🎀 Nothing missing!'];
  let s = 0, gap = 420, alive = true, shooting = false, respawnAt = 0, last = performance.now();
  const dims = ()=>{ const W = Math.max(120, window.innerWidth - 66), H = Math.max(120, window.innerHeight - 70), T = 10; return { W, H, T, P: 2*W + 2*(H-T) }; };
  const posAt = (d, q)=>{
    let x = ((q % d.P) + d.P) % d.P;
    if(x < d.W) return { x, y:d.H, dir:1 };
    x -= d.W; if(x < d.H-d.T) return { x:d.W, y:d.H-x, dir:1 };
    x -= d.H-d.T; if(x < d.W) return { x:d.W-x, y:d.T, dir:-1 };
    x -= d.W; return { x:0, y:d.T+x, dir:-1 };
  };
  const pop = (x, y, text)=>{ const p = document.createElement('div'); p.className = 'mascot-pop'; p.textContent = text; p.style.left = Math.max(4, Math.min(window.innerWidth-120, x))+'px'; p.style.top = Math.max(4, y-24)+'px'; document.body.appendChild(p); setTimeout(()=>p.remove(), 1500); };
  const defeat = (fromClick)=>{
    if(!alive) return;
    alive = false; shooting = false;
    const r = bug.getBoundingClientRect();
    bug.classList.add('poof');
    pop(r.left, r.top, fromClick ? '💥 Nice one, Danna!' : lines[Math.floor(Math.random()*lines.length)]);
    respawnAt = performance.now() + 5000 + Math.random()*6000;
  };
  bug.addEventListener('click', ()=> defeat(true));
  const shoot = (d)=>{
    shooting = true;
    const shot = document.createElement('div'); shot.className = 'mascot-shot'; shot.textContent = '✔️';
    document.body.appendChild(shot);
    const t0 = performance.now(), dur = 450;
    const step = (now)=>{
      if(!alive){ shot.remove(); return; }
      const k = Math.min(1, (now - t0)/dur);
      const a = posAt(d, s), b = posAt(d, s - gap);
      shot.style.left = (a.x + (b.x - a.x)*k + 20)+'px';
      shot.style.top = (a.y + (b.y - a.y)*k + 18 - Math.sin(k*Math.PI)*22)+'px';
      if(k < 1) requestAnimationFrame(step); else { shot.remove(); defeat(false); }
    };
    requestAnimationFrame(step);
  };
  const tick = (now)=>{
    const dt = Math.min(0.1, (now - last)/1000); last = now;
    const d = dims();
    const v = d.P / LOOP_SEC;
    s += v*dt;
    const o = posAt(d, s);
    walker.style.left = o.x+'px'; walker.style.top = o.y+'px';
    face.style.transform = `scaleX(${o.dir})` + (shooting ? ' rotate(-8deg)' : '');
    if(alive){
      gap -= v*0.35*dt;                     /* it slowly catches up */
      const m = posAt(d, s - gap);
      bug.style.left = (m.x + (SIZE-BSIZE)/2)+'px'; bug.style.top = (m.y + (SIZE-BSIZE))+'px';
      bug.firstElementChild.style.transform = `scaleX(${m.dir})`;
      if(gap < 110 && !shooting) shoot(d);
    } else if(now >= respawnAt){
      alive = true; gap = 380 + Math.random()*260; bug.classList.remove('poof');
    }
    requestAnimationFrame(tick);
  };
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ bug.remove(); walker.style.left = '0px'; walker.style.top = (window.innerHeight-70)+'px'; }
  else requestAnimationFrame(tick);
})();
</script>
