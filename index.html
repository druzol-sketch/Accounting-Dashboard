<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accounting System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'><rect width='72' height='72' rx='16' fill='%23FDEFF5'/><path d='M14 40 Q14 14 36 14 Q58 14 58 40 L58 46 Q58 54 50 54 L22 54 Q14 54 14 46 Z' fill='%23F3C9DC'/><ellipse cx='36' cy='42' rx='16' ry='14' fill='%23FFE3EE'/><path d='M27 12 L24 20 L31 17 Z' fill='%23D98CB3'/><path d='M45 12 L48 20 L41 17 Z' fill='%23D98CB3'/><circle cx='27' cy='36' r='9' fill='%23FFFFFF'/><circle cx='45' cy='36' r='9' fill='%23FFFFFF'/><circle cx='27' cy='37' r='4' fill='%235A3E4A'/><circle cx='45' cy='37' r='4' fill='%235A3E4A'/><path d='M33 44 L36 49 L39 44 Z' fill='%23F0B429'/></svg>">
<style>
  :root{
    --bticket:#5B9BD5; --bticket-bg:#EAF3FB;
    --daimasu:#E0688A; --daimasu-bg:#FCEAF0;
    --midori:#6FAE7C; --midori-bg:#EAF5EC;
    --bgc:#E0983D; --bgc-bg:#FCF1E3;
    --shared:#3E9C93; --shared-bg:#E7F5F3;
    --ink:#2E2A3B; --ink-soft:#6b6578;
    --paper:#FFF8FB; --line:#F5D9E6;
    --danger:#E6707A; --danger-bg:#FCEAEC;
    --ok:#5CA678; --ok-bg:#EAF6EE;
    --warn:#E0A83D; --warn-bg:#FCF3E3;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.45;
  }
  .app{display:flex; min-height:100vh;}
  /* SIDEBAR */
  .sidebar{
    width:248px; flex-shrink:0; background:#FDEFF5; border-right:1px solid var(--line);
    padding:18px 12px; overflow-y:auto;
  }
  .brand{ padding:4px 8px 16px 8px; }
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .logo{ flex-shrink:0; line-height:0; filter:drop-shadow(0 2px 4px rgba(160,120,170,0.35)); }
  .brand .name{ font-size:15px; font-weight:700; letter-spacing:.2px; }
  .brand .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .navgroup{ margin-bottom:14px; }
  .navgroup-label{
    font-size:11px; font-weight:700; color:#fff; padding:5px 10px; border-radius:8px;
    margin:0 4px 6px 4px; display:inline-block;
  }
  .navitem{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    padding:7px 14px; border-radius:9px; font-size:13px; color:var(--ink); margin-bottom:2px;
  }
  .navitem:hover{ background:#FBE1EC; }
  .navitem.active{ background:var(--ink); color:#fff; font-weight:600; }
  .made-by{
    margin-top:16px; padding:10px 12px; text-align:center; font-size:11px; color:var(--ink-soft);
    border-top:1px dashed var(--line);
  }
  .savebar{
    margin-top:10px; padding-top:12px; border-top:1px dashed var(--line);
    display:flex; flex-direction:column; gap:6px;
  }
  .savebtn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    padding:9px 10px; border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer;
    border:none;
  }
  .savebtn.primary{ background:linear-gradient(120deg,#E0688A,#B18ACB); color:#fff; }
  .savebtn.primary:hover{ filter:brightness(1.05); }
  .savebtn.secondary{ background:#EFE7F2; color:var(--ink); }
  .savebtn.secondary:hover{ background:#E4D6EA; }
  .savestatus{ font-size:10.5px; color:var(--ink-soft); text-align:center; min-height:14px; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(40,20,40,0.45); display:flex;
    align-items:center; justify-content:center; z-index:999; padding:20px;
  }
  .modal-box{
    background:#fff; border-radius:14px; padding:22px; max-width:560px; width:100%;
    max-height:82vh; overflow-y:auto; box-shadow:0 10px 40px rgba(0,0,0,0.25);
  }
  .modal-box h3{ margin:0 0 6px 0; font-size:16px; }
  .modal-box p{ margin:0 0 10px 0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .modal-box textarea{
    width:100%; height:220px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    border:1px solid var(--line); border-radius:8px; padding:10px; resize:vertical; box-sizing:border-box;
  }
  .modal-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .modal-close{ background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; margin-top:10px; text-decoration:underline; }
  /* Office Dues monthly table */
  .od-toggle{ display:inline-flex; background:#F3EEF7; border-radius:999px; padding:3px; gap:2px; margin:0 0 12px 0; }
  .od-toggle button{ border:none; background:none; padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .od-toggle button.on{ background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(120,60,100,.15); }
  .od-controls{ display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin:0 0 12px 0; font-size:12.5px; }
  .od-controls label{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-right:4px; }
  .od-controls select, .od-controls input{ font-size:12.5px; padding:5px 8px; border:1px solid #DED6E4; border-radius:8px; background:#FBFAFC; }
  .od-controls .od-nav{ border:1px solid #DED6E4; background:#fff; border-radius:8px; padding:4px 10px; cursor:pointer; font-size:13px; }
  .od-strip{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 14px 0; }
  .od-strip div{ background:#FFF4F8; border:1px solid var(--line); border-radius:12px; padding:8px 14px; min-width:140px; }
  .od-strip b{ display:block; font-size:16px; font-variant-numeric:tabular-nums; }
  .od-strip span{ font-size:11.5px; color:var(--ink-soft); }
  .od-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table.od-table{ border-collapse:separate; border-spacing:0; width:100%; font-size:12px; }
  table.od-table th, table.od-table td{ border-bottom:1px solid #F7E6EE; padding:6px 7px; vertical-align:middle; background:#fff; }
  table.od-table thead th{ background:#FDEFF5; font-size:11.5px; text-align:center; position:sticky; top:0; z-index:2; white-space:nowrap; }
  table.od-table thead th.od-now{ background:#F7D9E7; }
  table.od-table .od-name{ position:sticky; left:0; z-index:1; min-width:230px; max-width:270px; text-align:left; box-shadow:1px 0 0 #F2DCE7; }
  table.od-table thead th.od-name{ z-index:3; }
  table.od-table td.od-now{ background:#FFF9FC; }
  table.od-table tr.od-cat td{ background:#F3EEF7; font-weight:700; font-size:12.5px; }
  table.od-table tr.od-sub td{ background:#FBF8FC; font-weight:600; color:var(--ink-soft); font-size:11.5px; text-align:right; font-variant-numeric:tabular-nums; }
  table.od-table tr.od-sub td.od-name{ text-align:left; }
  table.od-table tfoot td{ background:#FDEFF5; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; border-bottom:none; }
  table.od-table tfoot td.od-name{ text-align:left; }
  table.od-table tfoot tr.od-unpaid td{ color:#C0396B; }
  .od-payee{ font-weight:700; color:var(--ink); line-height:1.25; }
  .od-detail{ font-size:11.5px; color:var(--ink-soft); line-height:1.25; }
  .od-meta{ font-size:10.5px; color:#9a90a8; margin-top:2px; }
  .od-rowbtns{ display:flex; gap:3px; margin-top:4px; }
  .od-rowbtns button{ border:1px solid #EADDE8; background:#fff; border-radius:6px; font-size:11px; padding:1px 6px; cursor:pointer; }
  .od-cellbtn{ display:block; width:100%; min-width:96px; border:1px solid transparent; border-radius:10px; padding:4px 6px; cursor:pointer; text-align:center; background:none; font:inherit; }
  .od-cellbtn:hover{ outline:2px solid #F0B8CF; }
  .od-cellbtn:focus-visible{ outline:2px solid #B18ACB; }
  .od-cellbtn .od-st{ font-size:10.5px; font-weight:700; display:block; }
  .od-cellbtn .od-amt{ font-size:12px; font-variant-numeric:tabular-nums; display:block; }
  .od-cellbtn .od-dd{ font-size:10px; opacity:.75; display:block; }
  .od-cellbtn.od-empty{ color:#D9CCDD; }
  .od-cellbtn.od-hasnote::after{ content:'•'; color:#E0688A; margin-left:2px; }
  .od-legend{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; font-size:11px; }
  .od-legend span{ border:1px solid; border-radius:999px; padding:2px 9px; font-weight:600; }
  .od-form{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .od-form label{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:3px; }
  .od-form input, .od-form select{ width:100%; border:1px solid #DED6E4; border-radius:7px; padding:6px 8px; font-size:12.5px; }
  .od-form .od-full{ grid-column:1 / -1; }
  .main:has(.od-table){ max-width:none; }
  table.od-table .od-name{ white-space:normal; overflow-wrap:anywhere; }
  table.od-compact .od-name{ width:210px; }
  .od-bank{ font-size:10.5px; color:#35609E; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .od-bankbox{ background:#F4F8FE; border:1px solid #D6E3F5; border-radius:10px; padding:8px 10px; font-size:12px; margin:4px 0 6px 0; }
  .od-bankbox .od-rowbtns button{ font-size:11.5px; padding:2px 8px; }
  table.od-compact{ font-size:11px; }
  table.od-compact th, table.od-compact td{ padding:4px 3px; }
  table.od-compact .od-name{ min-width:200px; max-width:220px; padding-left:8px; }
  table.od-compact .od-cellbtn{ min-width:0; padding:3px 2px; border-radius:8px; }
  table.od-compact .od-cellbtn .od-st{ font-size:9.5px; }
  table.od-compact .od-cellbtn .od-amt{ font-size:10.5px; letter-spacing:-.2px; }
  table.od-compact .od-cellbtn .od-dd{ display:none; }
  table.od-compact tr.od-sub td, table.od-compact tfoot td{ font-size:10.5px; letter-spacing:-.2px; }
  table.od-compact .od-payee{ font-size:11.5px; }
  table.od-compact .od-detail{ font-size:10.5px; }
  .editing-row{ background:#FDF3E7 !important; }
  .editing-row td{ background:#FDF3E7; }
  /* MAIN */
  .main{ flex:1; padding:28px 36px; max-width:1180px; }
  .pagehead{ margin-bottom:20px; }
  .pagehead h1{ font-size:22px; margin:0 0 4px 0; }
  .pagehead h1::before{ content:'🌸 '; }
  .pagehead p{ margin:0; color:var(--ink-soft); font-size:13px; max-width:640px; }
  .pill{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px;
    color:#fff; margin-bottom:10px;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    margin-bottom:14px;
  }
  .card h3{ margin:0 0 6px 0; font-size:13.5px; }
  .grid-summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:22px; }
  .stat{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
  }
  .stat .label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; }
  .stat .value{ font-size:20px; font-weight:700; }
  .stat .value.small{ font-size:15px; }
  /* FORM */
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; align-items:end; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color:var(--ink-soft); font-weight:600; }
  .field input, .field select{
    font-size:13px; padding:7px 9px; border:1px solid #DED6E4; border-radius:8px; background:#FBFAFC;
    font-family:inherit; color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:2px solid #C9B8D6; border-color:#C9B8D6; }
  .btn{
    font-size:13px; font-weight:600; padding:8px 16px; border-radius:9px; border:none; cursor:pointer;
    color:#fff; background:var(--ink);
  }
  .btn:hover{ opacity:.9; }
  .btn.ghost{ background:#fff; color:var(--ink); border:1px solid #DED6E4; }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn.danger{ background:var(--danger); }
  /* TABLE */
  .tablewrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); }
  table{ border-collapse:collapse; width:100%; font-size:11.5px; }
  th{
    text-align:left; background:#F7F3F9; padding:5px 7px; font-weight:700; white-space:nowrap;
    border-bottom:1px solid var(--line); position:sticky; top:0;
  }
  td{ padding:3px 7px; border-bottom:1px solid #F2EEF4; white-space:nowrap; line-height:1.25; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:#FCFAFD; }
  .tag{ padding:1px 8px; border-radius:99px; font-size:10.5px; font-weight:700; }
  .tag.ok{ background:var(--ok-bg); color:var(--ok); }
  .tag.warn{ background:var(--warn-bg); color:var(--warn); }
  .tag.danger{ background:var(--danger-bg); color:var(--danger); }
  .tag.neutral{ background:#EFEAF2; color:var(--ink-soft); }
  .empty{ padding:26px; text-align:center; color:var(--ink-soft); font-size:13px; }
  .rowactions button{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:13px; padding:1px 4px;}
  .rowactions button:hover{ color:var(--danger); }
  .note{ font-size:12px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }
  .shared-flag{
    display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft);
    background:#F7F3F9; padding:6px 12px; border-radius:99px; width:fit-content; margin-bottom:16px;
  }
  .section-title{ font-size:13px; font-weight:700; margin:18px 0 8px 0; }
  .section-title::before{ content:'🎀 '; }
  .totalrow td{ font-weight:700; background:#FAF7FB; }
  .loading{ padding:40px; text-align:center; color:var(--ink-soft); }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:#DED6E4; border-radius:8px; }
  .mascot-track{ width:100%; overflow:hidden; height:78px; position:relative; margin-top:6px; }
  .mascot-walk{
    position:absolute; left:50%;
    animation: mascotWaddle 2.4s ease-in-out infinite;
  }
  @keyframes mascotWaddle{
    0%{ transform:translateX(-46px) rotate(-6deg); }
    25%{ transform:translateX(-16px) translateY(-5px) rotate(2deg); }
    50%{ transform:translateX(14px) rotate(6deg); }
    75%{ transform:translateX(-16px) translateY(-5px) rotate(-2deg); }
    100%{ transform:translateX(-46px) rotate(-6deg); }
  }
  .bottom-mascot{
    position:fixed; bottom:auto; left:0; top:calc(100vh - 70px); z-index:500; pointer-events:none;
    animation: mascotBob 0.6s ease-in-out infinite;
  }
  .mascot-face{ display:block; transition:transform .15s; }
  .bug-monster{ position:fixed; z-index:499; left:0; top:0; cursor:pointer; animation: bugWobble .5s ease-in-out infinite; }
  .bug-monster.poof{ animation: bugPoof .45s ease-out forwards; pointer-events:none; }
  @keyframes bugWobble{ 0%,100%{ margin-top:0; } 50%{ margin-top:-4px; } }
  @keyframes bugPoof{ 0%{ opacity:1; filter:none; } 100%{ opacity:0; filter:blur(2px); margin-top:-18px; } }
  .mascot-shot{ position:fixed; z-index:501; pointer-events:none; font-size:18px; line-height:1; }
  .mascot-pop{ position:fixed; z-index:502; pointer-events:none; font:700 12px Arial, sans-serif; color:#9b3d6e; background:#FFF0F6; border:1px solid #F3C9DC; border-radius:999px; padding:3px 9px; white-space:nowrap; animation: popUp 1.4s ease-out forwards; }
  @keyframes popUp{ 0%{ opacity:0; transform:translateY(6px) scale(.8); } 15%{ opacity:1; transform:translateY(0) scale(1.05); } 80%{ opacity:1; } 100%{ opacity:0; transform:translateY(-22px); } }
  @keyframes mascotRoam{
    0%{    left:0;                     top:calc(100vh - 70px); transform:scaleX(1);  }
    24.9%{ left:calc(100vw - 66px);    top:calc(100vh - 70px); transform:scaleX(1);  }
    25%{   left:calc(100vw - 66px);    top:calc(100vh - 70px); transform:scaleX(1);  }
    49.9%{ left:calc(100vw - 66px);    top:10px;               transform:scaleX(1);  }
    50%{   left:calc(100vw - 66px);    top:10px;               transform:scaleX(-1); }
    74.9%{ left:0;                     top:10px;               transform:scaleX(-1); }
    75%{   left:0;                     top:10px;               transform:scaleX(-1); }
    99.9%{ left:0;                     top:calc(100vh - 70px); transform:scaleX(-1); }
    100%{  left:0;                     top:calc(100vh - 70px); transform:scaleX(1);  }
  }
  @keyframes mascotBob{
    0%,100%{ margin-bottom:0px; }
    50%{ margin-bottom:5px; }
  }
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
/* ============================= CONFIG ============================= */
const GROUPS = {
  dashboard: { label: "Dashboard", color: "#2E2A3B" },
  bticket:   { label: "B-Ticket",  color: "var(--bticket)" },
  daimasu:   { label: "Daimasu",   color: "var(--daimasu)" },
  midori:    { label: "Midori",    color: "var(--midori)" },
  bgc:       { label: "BGC / Head Office", color: "var(--bgc)" },
  shared:    { label: "Shared",    color: "var(--shared)" },
};

const STATUS_OPTIONS = ["Pending","Verified","Approved","Released","Paid","Partially Liquidated","Liquidated","Flagged","Cancelled"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function money(v){ return (num(v)).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* "Unliquidated" = money that's out but not yet accounted for with receipts.
   A Cash Advance genuinely needs a later Liquidated step (someone still has
   to submit receipts against it), so it stays unliquidated until then. A
   straight Payment/Reimbursement/Salary/Funds entry has no such step —
   once it's Paid, it's done, full stop. */
function isUnliquidatedRow(row){
  if(row.status==='Liquidated' || row.status==='Cancelled') return false;
  if(row.status==='Paid' && row.requestType!=='Cash Advance') return false;
  return true;
}
/* Pending Requests used to offer the full status list (Paid, Released,
   Verified, Approved, Liquidated, Cancelled) before being simplified to just
   Pending/Proceed. Older entries may still carry one of those legacy values,
   so treat any of the old "done" statuses as equivalent to Proceed — this
   keeps existing data's totals correct without requiring Danna to revisit
   every past entry. */
function isPendingRequestResolved(status){
  return ['Proceed','Paid','Released','Liquidated'].includes(status);
}
/* Amount still sitting in Pending Requests for a company, not yet resolved
   (once marked Proceed it flows into that company's Expense tab — directly,
   or via Petty Cash/Borrowed Funds — and is counted there instead). */
function unpaidPendingTotalForCompany(prRows, companyName){
  return prRows.filter(r=>r.company===companyName && !isPendingRequestResolved(r.status))
               .reduce((s,r)=>s+num(r.amount),0);
}
/* Local (Philippine) date — toISOString() is UTC, which showed yesterday's
   date before 8:00 AM. */
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function digitsOnly(s){ return (s||'').toString().replace(/[^0-9]/g,''); }

/* Compute the next sequential voucher number for a module with a voucherPrefix
   (e.g. "BGCF - " -> "BGCF - 09260011"). Sequence resets each month (MMYY),
   matching the existing numbering convention. */
function computeNextVoucherNumber(mod, rows, dateStr, prefixOverride){
  const vKey = mod.voucherFieldKey || 'voucherRef';
  const prefix = prefixOverride || mod.voucherPrefix;
  const d = dateStr ? new Date(dateStr+'T00:00:00') : new Date();
  const mm = String((isNaN(d.getMonth()) ? new Date().getMonth() : d.getMonth())+1).padStart(2,'0');
  const yy = String(isNaN(d.getFullYear()) ? new Date().getFullYear() : d.getFullYear()).slice(-2);
  const mmYY = mm+yy;
  const normPrefix = prefix.replace(/\s+/g,'').toUpperCase();
  let maxSeq = 0;
  rows.forEach(r=>{
    const ref = (r[vKey]||'').replace(/\s+/g,'').toUpperCase();
    if(ref.startsWith(normPrefix)){
      const rest = ref.slice(normPrefix.length);
      if(rest.startsWith(mmYY)){
        const seqNum = parseInt(rest.slice(mmYY.length), 10);
        if(!isNaN(seqNum) && seqNum>maxSeq) maxSeq = seqNum;
      }
    }
  });
  return prefix + mmYY + String(maxSeq+1).padStart(4,'0');
}

/* Cash & Bank schema factory */
function cashBankFields(){
  return [
    {key:'date', label:'Date', type:'date', default:todayISO()},
    {key:'account', label:'Account / Channel', type:'text'},
    {key:'opening', label:'Beginning Balance (leave blank to auto-carry from previous entry)', type:'number'},
    {key:'cashIn', label:'Cash / Fund In', type:'number'},
    {key:'cashOut', label:'Cash / Fund Out', type:'number'},
    {key:'notes', label:'Notes', type:'text'},
  ];
}
function cashBankCompute(row){
  return { closing: num(row.opening) + num(row.cashIn) - num(row.cashOut) };
}

   text (case-insensitive). First match wins, so more specific keywords are
   listed before generic ones. Only fires when Category is still empty, so
   it never overrides something you typed yourself. */
const CATEGORY_KEYWORD_MAP = [
  [['toll'], 'Company Car Expenses:Toll Fee'],
  [['gasoline','gas '], 'Company Car Expenses:Gasoline'],
  [['parking'], 'Company Car Expenses:Parking'],
  [['car supplies'], 'Company Car Expenses:Car Supplies'],
  [['mobile phone load','phone load'], 'Company Car Expenses:Mobile Phone Load'],
  [['company car'], 'Company Car Expenses'],
  [['notariz'], 'Miscellaneous:Notarization'],
  [['legal affairs'], 'Miscellaneous:Legal Affairs'],
  [['consultation fee','consultancy fee','atty.','attorney'], 'Consultant Fees'],
  [['google ads','facebook ads','marketing','signage','wobbler','poster','instore display'], 'Marketing Expenses'],
  [['electric bill','electricity'], 'Utilities Expense:Electricity'],
  [['water gallon','water bill'], 'Utilities Expense:Water'],
  [['internet','wifi','modem'], 'Utilities Expense:Internet'],
  [['bento ingredients','food supplies'], 'Food Supplies Expense'],
  [['association dues'], 'Association Dues Expense'],
  [['repairs and maintenance','repair'], 'Office Expenses:Repairs and Maintenance'],
  [['office supplies'], 'Office Expenses:Supplies'],
  [['storage rent','storage room'], 'Storage Rent'],
  [['office rent'], 'Office Rent'],
  [['subscription'], 'Subscription Fee'],
];
function guessCategory(text){
  const t = (text||'').toLowerCase();
  if(!t) return '';
  for(const [keys, cat] of CATEGORY_KEYWORD_MAP){
    if(keys.some(k=>t.includes(k))) return cat;
  }
  return '';
}

const COMPANY_EXPENSE_KEY = { 'B-Ticket Inc.':'bticket_expenses', 'Daimasu':'daimasu_expenses', 'Midori No Mart':'midori_expenses' };
/* Which company's Expenses a bank account's own payments normally belong to (Betrnk Tours is reported with B-Ticket). */
const BANK_ACCT_COMPANY = { 'Unionbank - Betrnk Tours':'B-Ticket Inc.', 'Unionbank - B-Ticket Inc.':'B-Ticket Inc.', 'Unionbank - Betrnk Tours (Daimasu)':'Daimasu', 'Unionbank - Midori No Mart':'Midori No Mart', 'BDO - Daimasu':'Daimasu' };

/* ---- Cross-module linking: specific bank accounts -> that company's Cash & Bank ledger.
   The parent "Unionbank - Betrnk Tours" account is the one actually used for
   B-Ticket's expenses day-to-day, so it maps to bticket_cashbank alongside
   the dedicated B-Ticket Inc. account — both feed the same B-Ticket ledger,
   each row keeping its own account name so you can still tell them apart. ---- */
const BANK_ACCOUNT_TO_CASHBANK = {
  'Unionbank - Betrnk Tours': 'bticket_cashbank',
  'Unionbank - Betrnk Tours (Daimasu)': 'daimasu_cashbank',
  'Unionbank - B-Ticket Inc.': 'bticket_cashbank',

/* Create/update/remove the linked companion entry when a Petty Cash / Borrowed
   Funds row is saved with a "link to company" target selected, OR when a Bank
   Balances row is saved for an account that maps to a company's Cash & Bank
   ledger. One-way only in both cases: the target tab has no sync field of its
   own, so anything entered directly there (e.g. pure cash entries in Cash &
   Bank) never touches the source. Mutates `row` in place to remember which
   companion entry it owns (_linkedKey/_linkedId), so a later edit updates the
   same companion instead of duplicating it. */
async function syncLinkedCompanion(mod, row){
  const isBgc = (mod.key==='bgc_pettycash' || mod.key==='bgc_borrowed');
  const isBankBalances = (mod.key==='bank_balances');
  const isPendingRequest = (mod.key==='pending_requests');
  if(!isBgc && !isBankBalances && !isPendingRequest) return;

  // BGC entries with itemized receipts sync one Expense-tab row PER receipt
  // (so each keeps its own category), instead of one lump-sum row. This
  // keeps the Expense tab in sync automatically as receipts are added,
  // edited, or removed — no manual re-entry needed there.
  if(isBgc){
    await syncBgcReceiptCompanions(mod, row);
    return;
  }

  let targetKey, validAmount, companion;
  if(isPendingRequest){
    // Once a Pending Request is marked Proceed, it flows automatically into
    // that company's Expense tab — no need to re-type it there. This direct
    // path only applies when no fund source was chosen (e.g. paid straight
    // from a bank transfer); when "Get Funds From" is set, the request
    // instead flows through Petty Cash/Borrowed Funds first (see
    // syncPendingToFundSource), and reaches the Expense tab from there
    // instead, so we skip this direct link to avoid recording the same
    // expense twice.
    targetKey = row.sourceOfFund ? undefined : COMPANY_EXPENSE_KEY[row.company];
    validAmount = !row.sourceOfFund && isPendingRequestResolved(row.status) && num(row.amount) > 0;
    companion = {
      date: row.dateReleased || row.date,
      voucherNo: '',
      category: 'Pending Request',
      description: row.description,
      amount: row.amount,
      paymentMethod: '',
      requestedBy: row.requestedBy,
      requestType: row.requestType || '',
      status: 'Paid',
      dateLiquidated: '',
    };
  } else {
    targetKey = BANK_ACCOUNT_TO_CASHBANK[row.account];
    validAmount = num(row.cashIn) > 0 || num(row.cashOut) > 0;
    companion = {
      date: row.date,
      account: row.account,
      opening: '',
      cashIn: row.cashIn,
      cashOut: row.cashOut,
      notes: row.description,
    };
  }
  const prevKey = row._linkedKey;
  const prevId = row._linkedId;

  // Target changed (or link removed / amount cleared) — drop the old companion.
  if(prevKey && prevId && (prevKey!==targetKey || !validAmount)){
    const prevMod = MODULES.find(m=>m.key===prevKey);
    if(prevMod){
      let prevRows = await getModuleData(prevMod);
      prevRows = prevRows.filter(r=>r.id!==prevId);
      state.cache[prevKey] = prevRows;
      await saveRows(prevKey, prevRows);
    }
    row._linkedKey = undefined;
    row._linkedId = undefined;
  }

  if(!targetKey || !validAmount) return;

  const targetMod = MODULES.find(m=>m.key===targetKey);
  let rows = await getModuleData(targetMod);

  if(row._linkedKey===targetKey && row._linkedId){
    const idx = rows.findIndex(r=>r.id===row._linkedId);
    if(idx>-1) rows[idx] = { ...rows[idx], ...companion };
    else { const id = uid(); rows.push({id, _seq:Date.now(), ...companion}); row._linkedId = id; }
  } else {
    const id = uid();
    rows.push({ id, _seq: Date.now(), ...companion });
    row._linkedKey = targetKey;
    row._linkedId = id;
  }
  state.cache[targetKey] = rows;
  await saveRows(targetKey, rows);
}

/* BGC Petty Cash / Borrowed Funds -> company Expense tab, one row per
   itemized receipt (falls back to a single lump-sum row when there are no
   itemized receipts, same as the original behavior). Each receipt's
   companion is tracked via row._linkedReceiptMap = { receiptId: expenseRowId }
   so edits/renames update in place and removed receipts drop their row. */
/* When a Cash Advance is liquidated (receipts saved) with a surplus, the
   change/sukli physically comes back into the fund on the day it's actually
   liquidated — not on the original advance's release date. Recording it as
   Cash In on the original row would misstate the running balance for every
   day in between, so instead this creates/updates a separate row, dated
   today, purely for that inflow. Tracked via row._changeReturnId so
   re-saving receipts later updates or removes this row instead of
   duplicating it. Returns the (possibly modified) rows array for the
   caller to persist. */
async function syncChangeReturnRow(mod, row, rows){
  const receipts = Array.isArray(row.receipts) ? row.receipts : [];
  const receiptsTotal = receipts.reduce((s,rc)=>s+num(rc.amount),0);
  /* Partial liquidation: the rest of the advance is still out with the
     person (more receipts to come), so it is not sukli or abono yet. */
  const excess = (receiptsTotal > 0 && !row.partialLiquidation) ? (num(row.cashOut) - receiptsTotal) : 0;
  const prevId = row._changeReturnId;
  const prevAbonoId = row._abonoId;
  // Date the companion row using the receipts' own dates (when the money
  // was actually spent/returned) rather than today — if liquidation is
  // encoded late, dating it "today" would misstate every day's running
  // balance in between and double-count against balances already reported
  // for the real date. Falls back to today only if receipts carry no date.
  const receiptDates = receipts.map(rc=>rc.date).filter(Boolean).sort();
  const companionDate = row.liquidationDate || (receiptDates.length ? receiptDates[receiptDates.length-1] : todayISO());

  if(excess > 0){
    // Sukli: employee spent LESS than the advance — the leftover comes
    // back into the fund on the liquidation day (see file header note).
    const companion = {
      date: companionDate,
      voucherRef: '',
      particulars: `Change returned — Liquidation of ${row.voucherRef || row.particulars || 'Cash Advance'}`,
      receivedBy: row.receivedBy,
      cashIn: String(excess),
      cashOut: '',
      status: '',
      remarks: '',
      _autoGenerated: true,
    };
    if(prevId){
      const idx = rows.findIndex(r=>r.id===prevId);
      if(idx>-1) rows[idx] = { ...rows[idx], ...companion };
      else { const id=uid(); rows.push({id, _seq:Date.now(), ...companion}); row._changeReturnId = id; }
    } else {
      const id = uid();
      rows.push({ id, _seq: Date.now(), ...companion });
      row._changeReturnId = id;
    }
    // No longer an abono (receipts changed) — drop any previously created row.
    if(prevAbonoId){ rows = rows.filter(r=>r.id!==prevAbonoId); row._abonoId = undefined; }
  } else if(excess < 0){
    // Abono: employee spent MORE than the advance — the shortfall is an
    // additional release owed to them, dated the liquidation day, same
    // reasoning as sukli above but in the opposite cash direction.
    const abonoAmount = Math.abs(excess);
    const companion = {
      date: companionDate,
      voucherRef: '',
      particulars: `Abono/Additional release — Liquidation of ${row.voucherRef || row.particulars || 'Cash Advance'}`,
      receivedBy: row.receivedBy,
      cashIn: '',
      cashOut: String(abonoAmount),
      status: '',
      remarks: '',
      _autoGenerated: true,
    };
    if(prevAbonoId){
      const idx = rows.findIndex(r=>r.id===prevAbonoId);
      if(idx>-1) rows[idx] = { ...rows[idx], ...companion };
      else { const id=uid(); rows.push({id, _seq:Date.now(), ...companion}); row._abonoId = id; }
    } else {
      const id = uid();
      rows.push({ id, _seq: Date.now(), ...companion });
      row._abonoId = id;
    }
    // No longer a surplus (receipts changed) — drop any previously created row.
    if(prevId){ rows = rows.filter(r=>r.id!==prevId); row._changeReturnId = undefined; }
  } else {
    // Exact match — drop whichever companion row may exist from before.
    if(prevId){ rows = rows.filter(r=>r.id!==prevId); row._changeReturnId = undefined; }
    if(prevAbonoId){ rows = rows.filter(r=>r.id!==prevAbonoId); row._abonoId = undefined; }
  }
  // Reflect the (possibly new) row._changeReturnId/_abonoId on the source row too.
  const srcIdx = rows.findIndex(r=>r.id===row.id);
  if(srcIdx>-1) rows[srcIdx] = { ...rows[srcIdx],
    _changeReturnId: row._changeReturnId, _changeReturnKey: row._changeReturnId ? mod.key : undefined,
    _abonoId: row._abonoId, _abonoKey: row._abonoId ? mod.key : undefined };
  return rows;
}

async function syncBgcReceiptCompanions(mod, row){
  const targetKey = COMPANY_EXPENSE_KEY[row.linkCompany];
  const hasReceipts = Array.isArray(row.receipts) && row.receipts.some(rc=>num(rc.amount)>0);
  const prevMap = row._linkedReceiptMap || {};
  const prevSingleKey = row._linkedKey;
  const prevSingleId = row._linkedId;

  // Clean up a stale single lump-sum companion if we're switching into
  // per-receipt mode (or the link target/company changed).
  async function dropSingle(){
    if(prevSingleKey && prevSingleId){
      const prevMod = MODULES.find(m=>m.key===prevSingleKey);
      if(prevMod){
        let prevRows = await getModuleData(prevMod);
        prevRows = prevRows.filter(r=>r.id!==prevSingleId);
        state.cache[prevSingleKey] = prevRows;
        await saveRows(prevSingleKey, prevRows);
      }
    }
    row._linkedKey = undefined;
    row._linkedId = undefined;
  }
  // Clean up any stale per-receipt companions (used when switching back to
  // single mode, or when the target company changed).
  async function dropAllReceiptCompanions(){
    const keys = new Set(Object.values(prevMap).map(v=>v.key));
    for(const k of keys){
      const prevMod = MODULES.find(m=>m.key===k);
      if(!prevMod) continue;
      const ids = Object.values(prevMap).filter(v=>v.key===k).map(v=>v.id);
      let prevRows = await getModuleData(prevMod);
      prevRows = prevRows.filter(r=>!ids.includes(r.id));
      state.cache[k] = prevRows;
      await saveRows(k, prevRows);
    }
    row._linkedReceiptMap = {};
  }

  if(!targetKey){
    await dropSingle();
    await dropAllReceiptCompanions();
    return;
  }

  if(!hasReceipts){
    // No itemized receipts (or all zero) — fall back to the original
    // single lump-sum companion behavior.
    await dropAllReceiptCompanions();
    const validAmount = num(row.cashOut) > 0;
    const netAmount = num(row.cashOut) - num(row.cashIn||0);
    const companion = validAmount ? {
      date: row.date,
      voucherNo: row.voucherRef,
      category: row.remarks || '',
      description: row.particulars,
      amount: netAmount,
      paymentMethod: 'Cash',
      requestedBy: row.receivedBy,
      requestType: row.requestType || '',
      status: row.linkStatus || 'Pending',
      dateLiquidated: (row.linkStatus==='Liquidated') ? (row.originalDate || '') : '',
    } : null;

    if(prevSingleKey && prevSingleId && (prevSingleKey!==targetKey || !validAmount)){
      await dropSingle();
    }
    if(!validAmount) return;
    const targetMod = MODULES.find(m=>m.key===targetKey);
    let rows = await getModuleData(targetMod);
    if(row._linkedKey===targetKey && row._linkedId){
      const idx = rows.findIndex(r=>r.id===row._linkedId);
      if(idx>-1) rows[idx] = { ...rows[idx], ...companion };
      else { const id = uid(); rows.push({id, _seq:Date.now(), ...companion}); row._linkedId = id; }
    } else {
      const id = uid();
      rows.push({ id, _seq: Date.now(), ...companion });
      row._linkedKey = targetKey;
      row._linkedId = id;
    }
    state.cache[targetKey] = rows;
    await saveRows(targetKey, rows);
    return;
  }

  // Itemized-receipts mode: one companion row per receipt with amount > 0.
  await dropSingle();
  // Ensure every receipt has a stable id (older receipts predating this
  // feature won't) so companions can be matched across edits.
  let idsAssigned = false;
  row.receipts.forEach(rc=>{ if(!rc.id){ rc.id = uid(); idsAssigned = true; } });

  const liveReceipts = row.receipts.filter(rc=>num(rc.amount)>0);
  const liveIds = new Set(liveReceipts.map(rc=>rc.id));

  // Drop companions for receipts that were deleted or zeroed out, or that
  // belonged to a different target company before a change.
  const staleEntries = Object.entries(prevMap).filter(([rid, info]) => rid!=='__balance__' && (!liveIds.has(rid) || info.key !== targetKey));
  const staleByKey = {};
  staleEntries.forEach(([rid, info])=>{ (staleByKey[info.key] = staleByKey[info.key]||[]).push(info.id); });
  for(const [key, ids] of Object.entries(staleByKey)){
    const prevMod = MODULES.find(m=>m.key===key);
    if(!prevMod) continue;
    let prevRows = await getModuleData(prevMod);
    prevRows = prevRows.filter(r=>!ids.includes(r.id));
    state.cache[key] = prevRows;
    await saveRows(key, prevRows);
  }
  staleEntries.forEach(([rid])=>{ delete prevMap[rid]; });

  const targetMod = MODULES.find(m=>m.key===targetKey);
  let rows = await getModuleData(targetMod);
  liveReceipts.forEach(rc=>{
    const companion = {
      date: rc.date || row.date,
      voucherNo: row.voucherRef,
      category: rc.category || row.remarks || '',
      description: [rc.description, rc.refNo ? `(Ref: ${rc.refNo})` : ''].filter(Boolean).join(' '),
      amount: rc.amount,
      paymentMethod: 'Cash',
      requestedBy: row.receivedBy,
      requestType: row.requestType || '',
      status: row.partialLiquidation ? 'Liquidated' : (row.linkStatus || 'Pending'),
      dateLiquidated: (row.partialLiquidation || row.linkStatus==='Liquidated') ? (row.liquidationDate || rc.date || row.originalDate || '') : '',
      receiptNo: rc.refNo || '', receiptDate: rc.date || '', supplierTin: rc.tin || '', vatAmount: rc.vatAmount || '', withholdingTax: rc.withholdingTax || '',
    };
    const existing = prevMap[rc.id];
    if(existing && existing.key===targetKey){
      const idx = rows.findIndex(r=>r.id===existing.id);
      if(idx>-1) rows[idx] = { ...rows[idx], ...companion };
      else { const id = uid(); rows.push({id, _seq:Date.now(), ...companion}); prevMap[rc.id] = {key:targetKey, id}; }
    } else {
      const id = uid();
      rows.push({ id, _seq: Date.now(), ...companion });
      prevMap[rc.id] = { key: targetKey, id };
    }
  });
  /* Partial liquidation: the part of the advance with no receipts yet
     stays in the company's expenses as one Pending "unliquidated balance"
     row, so the total still matches what was released. It shrinks as more
     receipts are added and disappears once fully liquidated. */
  const balInfo = prevMap.__balance__;
  const remaining = Math.round((num(row.cashOut) - liveReceipts.reduce((t,rc)=>t+num(rc.amount),0))*100)/100;
  if(row.partialLiquidation && remaining > 0){
    const bal = {
      date: row.date, voucherNo: row.voucherRef,
      category: (liveReceipts.map(rc=>rc.category).find(Boolean)) || row.remarks || '',
      description: `Unliquidated balance — ${row.particulars||''}`.trim(),
      amount: String(remaining), paymentMethod: 'Cash', requestedBy: row.receivedBy,
      requestType: 'Cash Advance', status: 'Pending', dateLiquidated: '',
    };
    const i = balInfo && balInfo.key===targetKey ? rows.findIndex(r=>r.id===balInfo.id) : -1;
    if(i>-1) rows[i] = { ...rows[i], ...bal };
    else { const id = uid(); rows.push({ id, _seq: Date.now(), ...bal }); prevMap.__balance__ = { key: targetKey, id }; }
  } else if(balInfo){
    if(balInfo.key===targetKey) rows = rows.filter(r=>r.id!==balInfo.id);
    delete prevMap.__balance__;
  }
  row._linkedReceiptMap = prevMap;
  state.cache[targetKey] = rows;
  await saveRows(targetKey, rows);
}

/* Remove a row's linked companion entry (called before deleting the row itself). */
async function collectCompanions(row){
  const companions = [];
  if(row._linkedKey && row._linkedId){
    const targetMod = MODULES.find(m=>m.key===row._linkedKey);
    if(targetMod){
      const rows = await getModuleData(targetMod);
      const found = rows.find(r=>r.id===row._linkedId);
      if(found) companions.push({modKey: row._linkedKey, row: JSON.parse(JSON.stringify(found))});
    }
  }
  if(row._linkedReceiptMap){
    for(const {key,id} of Object.values(row._linkedReceiptMap)){
      const targetMod = MODULES.find(m=>m.key===key);
      if(!targetMod) continue;
      const rows = await getModuleData(targetMod);
      const found = rows.find(r=>r.id===id);
      if(found) companions.push({modKey: key, row: JSON.parse(JSON.stringify(found))});
    }
  }
  if(row._changeReturnId && row._changeReturnKey){
    const targetMod = MODULES.find(m=>m.key===row._changeReturnKey);
    if(targetMod){
      const rows = await getModuleData(targetMod);
      const found = rows.find(r=>r.id===row._changeReturnId);
      if(found) companions.push({modKey: row._changeReturnKey, row: JSON.parse(JSON.stringify(found))});
    }
  }
  return companions;
}
const RECYCLE_BIN_MAX = 300;
async function stashToRecycleBin(modKey, row){
  const companions = await collectCompanions(row);
  const bin = await loadObj('recycle_bin', []);
  bin.unshift({
    id: 'del_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    modKey,
    deletedAt: new Date().toISOString(),
    row: JSON.parse(JSON.stringify(row)),
    companions,
  });
  if(bin.length > RECYCLE_BIN_MAX) bin.length = RECYCLE_BIN_MAX;
  await saveObj('recycle_bin', bin);
}
async function restoreFromRecycleBin(entryId){
  const bin = await loadObj('recycle_bin', []);
  const entry = bin.find(b=>b.id===entryId);
  if(!entry) return;
  if(LOCK_SIG_FIELDS[entry.modKey]){
    const locks = readBankLocks(), acct = lockAcctFor(entry.modKey, entry.row);
    if(isBankDayLocked(locks, acct, entry.row.date)){
      alert(`🔒 ${acct} is balanced and locked through ${monthDisplay(bankLockedThrough(locks, acct))}, so this entry can't be restored there. Unlock that day in Bank Balances first.`);
      return;
    }
  }
  const mod = MODULES.find(m=>m.key===entry.modKey);
  if(mod){
    const rows = await getModuleData(mod);
    if(!rows.find(r=>r.id===entry.row.id)) rows.push(entry.row);
    state.cache[mod.key] = rows;
    await saveRows(mod.key, rows);
  }
  for(const c of (entry.companions||[])){
    const cMod = MODULES.find(m=>m.key===c.modKey);
    if(!cMod) continue;
    const rows = await getModuleData(cMod);
    if(!rows.find(r=>r.id===c.row.id)) rows.push(c.row);
    state.cache[c.modKey] = rows;
    await saveRows(c.modKey, rows);
  }
  const newBin = bin.filter(b=>b.id!==entryId);
  await saveObj('recycle_bin', newBin);
}
async function purgeFromRecycleBin(entryId){
  const bin = await loadObj('recycle_bin', []);
  await saveObj('recycle_bin', bin.filter(b=>b.id!==entryId));
}

async function removeLinkedCompanion(row){
  if(row._linkedKey && row._linkedId){
    const targetMod = MODULES.find(m=>m.key===row._linkedKey);
    if(targetMod){

      rows = rows.filter(r=>r.id!==row._linkedId);
      state.cache[row._linkedKey] = rows;
      await saveRows(row._linkedKey, rows);
    }
  }
  if(row._linkedReceiptMap){
    const byKey = {};
    Object.values(row._linkedReceiptMap).forEach(({key,id})=>{ (byKey[key]=byKey[key]||[]).push(id); });
    for(const [key, ids] of Object.entries(byKey)){
      const targetMod = MODULES.find(m=>m.key===key);

/* ---- "For Company" re-routing on Bank Balances outflows ----
   Funds sit wherever there's room across the shared pool, regardless of whose
   account name is on it — so an outflow can be paid from one company's bank
   account but actually belong to another company's books. Tracked separately
   from syncLinkedCompanion (which keeps the account's own Cash & Bank ledger
   in sync) using its own _expLinkedKey/_expLinkedId, so a row can maintain
   both companions independently. */
async function syncExpenseCompanion(mod, row){
  if(mod.key !== 'bank_balances') return;
  const targetKey = COMPANY_EXPENSE_KEY[row.forCompany];
  const validAmount = !!targetKey && num(row.cashOut) > 0;
  const companion = validAmount ? {
    date: row.date,
    voucherNo: '',
    category: row.expenseCategory || (BANK_ACCT_COMPANY[row.account]===row.forCompany ? 'Uncategorized' : 'Inter-company Fund (from '+row.account+')'),
    description: row.description,
    amount: row.cashOut,
    paymentMethod: 'Bank',
    requestedBy: '',
    status: 'Paid',
    dateLiquidated: '',
  } : null;

  const prevKey = row._expLinkedKey;
  const prevId = row._expLinkedId;
  if(prevKey && prevId && (prevKey!==targetKey || !validAmount)){
    const prevMod = MODULES.find(m=>m.key===prevKey);
    if(prevMod){
      let prevRows = await getModuleData(prevMod);
      prevRows = prevRows.filter(r=>r.id!==prevId);
      state.cache[prevKey] = prevRows;
      await saveRows(prevKey, prevRows);
    }
    row._expLinkedKey = undefined;
    row._expLinkedId = undefined;
  }
  if(!targetKey || !validAmount) return;

  const targetMod = MODULES.find(m=>m.key===targetKey);
  let rows = await getModuleData(targetMod);
  if(row._expLinkedKey===targetKey && row._expLinkedId){
    const idx = rows.findIndex(r=>r.id===row._expLinkedId);
    if(idx>-1) rows[idx] = { ...rows[idx], ...companion };
    else { const id=uid(); rows.push({id,_seq:Date.now(),...companion}); row._expLinkedId=id; }
  } else {
    const id = uid();
    rows.push({ id, _seq: Date.now(), ...companion });
    row._expLinkedKey = targetKey;
    row._expLinkedId = id;
  }
  state.cache[targetKey] = rows;
  await saveRows(targetKey, rows);
}
async function removeExpenseCompanion(row){
  if(!row._expLinkedKey || !row._expLinkedId) return;
  const targetMod = MODULES.find(m=>m.key===row._expLinkedKey);
  if(!targetMod) return;
  let rows = await getModuleData(targetMod);
  rows = rows.filter(r=>r.id!==row._expLinkedId);
  state.cache[row._expLinkedKey] = rows;
  await saveRows(row._expLinkedKey, rows);
}

/* ---- Pending Request -> Petty Cash / Borrowed Funds ----
   Picking "Get Funds From" on a Pending Request creates the matching entry
   in that fund's own ledger (prefilled from the request) so Danna can go
   there to print the voucher and actually release the cash — instead of
   retyping particulars/amount a second time. Tracked via its own
   _fundLinkedKey/_fundLinkedId, independent of the row's other companions.
   The created entry also carries "Also record as company expense" pre-set
   (when the request's company has an Expense tab), so once that Petty Cash/
   Borrowed Funds entry actually has cash out, it flows onward to the
   company's Expense tab through its own existing sync — completing the
   3-stage chain: Pending Request -> Petty Cash/Borrowed -> Expense tab. */
async function syncPendingToFundSource(mod, row){
  if(mod.key !== 'pending_requests') return;
  const targetKey = row.sourceOfFund==='Petty Cash Fund' ? 'bgc_pettycash'
    : row.sourceOfFund==='Borrowed Funds' ? 'bgc_borrowed' : undefined;
  const validAmount = !!targetKey && num(row.amount) > 0;
  const linkCompany = COMPANY_EXPENSE_KEY[row.company] ? row.company : '';
  const companion = validAmount ? {
    date: row.dateReleased || row.date,
    particulars: row.description,
    receivedBy: row.requestedBy,
    requestType: row.requestType || '',
    cashOut: row.amount,
    linkCompany: linkCompany,
  } : null;

  const prevKey = row._fundLinkedKey;
  const prevId = row._fundLinkedId;
  if(prevKey && prevId && (prevKey!==targetKey || !validAmount)){
    const prevMod = MODULES.find(m=>m.key===prevKey);
    if(prevMod){
      let prevRows = await getModuleData(prevMod);
      const prevRow = prevRows.find(r=>r.id===prevId);
      if(prevRow) await removeLinkedCompanion(prevRow);
      prevRows = prevRows.filter(r=>r.id!==prevId);
      state.cache[prevKey] = prevRows;
      await saveRows(prevKey, prevRows);
    }
    row._fundLinkedKey = undefined;
    row._fundLinkedId = undefined;
  }
  if(!targetKey || !validAmount) return;

  const targetMod = MODULES.find(m=>m.key===targetKey);
  let rows = await getModuleData(targetMod);
  let companionRow;
  if(row._fundLinkedKey===targetKey && row._fundLinkedId){
    const idx = rows.findIndex(r=>r.id===row._fundLinkedId);
    if(idx>-1){ rows[idx] = { ...rows[idx], ...companion }; companionRow = rows[idx]; }
    else { const id=uid(); companionRow = {id,_seq:Date.now(),...companion}; rows.push(companionRow); row._fundLinkedId=id; }
  } else {
    const id = uid();
    companionRow = { id, _seq: Date.now(), ...companion };
    rows.push(companionRow);
    row._fundLinkedKey = targetKey;
    row._fundLinkedId = id;
  }
  // Let the new Petty Cash/Borrowed Funds entry run its own onward sync to
  // the company Expense tab too, same as if it had been entered by hand.
  await syncLinkedCompanion(targetMod, companionRow);
  state.cache[targetKey] = rows;
  await saveRows(targetKey, rows);
}
async function removeFundSourceCompanion(row){
  if(!row._fundLinkedKey || !row._fundLinkedId) return;
  const targetMod = MODULES.find(m=>m.key===row._fundLinkedKey);
  if(!targetMod) return;
  let rows = await getModuleData(targetMod);
  const companionRow = rows.find(r=>r.id===row._fundLinkedId);
  if(companionRow) await removeLinkedCompanion(companionRow);
  rows = rows.filter(r=>r.id!==row._fundLinkedId);
  state.cache[row._fundLinkedKey] = rows;
  await saveRows(row._fundLinkedKey, rows);
}

/* Categories may use "Mother Account:Sub Account" naming (matching the QBO
   chart of accounts convention) so a receipt can be filed at the specific
   sub-account level while still rolling up to its mother account in
   subtotals. A category with no colon has no mother account and stands on
   its own. */
function splitCategoryParent(cat){
  const idx = (cat||'').indexOf(':');
  return idx===-1 ? { parent:null, child:cat||'' } : { parent:cat.slice(0,idx), child:cat.slice(idx+1) };
}

async function loadReceiptCategories(){
  let cats = await loadObj('receipt_categories', null);
  if(!cats){
    // First run: seed from the curated defaults + anything already saved
    // under the legacy custom_receipt_categories key, so nothing Danna
    // already added disappears when this list becomes editable.
    const legacyCustom = await loadObj('custom_receipt_categories', []);
    cats = [...RECEIPT_CATEGORIES_DEFAULT, ...legacyCustom.filter(c=>!RECEIPT_CATEGORIES_DEFAULT.includes(c))];
    await saveObj('receipt_categories', cats);
  } else {
    // Already seeded (e.g. from an earlier, shorter default list) — merge in
    // any curated categories that aren't there yet, without touching or
    // duplicating anything Danna has since renamed, deleted, or added.
    const missing = RECEIPT_CATEGORIES_DEFAULT.filter(c=>!cats.includes(c));
    if(missing.length){
      cats = [...cats, ...missing];
      await saveObj('receipt_categories', cats);
    }
  }
  return cats;
}
/* Renaming/deleting a category should not silently orphan receipts already
   filed under the old name — this walks every receipt on every BGC Petty
   Cash / Borrowed Funds entry and updates matches. oldCat===newCat with
   newCat='' means "delete": matching receipts are cleared back to blank
   category rather than left pointing at a name that no longer exists. */
async function renameReceiptCategoryEverywhere(oldCat, newCat){
  for(const key of ['bgc_pettycash','bgc_borrowed']){
    const mod = MODULES.find(m=>m.key===key);
    let rows = await getModuleData(mod);
    let changed = false;
    rows = rows.map(r=>{
      if(!Array.isArray(r.receipts) || !r.receipts.length) return r;
      let rowChanged = false;
      const receipts = r.receipts.map(rc=>{
        if(rc.category===oldCat){ rowChanged = true; return {...rc, category:newCat}; }
        return rc;
      });
      if(rowChanged) changed = true;
      return rowChanged ? {...r, receipts} : r;
    });
    if(changed){ state.cache[key] = rows; await saveRows(key, rows); }
  }
}
function openManageCategoriesModal(onChange){
  const ov = el('div',{class:'modal-overlay'});
  const box = el('div',{class:'modal-box', style:'max-width:480px;'});
  box.appendChild(el('h3',{}, '⚙️ Manage Expense Categories'));
  box.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft);'},
    'Renaming updates this category everywhere it\'s already used on past receipts. Deleting removes it from the picklist — receipts already filed under it keep showing that name in past Liquidation Forms, but you won\'t be able to pick it for new lines. Use "Mother Account:Sub Account" (e.g. "Company Car Expenses:Gasoline") to have a category roll up under a mother account subtotal on the Liquidation Form.'));
  const listWrap = el('div',{});
  box.appendChild(listWrap);

  async function redraw(){
    const cats = await loadReceiptCategories();
    listWrap.innerHTML = '';
    cats.forEach(cat=>{
      const row = el('div',{style:'display:flex; gap:6px; align-items:center; margin-bottom:6px;'});
      const inp = el('input',{type:'text', style:'flex:1; border:1px solid #DED6E4; border-radius:6px; padding:6px 8px; font-size:12.5px;'});
      inp.value = cat;
      const saveBtn = el('button',{title:'Save rename', style:'flex-shrink:0;'}, '💾');
      saveBtn.addEventListener('click', async ()=>{
        const newName = inp.value.trim();
        if(!newName || newName===cat) return;
        let cats2 = await loadReceiptCategories();
        if(cats2.includes(newName)){
          // Merging into an existing category: cascade the rename on every
          // receipt, then drop the old name from the list (the new one is
          // already there, so no duplicate entry is added).
          if(!confirm(`"${newName}" already exists. Merge "${cat}" into it? All receipts filed under "${cat}" will be moved to "${newName}".`)) return;
          await renameReceiptCategoryEverywhere(cat, newName);
          cats2 = cats2.filter(c=>c!==cat);
          await saveObj('receipt_categories', cats2);
          await redraw();
          if(onChange) onChange();
          return;
        }
        cats2 = cats2.map(c=> c===cat ? newName : c);
        await saveObj('receipt_categories', cats2);
        await renameReceiptCategoryEverywhere(cat, newName);
        await redraw();
        if(onChange) onChange();
      });
      const delBtn = el('button',{title:'Delete category', style:'flex-shrink:0;'}, '✕');
      delBtn.addEventListener('click', async ()=>{
        if(!confirm(`Delete "${cat}"? Existing receipts already using it keep the name for the record, but it won't be selectable anymore.`)) return;
        let cats2 = await loadReceiptCategories();
        cats2 = cats2.filter(c=>c!==cat);
        await saveObj('receipt_categories', cats2);
        await redraw();
        if(onChange) onChange();
      });
      row.appendChild(inp); row.appendChild(saveBtn); row.appendChild(delBtn);
      listWrap.appendChild(row);
    });
  }
  redraw();

  const addRow = el('div',{style:'display:flex; gap:6px; margin-top:10px;'});
  const addInp = el('input',{type:'text', placeholder:'New category, or "Mother:Sub" (e.g. Company Car Expenses:Insurance)', style:'flex:1; border:1px solid #DED6E4; border-radius:6px; padding:6px 8px; font-size:12.5px;'});
  const addBtn2 = el('button',{class:'savebtn secondary', style:'flex-shrink:0; padding:6px 12px;'}, '+ Add');
  addBtn2.addEventListener('click', async ()=>{
    const name = addInp.value.trim();
    if(!name) return;
    let cats2 = await loadReceiptCategories();
    if(cats2.includes(name)){ alert('That category already exists.'); return; }
    cats2.push(name);
    await saveObj('receipt_categories', cats2);
    addInp.value = '';
    await redraw();
    if(onChange) onChange();
  });
  addRow.appendChild(addInp); addRow.appendChild(addBtn2);
  box.appendChild(addRow);

  const closeBtn = el('button',{class:'modal-close', style:'margin-top:14px;'}, 'Close');
  closeBtn.addEventListener('click', ()=> ov.remove());
  box.appendChild(closeBtn);
  ov.appendChild(box);
  ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
}

/* Reference-only EWT (Expanded Withholding Tax) rates for the most common
   transaction types Danna logs. These are general/common rates, NOT a
   guarantee for every situation — actual ATC and rate can depend on payee
   type, income thresholds, and specific BIR rulings, so always confirm with
   an accountant before filing. This just saves her from having to remember
   the rough percentage while entering a receipt. */
const EWT_RATE_REFERENCE = [
  { keywords:['rent'], rate:0.05, label:'Rent — ref. 5%' },
  { keywords:['consultant','professional','legal affairs','notarial'], rate:0.10, label:'Professional/Consultant Fees — ref. 10% (up to 15% if payee\u2019s gross income exceeds \u20b13M/yr)' },
  { keywords:['repairs and maintenance','labor','delivery','it expenses','marketing'], rate:0.02, label:'Contractors/Services — ref. 2%' },
  { keywords:['office expenses:supplies','food supplies'], rate:0.01, label:'Regular Supplier of Goods — ref. 1%' },
];
function suggestEwtRate(category){
  const c = (category||'').toLowerCase();
  return EWT_RATE_REFERENCE.find(r => r.keywords.some(k => c.includes(k))) || null;
}

    tblWrap.innerHTML = '';
    catSelects.length = 0;
    const t = el('table',{style:'width:100%; border-collapse:collapse; font-size:12.5px;'});
    t.appendChild(el('thead',{},el('tr',{},['Receipt/Invoice #','Date','Category','Description','TIN Number','VAT Amount','Withholding Tax','Amount',''].map(h=>el('th',{},h)))));
    const tbody = el('tbody');
    receipts.forEach((rc, idx)=>{
      const tr = el('tr');
      const mk = (key, type)=>{
        const inp = el('input',{type: type||'text', style:'width:100%; border:1px solid #DED6E4; border-radius:5px; padding:4px 6px; font-size:12px;'});
        inp.value = rc[key]||'';

      };
      tr.appendChild(mk('refNo'));
      tr.appendChild(mk('date','date'));
      const catTd = el('td',{});
      const catSel = el('select',{style:'width:100%; border:1px solid #DED6E4; border-radius:5px; padding:4px 4px; font-size:12px;'});
      catSel.appendChild(el('option',{value:''},'—'));
      // Group sub-accounts under their mother account with <optgroup>;
      // categories with no mother account (no colon) list at the top level.
      const groups = {}; const standalone = [];
      allCategories().forEach(c=>{
        const {parent, child} = splitCategoryParent(c);
        if(parent){ (groups[parent] = groups[parent]||[]).push({full:c, child}); }
        else standalone.push(c);
      });
      standalone.forEach(c=> catSel.appendChild(el('option',{value:c}, c)));
      Object.keys(groups).sort().forEach(parent=>{
        const grp = el('optgroup',{label:parent});

          const added = await addNewCategory();
          catSel.value = added || (rc.category||'');
          rc.category = catSel.value;
        } else {
          rc.category = catSel.value;
        }
      });
      catSelects.push(catSel);
      catTd.appendChild(catSel);
      tr.appendChild(catTd);
      tr.appendChild(mk('description'));
      tr.appendChild(mk('tin'));
      tr.appendChild(mk('vatAmount','number'));

      // Withholding Tax cell: plain input, plus a small reference-rate hint
      // that updates as the category/amount change, with a one-click fill.
      const wtaxTd = el('td',{});
      const wtaxInp = el('input',{type:'number', step:'any', style:'width:100%; border:1px solid #DED6E4; border-radius:5px; padding:4px 6px; font-size:12px;'});
      wtaxInp.value = rc.withholdingTax||'';
      wtaxInp.addEventListener('input', ()=>{ rc.withholdingTax = wtaxInp.value; });
      wtaxTd.appendChild(wtaxInp);
      const wtaxHint = el('div',{style:'font-size:10px; color:#8c7a91; margin-top:2px; line-height:1.3;'});
      wtaxTd.appendChild(wtaxHint);
      function refreshWtaxHint(){
        const suggestion = suggestEwtRate(rc.category);
        wtaxHint.innerHTML = '';
        if(!suggestion) return;
        wtaxHint.appendChild(document.createTextNode('💡 '+suggestion.label));
        const amt = num(rc.amount);

          wtaxHint.appendChild(useBtn);

      const amountTd = mk('amount','number');
      const amountInp = amountTd.querySelector('input');
      amountInp.addEventListener('input', refreshWtaxHint);

      const delTd = el('td',{class:'rowactions'});

  redrawTable();

  const addBtn = el('button',{class:'savebtn secondary', style:'width:auto; padding:8px 14px; margin-top:10px;'}, '+ Add receipt line');
  addBtn.addEventListener('click', ()=>{ receipts.push({id:uid(),refNo:'',date:row.date||todayISO(),category:'',description:'',tin:'',vatAmount:'',withholdingTax:'',amount:''}); redrawTable(); updateTotal(); });
  box.appendChild(addBtn);

  let partialCb = null;
  if(row.requestType==='Cash Advance' && (mod.key==='bgc_pettycash' || mod.key==='bgc_borrowed')){
    partialCb = el('input',{type:'checkbox'}); partialCb.checked = !!row.partialLiquidation;
    box.appendChild(el('label',{style:'display:flex; gap:8px; align-items:flex-start; margin-top:12px; padding:10px 12px; background:#FFF6DC; border:1px solid #F2DFA6; border-radius:10px; font-size:12.5px; cursor:pointer;'},[
      partialCb,
      el('span',{},[el('b',{},'Partial liquidation — more receipts will follow'), el('br'), el('span',{style:'color:var(--ink-soft);'}, 'Tick this if only part of the cash advance has receipts for now (the rest next month). The remaining amount stays as "unliquidated" and no change/abono is made yet. Untick it when the last receipts come in.')])
    ]));
  }
  /* Liquidation date: the day the sukli is actually returned / the abono
     released. Receipts keep their own dates (expense month), while the
     change/abono row follows this date — e.g. a September cash advance
     liquidated in October dates its sukli in October. Defaults to the
     latest receipt date so nothing changes unless Danna picks a date. */
  let liqDateInp = null;
  if(mod.key==='bgc_pettycash' || mod.key==='bgc_borrowed'){
    const rDates = receipts.map(rc=>rc.date).filter(Boolean).sort();
    liqDateInp = el('input',{type:'date', style:'padding:6px 8px; border:1px solid var(--line,#ddd); border-radius:8px;'});
    liqDateInp.value = row.liquidationDate || (rDates.length ? rDates[rDates.length-1] : todayISO());
    box.appendChild(el('label',{style:'display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; padding:10px 12px; background:#F4EEFA; border:1px solid #E2D6F0; border-radius:10px; font-size:12.5px;'},[
      el('span',{},[el('b',{},'Date liquidated (sukli / abono date)'), el('br'), el('span',{style:'color:var(--ink-soft);'}, 'Receipts keep their own dates. The change returned or additional release is recorded on this date — e.g. a September cash advance liquidated in October.')]),
      liqDateInp
    ]));
  }
  const actions = el('div',{class:'modal-actions'});
  const saveBtn = el('button',{class:'savebtn primary'}, '💾 Save receipts');
  saveBtn.addEventListener('click', async ()=>{
    let rows = await getModuleData(mod);
    const idx = rows.findIndex(x=>x.id===row.id);
    if(idx>-1){
      const hadPriorReceipts = Array.isArray(rows[idx].receipts) && rows[idx].receipts.length>0;
      /* A Payment/Reimbursement that already has a Cash Out (money already
         released) keeps that amount; receipts above or below it go through
         the Abono / Change-Returned row instead of overwriting it. */
      const hadCashOut = num(rows[idx].cashOut) > 0;
      let updated = { ...rows[idx], receipts };
      if(partialCb) updated.partialLiquidation = partialCb.checked;
      if(liqDateInp && liqDateInp.value) updated.liquidationDate = liqDateInp.value;
      // Reimbursement/Payment: the FIRST time receipts are entered, Cash Out
      // becomes their total directly (there's no "advance" yet to compare
      // against — this total IS the original amount). But if receipts are
      // later added to or increased on an ALREADY-saved voucher, the
      // original Cash Out stays fixed and the extra goes through the same
      // dated Abono/Change-Returned companion row Cash Advance uses below —
      // otherwise a later addition would retroactively inflate a figure
      // that may have already been relied on for an earlier day's balance.
      if((updated.requestType === 'Reimbursement' || updated.requestType === 'Payment') && !hadPriorReceipts && !hadCashOut){
        const receiptsTotal = receipts.reduce((s,rc)=>s+num(rc.amount),0);
        updated.cashOut = receiptsTotal ? String(receiptsTotal) : '';
      } else if(updated.requestType === 'Cash Advance'){
        // The change/sukli return now lives on its own dated row (see
        // syncChangeReturnRow below) — clear any Cash In left on this row
        // itself from before that existed, so it isn't double-counted.
        updated.cashIn = '';
      }
      // Auto-join each receipt's Receipt/Invoice # into the row's
      // OR/SI/Doc Ref # field, so it doesn't need to be re-typed there.
      // Only overwrites when at least one receipt actually has a ref —
      // a manually-typed Doc Ref on a row with no itemized ref numbers
      // is left alone.
      const refNos = receipts.map(rc=>rc.refNo).filter(v=>v && String(v).trim()!=='');
      if(refNos.length) updated.docRef = refNos.join(', ');
      /* Saving receipts closes out the voucher automatically: a Cash Advance
         becomes Liquidated, a Reimbursement/Payment becomes Paid (and the
         linked company expense follows). Cancelled or Flagged vouchers are
         left alone. */
      if((mod.key==='bgc_pettycash' || mod.key==='bgc_borrowed')
         && receipts.some(rc=>num(rc.amount)>0)
         && !['Cancelled','Flagged'].includes(updated.status)){
        const autoStatus = updated.requestType==='Cash Advance' ? (updated.partialLiquidation ? 'Partially Liquidated' : 'Liquidated')
          : ((updated.requestType==='Reimbursement' || updated.requestType==='Payment') ? 'Paid' : '');
        if(autoStatus){
          updated.status = autoStatus;
          if(updated.linkCompany) updated.linkStatus = autoStatus;
        }
      }
      rows[idx] = updated;
      await syncLinkedCompanion(mod, updated);
      // syncLinkedCompanion may have assigned ids to receipts lacking one,
      // and updated the row's _linkedKey/_linkedId/_linkedReceiptMap in
      // place on `updated` — save AFTER so those stick and don't cause
      // duplicate companions on the next edit.
      rows[idx] = updated;
      if(updated.requestType === 'Cash Advance' || ((updated.requestType === 'Reimbursement' || updated.requestType === 'Payment') && (hadPriorReceipts || hadCashOut))){
        rows = await syncChangeReturnRow(mod, updated, rows);
      }
      state.cache[mod.key] = rows;
      await saveRows(mod.key, rows);
    }
    closeReceiptsModal();
    render();
  });
  actions.appendChild(saveBtn);
  box.appendChild(actions);
  const closeBtn = el('button',{class:'modal-close'}, 'Close');
  closeBtn.addEventListener('click', closeReceiptsModal);
  box.appendChild(closeBtn);

  overlay.appendChild(box);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeReceiptsModal(); });
  document.body.appendChild(overlay);
}

function printLiquidationForm(mod, row){
  const receipts = Array.isArray(row.receipts) ? row.receipts : [];
  const totalExpense = receipts.reduce((s,rc)=>s+num(rc.amount),0);
  const cashAdvance = num(row.cashOut);
  const excess = cashAdvance - totalExpense;
  const excessLabel = excess < 0 ? '(Reimbursement)' : (excess > 0 ? '(Return to BGC)' : '');
  const displayDate = row.originalDate ? row.originalDate : row.date;
  const dateNote = row.liquidationDate ? ` <span style="color:#888; font-size:11px; font-weight:normal;">(Liquidated: ${esc(row.liquidationDate)})</span>`
    : (row.originalDate ? ` <span style="color:#888; font-size:11px; font-weight:normal;">(Liquidated: ${esc(row.date)})</span>` : '');
  const rowsHtml = receipts.map(rc=>{
    const {parent, child} = splitCategoryParent(rc.category);
    const catDisplay = parent ? `${esc(child)}<br><span style="font-size:9.5px; color:#888;">${esc(parent)}</span>` : esc(rc.category);
    return `
    <tr>
      <td>${esc(rc.refNo)}</td>
      <td>${esc(rc.date)}</td>
      <td>${catDisplay}</td>
      <td style="text-align:left;">${esc(rc.description)}</td>
      <td>${esc(rc.tin)}</td>
      <td style="text-align:right;">${rc.vatAmount ? money(rc.vatAmount) : ''}</td>
      <td style="text-align:right;">${rc.withholdingTax ? money(rc.withholdingTax) : ''}</td>
      <td style="text-align:right;">${money(rc.amount)}</td>
    </tr>`;
  }).join('');
  const byCategory = {};
  receipts.forEach(rc=>{
    const c = rc.category || 'Uncategorized';
    byCategory[c] = (byCategory[c]||0) + num(rc.amount);
  });
  // Group category subtotals by mother account (Option 3): sub-account
  // lines indented under their mother, with a "Subtotal — Mother" line;
  // categories with no mother account (no colon) list flat, same as before.
  const groupedTotals = {}; const standaloneTotals = [];
  Object.entries(byCategory).forEach(([c,amt])=>{
    const {parent, child} = splitCategoryParent(c);
    if(parent){ (groupedTotals[parent] = groupedTotals[parent]||[]).push({child, amt}); }
    else standaloneTotals.push({c, amt});
  });
  const motherRowsHtml = Object.keys(groupedTotals).sort().map(parent=>{
    const subs = groupedTotals[parent];
    const subtotal = subs.reduce((s,x)=>s+x.amt,0);
    const subLines = subs.map(({child,amt})=>
      `<div class="trow" style="font-size:11.5px; color:#666;"><div class="tlabel" style="padding-left:14px;">${esc(child)}</div><div class="tval">₱${money(amt)}</div></div>`).join('');
    return subLines + `<div class="trow" style="font-size:12px; font-weight:700; color:#444; border-top:1px dotted #ccc; padding-top:2px; margin-top:1px;"><div class="tlabel">Subtotal — ${esc(parent)}</div><div class="tval">₱${money(subtotal)}</div></div>`;

/* ---- Acknowledgement Receipt — general-purpose signed proof-of-receipt
   for B-Ticket, Daimasu, or Midori. Can be generated from an existing
   Petty Cash/Borrowed Funds voucher (via the loader above) or filled in
   entirely by hand for a third-party payment with no matching voucher. ---- */
/* ---- BIR Form 2307 (Certificate of Creditable Tax Withheld at Source) ----
   Reproduces the general structure of the official form so Danna has
   something ready to hand a supplier, but this is a WORKING/REFERENCE copy,
   not a substitute for the actual current BIR template — payor TIN, payee
   registered address, and exact ATC codes aren't tracked anywhere in this
   dashboard, so those fields are left blank for her (or her accountant) to
   fill in and verify before anything is actually filed or issued. ---- */
function printBIRForm2307(registeredName, payeeObj, mode, monthVal, quarterVal){
  let periodLabel, periodStart, periodEnd;
  if(mode==='quarter'){
    const { year, q } = quarterVal;
    const startMonth = (q-1)*3 + 1;
    const endMonth = startMonth + 2;
    periodStart = `${year}-${String(startMonth).padStart(2,'0')}-01`;
    const lastDay = new Date(year, endMonth, 0).getDate();
    periodEnd = `${year}-${String(endMonth).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    periodLabel = `Q${q} ${year} (${MONTH_NAMES[startMonth-1]}–${MONTH_NAMES[endMonth-1]} ${year})`;
  } else if(mode==='month' && monthVal){
    const [y,m] = monthVal.split('-').map(Number);
    periodStart = `${monthVal}-01`;
    const lastDay = new Date(y, m, 0).getDate();
    periodEnd = `${monthVal}-${String(lastDay).padStart(2,'0')}`;
    periodLabel = `${MONTH_NAMES[m-1]} ${y}`;
  } else {
    const dates = payeeObj.lines.map(l=>l.date).filter(Boolean).sort();
    periodStart = dates[0] || '';
    periodEnd = dates[dates.length-1] || '';
    periodLabel = 'All logged dates';
  }

  const line = (v) => v ? esc(v) : '&nbsp;';
  const rowsHtml = payeeObj.lines.map(l=>{
    const rate = l.amount>0 ? (l.withholdingTax/l.amount*100) : 0;
    return `<tr>
      <td>${esc(monthDisplay(l.date))}</td>
      <td>&nbsp;</td>
      <td>${esc(l.category||'')}</td>
      <td style="text-align:right;">${money(l.amount)}</td>
      <td style="text-align:right;">${rate.toFixed(2)}%</td>
      <td style="text-align:right;">${money(l.withholdingTax)}</td>
    </tr>`;
  }).join('');
  const totalIncome = payeeObj.lines.reduce((s,l)=>s+l.amount,0);
  const totalWtax = payeeObj.lines.reduce((s,l)=>s+l.withholdingTax,0);

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>BIR Form 2307 - ${esc(payeeObj.payee||'')}</title>
  <style>
    body{ font-family: Arial, Helvetica, sans-serif; color:#1a1a1a; padding:24px; font-size:11px; }

    .toolbar{ text-align:center; margin-bottom:14px; }
    .toolbar button{ background:#2E2A3B; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-size:12.5px; cursor:pointer; margin:0 4px; }
    .toolbar .pdfmsg{ font-size:11px; color:#8c7a91; margin-top:6px; }
    h1{ text-align:center; font-size:14px; margin:0 0 2px 0; }
    .sub{ text-align:center; font-size:10.5px; color:#555; margin-bottom:14px; }
    .disclaimer{ background:#FFF6E5; border:1px solid #E8C87A; border-radius:6px; padding:8px 10px; font-size:10px; margin-bottom:14px; }
    .frow{ display:flex; margin-bottom:6px; }
    .frow .flabel{ width:180px; flex-shrink:0; font-weight:700; }
    .frow .fval{ flex:1; border-bottom:1px dotted #999; }
    .section-title{ font-weight:700; font-size:11.5px; margin:14px 0 6px 0; border-bottom:1.5px solid #333; padding-bottom:2px; }
    table.items{ width:100%; border-collapse:collapse; font-size:10.5px; margin-top:8px; }
    table.items th{ border:1px solid #999; padding:5px; background:#F2EEF4; }
    table.items td{ border:1px solid #ccc; padding:5px; }
    .totrow td{ font-weight:700; border-top:1.5px solid #333; }
    .sigrow{ display:flex; justify-content:space-between; margin-top:50px; }
    .sigcol{ width:45%; text-align:center; }
    .sigcol .rule{ border-top:1px solid #333; padding-top:4px; font-size:10px; }
    @media print{ .toolbar{ display:none; } .doc{ border:none; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
  </head><body>
  <div class="toolbar">

    <h1>CERTIFICATE OF CREDITABLE TAX WITHHELD AT SOURCE</h1>
    <div class="sub">BIR Form No. 2307 — Working/Reference Copy — For the Period: ${esc(periodLabel)}</div>
    <div class="disclaimer">⚠ This is a reference copy generated from Danna's dashboard, not an official pre-printed BIR form. Payor TIN, payee's registered address, and exact ATC codes aren't tracked in this system — please fill those in and verify everything against the current official BIR Form 2307 before issuing to the supplier or filing.</div>

        <tr class="totrow"><td colspan="3">TOTAL</td><td style="text-align:right;">₱${money(totalIncome)}</td><td></td><td style="text-align:right;">₱${money(totalWtax)}</td></tr>

    </div>
  </div>
  <script>
    async function download2307PDF(){
      const btns = document.querySelector('.toolbar');

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p','pt','a4');
        const pageWidth = pdf.internal.pageSize.getWidth();
        const imgWidth = pageWidth;
        const imgHeight = canvas.height * imgWidth / canvas.width;

        pdf.save(${JSON.stringify('BIR_Form_2307')}.replace(/[^a-z0-9]+/gi,'_') + '_' + ${JSON.stringify(payeeObj.payee||'')}.replace(/[^a-z0-9]+/gi,'_') + '.pdf');
      }catch(err){

      }
      btns.style.display='';

async function printReimbursementDayForm(mod, row){
  const allRows = await getModuleData(mod);
  const effDate = r => r.tripDate || r.dateOfClaim;
  let dayRows;
  if(row.claimBatch && row.claimBatch.trim()!==''){
    // Manual grouping override: entries sharing the same Employee + Claim
    // Batch print together regardless of their individual Trip Date /
    // Date of Claim values (e.g. a multi-day trip filed as one claim).
    dayRows = allRows.filter(r => r.employee===row.employee && (r.claimBatch||'').trim()===row.claimBatch.trim());
  } else {
    const groupDate = effDate(row);
    dayRows = allRows.filter(r => r.employee===row.employee && !(r.claimBatch && r.claimBatch.trim()!=='') && effDate(r)===groupDate);
  }
  dayRows = dayRows.sort((a,b)=> (a._seq||0) - (b._seq||0));
  const computedDayRows = dayRows.map(r => ({...r, ...reimbursementCompute(r)}));

  // shows a subtotal per day, then a grand total at the very end.

    const d = effDate(r) || '';
    if(!dateGroups[d]){ dateGroups[d] = []; dateOrder.push(d); }

    const rowsHtml = rowsForDate.map(r=>{
