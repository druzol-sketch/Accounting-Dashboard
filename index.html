/* ===== One-click release of a Pending Request =====
   Picks the fund, numbers the voucher, marks the request Proceed with
   today's date, creates the Petty Cash / Borrowed Funds entry (which
   flows on to the company's expenses) and opens the voucher to print. */
async function prOpenRelease(mod, row){
  const old = document.getElementById('prOverlay'); if(old) old.remove();
  const overlay = el('div',{class:'modal-overlay', id:'prOverlay'});
  const box = el('div',{class:'modal-box', style:'max-width:460px;'});
  box.appendChild(el('h3',{}, '🚀 Release — '+(row.description||'request')));
  box.appendChild(el('p',{}, `${row.company||''} · ${row.requestType||''} · ₱${money(row.amount)} · requested by ${row.requestedBy||'—'}`));
  const form = el('div',{class:'od-form'});
  const fld = (label, inp, full)=>{ const w = el('div', full?{class:'od-full'}:{}); w.appendChild(el('label',{},label)); w.appendChild(inp); form.appendChild(w); return inp; };
  const src = el('select'); ['Petty Cash Fund','Borrowed Funds'].forEach(o=> src.appendChild(el('option',{value:o},o))); src.value = row.sourceOfFund || 'Petty Cash Fund'; fld('Get funds from', src);
  const dt = el('input',{type:'date'}); dt.value = todayISO(); fld('Date released', dt);
  const pr = el('input',{type:'checkbox'}); pr.checked = true;
  form.appendChild(el('label',{class:'od-full', style:'display:flex; gap:8px; align-items:center; font-size:12.5px;'},[pr, el('span',{},'Open the voucher to print after releasing')]));
  box.appendChild(form);
  const close = ()=> overlay.remove();
  const actions = el('div',{class:'modal-actions'});
  const go = el('button',{class:'savebtn primary', style:'width:auto; padding:8px 16px;'}, '🚀 Release');
  go.addEventListener('click', async ()=>{
    if(!(num(row.amount)>0)){ alert('This request has no amount.'); return; }
    const rows = (await getModuleData(mod)).map(r=>({...r}));
    const i = rows.findIndex(r=>r.id===row.id); if(i<0) return;
    const upd = { ...rows[i], sourceOfFund: src.value, status:'Proceed', dateReleased: dt.value };
    await syncPendingToFundSource(mod, upd);
    rows[i] = upd; state.cache[mod.key] = rows; await saveRows(mod.key, rows);
    const fundMod = MODULES.find(m=>m.key===upd._fundLinkedKey);
    let fundRow = null;
    if(fundMod){
      const fr = (await getModuleData(fundMod)).map(r=>({...r}));
      const j = fr.findIndex(r=>r.id===upd._fundLinkedId);
      if(j>-1){
        const vno = fr[j].voucherRef || computeNextVoucherNumber(fundMod, fr, dt.value, fundMod.voucherPrefix);
        fr[j] = { ...fr[j], date: dt.value, voucherRef: vno, status: upd.requestType==='Cash Advance' ? 'Released' : 'Paid' };
        fundRow = fr[j];
        state.cache[fundMod.key] = fr; await saveRows(fundMod.key, fr);
        await syncLinkedCompanion(fundMod, fundRow);
      }
    }
    close(); render();
    if(pr.checked && fundMod && fundRow) setTimeout(()=> printVoucher(fundMod, fundRow), 200);
  });
  actions.appendChild(go); box.appendChild(actions);
  const cb = el('button',{class:'modal-close'}, 'Cancel'); cb.addEventListener('click', close); box.appendChild(cb);
  overlay.appendChild(box); overlay.addEventListener('click', ev=>{ if(ev.target===overlay) close(); });
  document.body.appendChild(overlay);
}

/* ===== Late entries =====
   Expenses typed in more than 3 days after their month ended (e.g. a
   late reimbursement). _seq is the time the entry was created. */
function lateEntriesFor(rows, month){
  const [y,m] = month.split('-').map(Number);
  const cutoff = new Date(y, m, 3, 23, 59).getTime(); // 3rd of the next month
  return rows.filter(r=> (r.date||'').slice(0,7)===month && num(r._seq) > cutoff && r.status!=='Cancelled');
}

/* ===== More "Needs Attention" checks (added to the Dashboard list) ===== */
async function extraAttentionItems(){
  const items = [];
  const today = new Date(); today.setHours(0,0,0,0);
  const thisYm = odThisYm(), lastYm = ymShift(thisYm, -1);
  // 1. Cash advances still out after 7 days
  const oldCA = [];
  for(const [key,label] of [['bgc_pettycash','Petty Cash'],['bgc_borrowed','Borrowed Funds']]){
    const mod = MODULES.find(m=>m.key===key); if(!mod) continue;
    (await getModuleData(mod)).forEach(r=>{
      if(r._autoGenerated || r.requestType!=='Cash Advance' || !(num(r.cashOut)>0)) return;
      if(['Liquidated','Cancelled'].includes(r.status)) return;
      const days = Math.round((today - isoToDate(r.date))/86400000);
      if(days > 7) oldCA.push({ cells:[label, r.date, r.voucherRef||'', r.particulars||'', '₱'+money(r.cashOut), `${days} days`], overdue: days>14 });
    });
  }
  if(oldCA.length) items.push({ heading:`${oldCA.length} cash advance${oldCA.length>1?'s':''} not yet liquidated after 7 days`, route:'bgc_pettycash', tableHeaders:['Fund','Date','Voucher','Particulars','Amount','Out for'], tableRows: oldCA });
  // 2. Mandatories unpaid close to / past due
  const mMod = MODULES.find(m=>m.key==='mandatories'), lMod = MODULES.find(m=>m.key==='labor_cost');
  if(mMod && lMod){
    const recs = await getModuleData(mMod), labor = await getModuleData(lMod);
    const mRows = [];
    [ymShift(thisYm,-2), lastYm].forEach(ym=>{
      const lr = labor.filter(r=>(r.payDate||'').slice(0,7)===ym);
      MC_COMPANIES.forEach(comp=> MC_TYPES.forEach(ty=>{
        const exp = r2(lr.filter(r=>comp.entities.includes(r.entity)).reduce((s,r)=>s+ty.calc(r),0));
        if(!(exp>0)) return;
        const rec = recs.find(m=>m.month===ym && m.company===comp.code && mcTypeOf(m)===ty.key);
        if(mcIsPaid(rec)) return;
        const d = Math.round((mcDueDate(ym, ty.due) - today)/86400000);
        if(d <= DUE_DATE_ALERT_DAYS) mRows.push({ cells:[ymLabel(ym), comp.label, ty.label, '₱'+money(exp), mcIsFunded(rec)?'Funded':'Not funded', d<0?`${-d}d overdue`:`Due in ${d}d`], overdue: d<0 });
      }));
    });
    if(mRows.length) items.push({ heading:`${mRows.length} mandator${mRows.length>1?'ies':'y'} not yet paid (due soon or overdue)`, route:'mandatories', tableHeaders:['For','Company','Type','Amount','Funding','Status'], tableRows: mRows });
  }
  // 3. BGC releases with no company
  const unl = [...(await reportUnlinkedBgc(lastYm)), ...(await reportUnlinkedBgc(thisYm))];
  if(unl.length) items.push({ heading:`${unl.length} BGC release${unl.length>1?'s':''} not linked to any company`, route:'bgc_borrowed', tableHeaders:['Fund','Date','Voucher','Particulars','Amount'], tableRows: unl.map(u=>({ cells:[u.fund,u.date,u.ref,u.particulars,'₱'+money(u.amount)] })) });
  // 4-6. Expenses: uncategorized, possible duplicates, wrong company, late
  const unc = [], dup = [], wrong = [], late = [], mandWrong = [];
  for(const [key,label] of [['bticket_expenses','B-Ticket & Tours'],['daimasu_expenses','Daimasu'],['midori_expenses','Midori']]){
    const mod = MODULES.find(m=>m.key===key); if(!mod) continue;
    const rows = (await getModuleData(mod)).filter(r=>[lastYm,thisYm].includes((r.date||'').slice(0,7)) && r.status!=='Cancelled');
    rows.forEach(r=>{ if(!r.category && r.status!=='Pending') unc.push({ cells:[label, r.date, r.description||'', '₱'+money(r.amount)] }); });
    rows.forEach(r=>{ if(/\b(SSS|PHIL-?HEALTH|PAG-?IBIG|HDMF)\b/i.test(r.description||'') && !/maternity|sickness|benefit|bank ch/i.test(r.description||'') && !/bank charge|penalt/i.test(r.category||'') && !isMandatoryExpense(r)) mandWrong.push({ cells:[label, r.date, r.description||'', r.category||'—', '₱'+money(r.amount)] }); });
    const norm = s=> String(s||'').toLowerCase().replace(/\(ref:.*?\)/g,'').replace(/[^a-z0-9]/g,'');
    for(let a=0;a<rows.length;a++) for(let b=a+1;b<rows.length;b++){
      const x = rows[a], y = rows[b];
      if(x.voucherNo && y.voucherNo && String(x.voucherNo).trim()!==String(y.voucherNo).trim()) continue;
      if(num(x.amount)>0 && Math.abs(num(x.amount)-num(y.amount))<0.01 && norm(x.description)===norm(y.description) && Math.abs(isoToDate(x.date)-isoToDate(y.date))<=3*86400000)
        dup.push({ cells:[label, `${x.date} / ${y.date}`, x.description||'', '₱'+money(x.amount)] });
    }
    const other = key==='midori_expenses' ? /daimasu/i : key==='daimasu_expenses' ? /midori/i : null;
    if(other) rows.forEach(r=>{ if(other.test(r.description||'')) wrong.push({ cells:[label, r.date, r.description||'', '₱'+money(r.amount)] }); });
    lateEntriesFor(rows, lastYm).filter(r=>!r._lateNoted).forEach(r=> late.push({ route: key.replace('_expenses','_monthly'), cells:[label, r.date, r.description||'', '₱'+money(r.amount), new Date(num(r._seq)).toLocaleDateString('en-US',{month:'short',day:'numeric'})] }));
  }
  if(mandWrong.length) items.push({ heading:`${mandWrong.length} SSS / PhilHealth / Pag-IBIG payment${mandWrong.length>1?'s':''} not under "Employee's Mandatories" (would be counted twice in the P&L)`, route:'bticket_expenses', tableHeaders:['Company','Date','Description','Category','Amount'], tableRows: mandWrong });
  if(unc.length) items.push({ heading:`${unc.length} expense${unc.length>1?'s':''} with no category`, route:'bticket_expenses', tableHeaders:['Company','Date','Description','Amount'], tableRows: unc });
  // (Possible-duplicate check removed — receipts with different SI numbers were showing as false positives.)
  if(wrong.length) items.push({ heading:`${wrong.length} expense${wrong.length>1?'s':''} that mention another company`, route:'midori_expenses', tableHeaders:['Tab','Date','Description','Amount'], tableRows: wrong });
  if(late.length) items.push({ heading:`${late.length} late entr${late.length>1?'ies':'y'} added to ${ymLabel(lastYm)} after the month ended — open the Monthly Report and click "Noted" once you've told Sir Arnold`, route: late[0].route || 'bticket_monthly', reportMonth: lastYm, tableHeaders:['Company','Date','Description','Amount','Added on'], tableRows: late });
  // 7. Sales: same Credit / Bank Transfer / Membership on back-to-back days (Daimasu)
  const dm = MODULES.find(m=>m.key==='daimasu_sales');
  if(dm){
    const s = sortedByDate((await getModuleData(dm)).filter(r=>[lastYm,thisYm].includes((r.date||'').slice(0,7))),'date');
    const sd = [];
    for(let k=1;k<s.length;k++) ['credit','bankTransfer','membership'].forEach(f=>{ const a = num(s[k-1][f]), b = num(s[k][f]); if(a>0 && Math.abs(a-b)<0.01 && Math.round((isoToDate(s[k].date)-isoToDate(s[k-1].date))/86400000)<=2) sd.push({ cells:[`${s[k-1].date} / ${s[k].date}`, ({credit:'Credit',bankTransfer:'Bank Transfer',membership:'Membership'})[f], '₱'+money(a)] }); });
    if(sd.length) items.push({ heading:`${sd.length} Daimasu sales amount${sd.length>1?'s':''} repeated on back-to-back days (possible double entry)`, route:'daimasu_sales', tableHeaders:['Dates','Field','Amount'], tableRows: sd });
  }
  // 7c. Daimasu weekly cashbox expenses not yet recorded (every Friday)
  {
    for(const sk of ['daimasu_sales','midori_sales']){
    const nm = WEEKLY_CASHBOX[sk].name;
    const wk = (await dmWeeklySummary(sk)).filter(w=> w.due && w.total>0 && (!w.rec || Math.abs(num(w.rec.amount)-w.total)>=0.01) && w.end >= dmShiftISO(todayISO(), -60));
    if(wk.length) items.push({ heading:`${wk.length} week${wk.length>1?'s':''} of ${nm} cashbox expenses to record in ${nm} Expenses`, route:sk, tableHeaders:['Week (Sat – Fri)','Cashbox expenses','Status'], tableRows: wk.map(w=>({ cells:[dmy2(w.start)+' – '+dmy2(w.end), '₱'+money(w.total), w.rec ? 'Changed since recorded' : 'Not recorded'] })) });
    }
  }
  // 8a. Items from saved Fund Requests still waiting for funds
  const frHist = await loadObj('fund_request_history', []);
  const waitRows = [];
  frHist.forEach(rec=> fundWaitingLines(rec).forEach(x=> waitRows.push({ cells:[rec.title||'Fund Request', (x.sec.label||'').replace(/^[A-E]\.\s*/,''), x.line.description||'', '₱'+money(x.line.amount)] })));
  // (Removed — unfunded items already carry over into the new Fund Request.)
  // 8. Locked bank days whose balance no longer matches what was locked
  const locks = readBankLocks();
  if(Object.keys(locks).length){
    const bm = MODULES.find(m=>m.key==='bank_balances');
    const bc = withComputed(bm, await getModuleData(bm));
    const moved = [];
    Object.entries(locks).forEach(([k,v])=>{
      const i = k.lastIndexOf('||'), acct = k.slice(0,i), d = k.slice(i+2);
      const now = acctBalanceAsOf(bc.filter(r=>r.account===acct), d, true);
      if(Math.abs(now - num(v.balance)) >= 0.01) moved.push({ cells:[acct, monthDisplay(d), '₱'+money(v.balance), '₱'+money(now), (now-num(v.balance)>0?'+':'')+money(now-num(v.balance))], overdue:true });
    });
    if(moved.length) items.push({ heading:`${moved.length} locked bank day${moved.length>1?'s':''} no longer at the balance it was locked at`, route:'bank_balances', tableHeaders:['Account','Date','Locked at','Now','Difference'], tableRows: moved });
  }
  return items;
}

async function renderModulePage(container, mod){
  container.innerHTML = '';
  const g = GROUPS[mod.group];
  container.appendChild(el('span',{class:'pill', style:`background:${g.color}`}, g.label));
  container.appendChild(el('div',{class:'pagehead'},[
    el('h1',{},mod.title),
  ]));
  container.appendChild(sharedFlag());

  let rows = await getModuleData(mod);
  if(mod.key==='mandatories'){ await renderMandatoriesChecklist(container, mod, rows); return; }
  if(mod.key==='midori_sales' || mod.key==='daimasu_sales') container.appendChild(dsPasteCard(mod));
  if(mod.key==='labor_cost'){
    container.appendChild(el('div',{style:'display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:14px;'},[mmImportCard(mod), lcImportCard(mod)]));
  }
  const editingRow = (state.editing && state.editing.modKey===mod.key) ? rows.find(x=>x.id===state.editing.rowId) : null;
  // One-shot prefill for a brand-new entry (not editing) -- used by the
  // Acknowledgement Receipt "load from voucher" picker so selecting a
  // voucher fills the Add form without turning it into an edit of that
  // voucher's own row.
  const prefillRow = (!editingRow && state.formPrefill && state.formPrefill.modKey===mod.key) ? state.formPrefill.data : null;
  if(prefillRow) state.formPrefill = null;

  if(mod.key==='creditcards'){
    const summaryComputed = withComputed(mod, rows);
    const cardholders = (mod.fields.find(f=>f.key==='cardholder')||{}).options || [];
    const currentMonth = todayISO().slice(0,7);
    const minAvailableMap = await loadObj('credit_card_min_available', {});
    const recurring = await ccLoadRecurring();
    const soaStore = await loadObj('cc_soa_charges', {});
    const summaryCard = el('div',{class:'card'});
    summaryCard.appendChild(el('h3',{}, '📊 Estimated Balance Today — All Cardholders'));
    summaryCard.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft); margin:-6px 0 12px 0;'},
      `Starts from the latest actual balance (SOA or bank), then takes off payments made after it and adds known charges and recurring subscriptions that fell due after it. Update the actual balance whenever you get one — the estimate resets from there. Default floor is ₱${money(CREDIT_CARD_MIN_AVAILABLE)} available per card; set a different Min Threshold per card if needed.`));
    const sumWrap = el('div',{style:'overflow-x:auto;'});
    const sumTable = el('table',{style:'width:100%; border-collapse:collapse; font-size:12.5px;'});
    sumTable.appendChild(el('thead',{},el('tr',{},['Cardholder','Card','Credit Limit','Min Threshold','Actual Balance','As Of','+ Charges / − Paid since','Est. Balance Today','Est. Available',`Due next ${CC_LOOKAHEAD_DAYS} days`,'Top up needed'].map(h=>el('th',{},h)))));
    const sumBody = el('tbody');
    let gLimit=0, gBal=0, gEst=0, gAvail=0, gTop=0, lowNow=0, lowSoon=0;
    cardholders.forEach(name=>{
      const minThreshold = (minAvailableMap[name]!==undefined && minAvailableMap[name]!=='') ? num(minAvailableMap[name]) : CREDIT_CARD_MIN_AVAILABLE;
      const e = ccEstimate(name, summaryComputed, recurring, minThreshold);
      const tr = el('tr');
      if(e && e.lowNow) tr.style.background = '#FCEAEC'; else if(e && e.lowSoon) tr.style.background = '#FFF7E8';
      tr.appendChild(el('td',{style:'font-weight:600;'}, name));
      tr.appendChild(el('td',{style:'font-variant-numeric:tabular-nums; color:var(--ink-soft);'}, CREDIT_CARD_NUMBERS[name] ? '••'+CREDIT_CARD_NUMBERS[name].slice(-4) : '—'));
      tr.appendChild(el('td',{}, CREDIT_CARD_LIMITS[name] ? '₱'+money(CREDIT_CARD_LIMITS[name]) : '—'));
      const threshTd = el('td',{});
      const threshInput = el('input',{type:'number', step:'any', style:'width:90px; padding:5px 7px; border:1px solid #DED6E4; border-radius:6px;'});
      threshInput.value = (minAvailableMap[name]!==undefined && minAvailableMap[name]!=='') ? minAvailableMap[name] : '';
      threshInput.placeholder = String(CREDIT_CARD_MIN_AVAILABLE);
      threshInput.addEventListener('change', async ()=>{ minAvailableMap[name] = threshInput.value; await saveObj('credit_card_min_available', minAvailableMap); render(); });
      threshTd.appendChild(threshInput);
      tr.appendChild(threshTd);
      if(!e){
        ['—','—','—','—','—','—','—'].forEach(x=> tr.appendChild(el('td',{style:'color:var(--ink-soft);'}, x)));
        sumBody.appendChild(tr); return;
      }
      gLimit += e.limit; gBal += e.bal; gEst += e.estBalance; gAvail += e.estAvailable; gTop += e.needTopUp;
      if(e.lowNow) lowNow++; else if(e.lowSoon) lowSoon++;
      tr.appendChild(el('td',{}, '₱'+money(e.bal)));
      tr.appendChild(el('td',{style:'color:var(--ink-soft); white-space:nowrap;'}, dmy2(e.latest.date)));
      const mv = [];
      if(e.charged) mv.push('+₱'+money(e.charged)+' charges');
      if(e.recurDue) mv.push('+₱'+money(e.recurDue)+' subscriptions');
      if(e.paid) mv.push('−₱'+money(e.paid)+' paid');
      tr.appendChild(el('td',{style:'font-size:11.5px; color:var(--ink-soft);'}, mv.length ? mv.join(' · ') : '—'));
      tr.appendChild(el('td',{style:'font-weight:700;'}, '₱'+money(e.estBalance)));
      const avTd = el('td',{style:'font-weight:700;'});
      avTd.appendChild(document.createTextNode('₱'+money(e.estAvailable)+' '));
      if(e.lowNow) avTd.appendChild(tagEl('LOW','danger'));
      tr.appendChild(avTd);
      tr.appendChild(el('td',{style:'font-size:11.5px;'}, e.upcoming.length ? e.upcoming.map(u=>`${u.name} ₱${money(u.amount)} (${u.date.toLocaleDateString('en-US',{month:'short',day:'numeric'})})`).join(', ') : '—'));
      tr.appendChild(el('td',{style: e.needTopUp>0 ? 'font-weight:700; color:var(--danger);' : 'color:#2f6e42;'}, e.needTopUp>0 ? '₱'+money(e.needTopUp) : '✓ OK'));
      sumBody.appendChild(tr);
    });
    sumTable.appendChild(sumBody);
    sumTable.appendChild(el('tfoot',{},el('tr',{class:'totalrow'},[
      el('td',{},'TOTAL'), el('td',{}), el('td',{}, '₱'+money(gLimit)), el('td',{}), el('td',{}, '₱'+money(gBal)), el('td',{}), el('td',{}), el('td',{}, '₱'+money(gEst)), el('td',{}, '₱'+money(gAvail)), el('td',{}), el('td',{}, gTop>0 ? '₱'+money(gTop) : '✓'),
    ])));
    sumWrap.appendChild(sumTable);
    summaryCard.appendChild(sumWrap);
    if(lowNow || lowSoon){
      summaryCard.appendChild(el('p',{style:`font-size:12px; color:${lowNow?'var(--danger)':'var(--warn)'}; margin:10px 0 0 0; font-weight:700;`},
        `⚠ ${lowNow ? `${lowNow} card${lowNow>1?'s are':' is'} below the floor now` : ''}${lowNow && lowSoon ? ' · ' : ''}${lowSoon ? `${lowSoon} will go below after subscriptions due in the next ${CC_LOOKAHEAD_DAYS} days` : ''} — see "Top up needed".`));
    }

    /* Recurring subscriptions per card */
    const recCard = el('div',{class:'card'});
    const REC_KEY = STORAGE_PREFIX+'meta:ccRecOpen';
    const recOpen = localStorage.getItem(REC_KEY)==='1';
    const recTotal = recurring.reduce((t,x)=>t+num(x.amount),0);
    const nextRec = (()=>{ const t = todayISO(); const end = new Date(isoToDate(t)); end.setDate(end.getDate()+40);
      const endISO = end.getFullYear()+'-'+String(end.getMonth()+1).padStart(2,'0')+'-'+String(end.getDate()).padStart(2,'0');
      const all = []; recurring.forEach(x=> ccRecurringDates(x, t, endISO).slice(0,1).forEach(d=> all.push({x,d}))); all.sort((a,b)=>a.d-b.d); return all[0]; })();
    const recHead = el('div',{style:'display:flex; align-items:center; gap:10px; cursor:pointer; flex-wrap:wrap;'});
    recHead.appendChild(el('h3',{style:'margin:0;'}, '🔁 Recurring Subscriptions'));
    recHead.appendChild(el('span',{style:'font-size:12px; color:var(--ink-soft);'}, `${recurring.length} subscriptions · ~₱${money(recTotal)} a month${nextRec ? ` · next: ${nextRec.x.name} ₱${money(nextRec.x.amount)} on ${nextRec.d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}` : ''}`));
    recHead.appendChild(el('span',{style:'margin-left:auto; font-size:12px; color:#9b3d6e; font-weight:700;'}, recOpen ? '▾ Hide' : '▸ Show'));
    recHead.addEventListener('click', ()=>{ try{ localStorage.setItem(REC_KEY, recOpen ? '0' : '1'); }catch(e){} render(); });
    recCard.appendChild(recHead);
    if(recOpen) recCard.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft); margin:8px 0 10px 0;'},
      'Monthly charges that hit a card on the same day each month (AI tools, software, etc.). They are added to the estimate automatically on their day, and warn you ahead of time. When you upload an SOA, amounts and days update by themselves and new monthly ones are added. For one-off charges, add an entry above with Entry Type "Charge (known)".'));
    const recTbl = el('table',{style:'width:100%; font-size:12.5px;'});
    recTbl.appendChild(el('thead',{},el('tr',{},['Card','Subscription','Amount (₱)','Charged every','',''].map(h=>el('th',{},h)))));
    const recBody = el('tbody');
    recurring.forEach((x, i)=>{
      recBody.appendChild(el('tr',{},[
        el('td',{}, x.cardholder), el('td',{}, x.name||''), el('td',{}, '₱'+money(x.amount)), el('td',{}, ordinalDay(x.day)+' of the month'),
        el('td',{style:'font-size:11px;'}, (()=>{
          const bits = [];
          if(x.auto) bits.push(el('span',{style:'background:#EAF3FB; color:#2F6BA3; border-radius:999px; padding:1px 7px; margin-right:4px;'}, 'added from SOA'));
          const seen = ccRecLastSeen(x, soaStore);
          const latestSoa = ccCardLatestCharge(x.cardholder, soaStore);
          if(seen && latestSoa && (isoToDate(latestSoa)-isoToDate(seen))/86400000 > 40) bits.push(el('span',{style:'background:#FCF1E3; color:#A5641A; border-radius:999px; padding:1px 7px;'}, 'not on recent SOAs — cancelled?'));
          return bits;
        })()),
        (()=>{ const td = el('td',{class:'rowactions'}); const d = el('button',{title:'Remove'},'✕');
          d.addEventListener('click', async ()=>{ if(!confirm(`Remove ${x.name}?`)) return; recurring.splice(i,1); await saveObj('cc_recurring', recurring); render(); });
          td.appendChild(d); return td; })(),
      ]));
    });
    const addTr = el('tr');
    const cSel = el('select',{style:'padding:5px 7px; border:1px solid #DED6E4; border-radius:6px;'}); cardholders.forEach(c=> cSel.appendChild(el('option',{value:c}, c)));
    const nIn = el('input',{type:'text', placeholder:'e.g. ChatGPT, Kling AI', style:'width:100%; padding:5px 7px; border:1px solid #DED6E4; border-radius:6px;'});
    const aIn = el('input',{type:'number', step:'any', placeholder:'0.00', style:'width:110px; padding:5px 7px; border:1px solid #DED6E4; border-radius:6px;'});
    const dIn = el('input',{type:'number', min:'1', max:'31', placeholder:'day', style:'width:70px; padding:5px 7px; border:1px solid #DED6E4; border-radius:6px;'});
    const addB = el('button',{class:'btn small'}, '+ Add');
    addB.addEventListener('click', async ()=>{
      if(!nIn.value.trim() || !num(aIn.value) || !num(dIn.value)){ alert('Please fill in the subscription name, amount and day.'); return; }
      recurring.push({ id:'rec_'+Date.now().toString(36), cardholder:cSel.value, name:nIn.value.trim(), amount:num(aIn.value), day:parseInt(dIn.value,10) });
      await saveObj('cc_recurring', recurring); render();
    });
    [cSel,nIn,aIn,dIn].forEach((x)=>{ addTr.appendChild(el('td',{},[x])); });
    addTr.appendChild(el('td',{})); addTr.appendChild(el('td',{},[addB]));
    recBody.appendChild(addTr);
    recTbl.appendChild(recBody);
    if(recOpen) recCard.appendChild(recTbl);
    container.appendChild(summaryCard);
    container.appendChild(recCard);
    container.appendChild(ccSoaCard(mod));
    { const chc = await ccChargesCard(); if(chc) container.appendChild(chc); }
  }

  if(/_expenses$/.test(mod.key)) await receiptBackfillOnce();
  if(mod.key === 'pending_requests') container.appendChild(prFormImportCard(mod));
  if(mod.key === 'reimbursement') container.appendChild(await reimbEmployeeCard(mod));
  if(mod.key === 'daimasu_sales' || mod.key === 'midori_sales') container.appendChild(await daimasuWeeklyCard(mod));

  if(mod.key === 'acknowledgement_receipts'){
    const pettyRows = await getModuleData(MODULES.find(m=>m.key==='bgc_pettycash'));
    const borrowedRows = await getModuleData(MODULES.find(m=>m.key==='bgc_borrowed'));
    const voucherOptions = [...pettyRows, ...borrowedRows]
      .filter(r=>r.voucherRef && String(r.voucherRef).trim()!=='')
      .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    const pickerCard = el('div',{class:'card'});
    pickerCard.appendChild(el('h3',{}, '🔍 Load From Existing Voucher (optional)'));
    pickerCard.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft); margin:-6px 0 12px 0;'},
      'Pick a Petty Cash or Borrowed Funds voucher to pre-fill the form below \u2014 or just skip this and fill in the form manually for a payment that never went through Petty Cash/Borrowed Funds (e.g. a third-party payment needing its own AR).'));
    const pickRow = el('div',{style:'display:flex; gap:10px; align-items:center; flex-wrap:wrap;'});
    const sel = el('select',{style:'flex:1; min-width:260px; padding:7px 9px; border:1px solid #DED6E4; border-radius:6px;'});
    sel.appendChild(el('option',{value:''}, '— Select a voucher —'));
    voucherOptions.forEach((r,i)=>{
      const label = `${r.voucherRef} — ${dmy2(r.date)} — ${r.particulars||r.remarks||''} (₱${money(r.cashOut||r.cashIn||0)})`;
      sel.appendChild(el('option',{value:String(i)}, label));
    });
    const loadBtn = el('button',{class:'btn'}, 'Load into form below ↓');
    loadBtn.addEventListener('click', ()=>{
      const idx = sel.value;
      if(idx===''){ return; }
      const v = voucherOptions[parseInt(idx,10)];
      state.formPrefill = { modKey:'acknowledgement_receipts', data:{
        date: todayISO(),
        voucherRef: v.voucherRef||'',
        receivedBy: v.receivedBy||'',
        amount: v.cashOut||v.cashIn||'',
        particulars: v.particulars||v.remarks||'',
        preparedBy: v.preparedBy||'',
        approvedBy: v.approvedBy||'',
      }};
      render();
    });
    pickRow.appendChild(sel);
    pickRow.appendChild(loadBtn);
    pickerCard.appendChild(pickRow);
    container.appendChild(pickerCard);
  }

  if(mod.key === 'midori_sales'){
    const computedRows = withComputed(mod, rows);
    const sorted = sortedByDate(computedRows, 'date');
    if(sorted.length){
      const latestRow = sorted[sorted.length-1];
      const depositRows = sorted.filter(r=>num(r.actualDeposit)>0);
      const lastDeposit = depositRows.length ? depositRows[depositRows.length-1] : null;
      const anchorDate = lastDeposit ? lastDeposit.date : sorted[0].date;
      const daysSince = Math.round((new Date(latestRow.date) - new Date(anchorDate)) / 86400000);
      const isStale = daysSince >= MIDORI_DEPOSIT_ALERT_DAYS;
      const cashCard = el('div',{class:'card'});
      cashCard.appendChild(el('h3',{}, '💰 Undeposited Cash Status'));
      const row1 = el('div',{class:'kv', style:'font-size:13px; padding:4px 0;'});
      row1.appendChild(el('span',{},'Current Undeposited Cash (as of '+dmy2(latestRow.date)+')'));
      const valSpan = el('span',{style:'font-weight:700;'}, '₱'+money(latestRow.endingUndeposited));
      row1.appendChild(valSpan);
      cashCard.appendChild(row1);
      const row2 = el('div',{class:'kv', style:'font-size:13px; padding:4px 0;'});
      row2.appendChild(el('span',{}, lastDeposit ? 'Last Deposit' : 'No deposit logged yet — tracking since'));
      const dateSpan = el('span',{});
      dateSpan.appendChild(document.createTextNode(dmy2(anchorDate)+' ('+daysSince+' day'+(daysSince!==1?'s':'')+' ago) '));
      if(isStale) dateSpan.appendChild(tagEl('DEPOSIT DUE','danger'));
      row2.appendChild(dateSpan);
      cashCard.appendChild(row2);
      if(isStale){
        cashCard.appendChild(el('p',{style:'font-size:12px; color:var(--danger); margin:8px 0 0 0; font-weight:700;'},
          `⚠ ${daysSince} days na walang deposit — baka oras nang mag-deposit para hindi lumaki pa ang cash on hand.`));
      }
      container.appendChild(cashCard);
    }
  }

  // --- Add / Edit entry form ---
  const formCard = el('div',{class:'card'});
  formCard.appendChild(el('h3',{}, editingRow ? '✎ Edit entry' : 'Add entry'));
  const grid = el('div',{class:'form-grid'});
  const advGrid = el('div',{class:'form-grid', style:'margin-top:10px;'});
  let advHasValue = false;
  const inputs = {};
  const sharedCatsNeeded = mod.fields.some(f=>f.useSharedCategories);
  const sharedCats = sharedCatsNeeded ? await loadReceiptCategories() : null;
  mod.fields.forEach(f=>{
    const wrap = el('div',{class:'field', style: f.autoGenerate ? 'min-width:0;' : ''});
    wrap.appendChild(el('label',{},f.label));
    if(f.hint) wrap.appendChild(el('div',{style:'font-size:10.5px; color:var(--ink-soft); margin:-2px 0 4px 0; line-height:1.3;'}, f.hint));
    let inputEl;
    if(f.type==='select'){
      inputEl = el('select',{});
      inputEl.appendChild(el('option',{value:''},'—'));
      f.options.forEach(o=> Array.isArray(o) ? inputEl.appendChild(el('option',{value:o[0]}, o[1])) : inputEl.appendChild(el('option',{value:o}, o)));
      /* Keep a saved value that is not in the list (e.g. an older category)
         so editing the row never wipes it. */
      const savedVal = (editingRow && editingRow[f.key]) || (prefillRow && prefillRow[f.key]);
      const optVals = f.options.map(o=> Array.isArray(o) ? o[0] : o);
      if(savedVal && !optVals.includes(savedVal)) inputEl.appendChild(el('option',{value:savedVal}, savedVal));
    } else if(f.type==='image'){
      inputEl = el('input',{type:'file', accept:'image/*'});
      inputEl._imageData = (editingRow && editingRow[f.key]) ? editingRow[f.key] : '';
    } else {
      inputEl = el('input',{type:f.type==='number'?'number':(f.type==='date'?'date':'text'), step:'any'});
      if(f.default && !editingRow && !prefillRow) inputEl.value = f.default;
      if(f.suggestions || f.useSharedCategories){
        const listId = 'dl_'+f.key+'_'+Math.random().toString(36).slice(2,8);
        inputEl.setAttribute('list', listId);
        const dl = el('datalist',{id:listId});
        (f.useSharedCategories ? sharedCats : f.suggestions).forEach(s=> dl.appendChild(el('option',{value:s})));
        wrap.appendChild(dl);
        if(f.useSharedCategories) inputEl._categoryDatalist = dl;
      }
    }
    if(f.type!=='image' && editingRow && editingRow[f.key]!==undefined) inputEl.value = editingRow[f.key];
    if(f.type!=='image' && prefillRow && prefillRow[f.key]!==undefined) inputEl.value = prefillRow[f.key];
    inputs[f.key] = inputEl;
    if(f.type==='image'){
      wrap.appendChild(inputEl);
      const preview = el('div',{style:'margin-top:6px;'});
      function redrawPreview(){
        preview.innerHTML = '';
        if(inputEl._imageData){
          const thumb = el('img',{src:inputEl._imageData, style:'max-width:110px; max-height:80px; border-radius:6px; border:1px solid #DED6E4; display:block; margin-bottom:4px;'});
          preview.appendChild(thumb);

async function renderCashCount(container, mod, computed){
  const ccKey = 'cashcount_'+mod.key;
  const defaultCC = {bills:{1000:0,500:0,200:0,100:0,50:0,20:0,10:0,5:0}, coins:0};
  let cc = await loadObj(ccKey, defaultCC);
  if(!cc.bills) cc.bills = {...defaultCC.bills};
  if(cc.coins===undefined) cc.coins = 0;

  const denoms = [1000,500,200,100,50,20,10,5];
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{}, '🧮 Cash Denomination Count'));
  card.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft);margin:-6px 0 12px 0;'},
    'Count the physical cash on hand and compare it against the tracked running balance.'));

  const grid = el('div',{class:'form-grid'});
  const inputsMap = {};
  denoms.forEach(d=>{
    const wrap = el('div',{class:'field'});
    wrap.appendChild(el('label',{}, '₱'+d+' bills × qty'));
    const inp = el('input',{type:'number', min:'0', step:'1'});
    inp.value = cc.bills[d]||0;
    inputsMap[d] = inp;
    wrap.appendChild(inp);
    grid.appendChild(wrap);
  });
  const coinsWrap = el('div',{class:'field'});
  coinsWrap.appendChild(el('label',{}, 'Coins (total ₱)'));
  const coinsInput = el('input',{type:'number', min:'0', step:'any'});
  coinsInput.value = cc.coins||0;
  coinsWrap.appendChild(coinsInput);
  grid.appendChild(coinsWrap);
  card.appendChild(grid);

  const resultBox = el('div',{class:'grid-summary'});
  card.appendChild(resultBox);

  function currentRunningBalance(){
    if(!computed.length) return 0;
    return num(computed[computed.length-1][mod.balanceKey]);
  }

  function renderResult(){
    const totalBills = denoms.reduce((s,d)=> s + d*num(inputsMap[d].value), 0);
    const totalCounted = totalBills + num(coinsInput.value);
    const runningBalance = currentRunningBalance();
    const variance = totalCounted - runningBalance;
    resultBox.innerHTML = '';
    resultBox.appendChild(statBox('Total counted', '₱'+money(totalCounted)));
    resultBox.appendChild(statBox('Tracked running balance', '₱'+money(runningBalance)));
    const sign = variance>0 ? '+' : '';
    const varBox = statBox('Variance', sign+'₱'+money(variance));
    varBox.style.border = '2px solid ' + (Math.abs(variance) < 0.005 ? '#3FB27F' : '#E0555F');
    varBox.style.borderRadius = '10px';
    resultBox.appendChild(varBox);
  }
  renderResult();

  async function persist(){
    denoms.forEach(d=>{ cc.bills[d] = num(inputsMap[d].value); });
    cc.coins = num(coinsInput.value);
    await saveObj(ccKey, cc);
    renderResult();
  }
  denoms.forEach(d=> inputsMap[d].addEventListener('input', persist));
  coinsInput.addEventListener('input', persist);

  container.appendChild(card);
}

/* ---- Running Balance Statement: every cash in/out between two dates with
   the running balance after each one, plus beginning and ending balance.
   Opens as a printable page (Save as PDF / screenshot) with a CSV download
   for Excel. Works for Petty Cash, Borrowed Funds and each bank account. ---- */
function renderRunningBalanceStatementCard(container, mod, computed){
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{}, '📑 Running Balance Statement'));
  card.appendChild(el('p',{style:'font-size:12px; color:var(--ink-soft); margin:-4px 0 10px 0;'},
    'Pick the dates to see every cash in and cash out with the running balance. You can save it as PDF, screenshot it, or download it for Excel.'));
  const grid = el('div',{class:'form-grid'});
  const today = todayISO();
  const firstOfMonth = today.slice(0,8)+'01';
  const mkField = (label, input)=>{ const w = el('div',{class:'field'}); w.appendChild(el('label',{},label)); w.appendChild(input); return w; };
  let acctSel = null;
  if(mod.key==='bank_balances'){
    acctSel = el('select',{});
    const accts = [...new Set([...(typeof BANK_ACCOUNTS!=='undefined'?BANK_ACCOUNTS:[]), ...computed.map(r=>r.account).filter(Boolean)])];
    accts.forEach(a=> acctSel.appendChild(el('option',{value:a}, a)));
    grid.appendChild(mkField('Bank account', acctSel));
  }
  const fromInp = el('input',{type:'date'}); fromInp.value = firstOfMonth;
  const toInp = el('input',{type:'date'}); toInp.value = today;
  /* Whole-month shortcut: picking a month fills From/To with its first and
     last day (up to today for the current month). */
  const monthInp = el('input',{type:'month'}); monthInp.value = today.slice(0,7);
  const setMonth = ym=>{
    if(!ym) return;
    const [y,m] = ym.split('-').map(Number);
    const last = new Date(y, m, 0).getDate();
    fromInp.value = ym+'-01';
    const end = ym+'-'+String(last).padStart(2,'0');
    toInp.value = end > today && ym===today.slice(0,7) ? today : end;
  };
  monthInp.addEventListener('change', ()=> setMonth(monthInp.value));
  grid.appendChild(mkField('Whole month', monthInp));
  grid.appendChild(mkField('From', fromInp));
  grid.appendChild(mkField('To', toInp));
  card.appendChild(grid);
  const chipRow = el('div',{style:'display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;'});
  const chip = (label, fn)=>{ const b = el('button',{type:'button', style:'padding:3px 10px; font-size:11.5px; border:1px solid #E5D6EA; border-radius:999px; background:#fff; cursor:pointer;'}, label); b.addEventListener('click', fn); chipRow.appendChild(b); };
  const ymOf = d=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  chip('This month', ()=>{ const ym = today.slice(0,7); monthInp.value = ym; setMonth(ym); });
  chip('Last month', ()=>{ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); const ym = ymOf(d); monthInp.value = ym; setMonth(ym); });
  card.appendChild(chipRow);
  const btn = el('button',{class:'btn', style:'margin-top:10px;'}, '📑 Open Statement');
  btn.addEventListener('click', ()=>{
    if(!fromInp.value || !toInp.value){ alert('Please pick both dates.'); return; }
    if(fromInp.value > toInp.value){ alert('The From date should be on or before the To date.'); return; }
    openRunningBalanceStatement(mod, computed, fromInp.value, toInp.value, acctSel ? acctSel.value : '');
  });
  card.appendChild(btn);
  if(mod.key==='bank_balances'){
    const soaWrap = el('div',{style:'margin-top:16px; padding-top:12px; border-top:1px dashed #E5D6EA;'});
    soaWrap.appendChild(el('h3',{style:'margin-top:0;'}, '🧾 Statement of Account (SOA) for Sir Arnold'));
    soaWrap.appendChild(el('p',{style:'font-size:12px; color:var(--ink-soft); margin:-4px 0 10px 0;'},
      'A formal, plain-format statement using the same dates above. Choose one account or all accounts.'));
    const g2 = el('div',{class:'form-grid'});
    const soaAcct = el('select',{});
    soaAcct.appendChild(el('option',{value:'__all'}, 'All accounts'));
    [...acctSel.options].forEach(o=> soaAcct.appendChild(el('option',{value:o.value}, o.value)));
    const prepInp = el('input',{type:'text'}); prepInp.value = 'Danna Ruzol';
    const apprInp = el('input',{type:'text'}); apprInp.value = 'Arnold Maemura';
    g2.appendChild(mkField('Account(s)', soaAcct));
    g2.appendChild(mkField('Prepared by', prepInp));
    g2.appendChild(mkField('Approved by', apprInp));
    soaWrap.appendChild(g2);
    const soaBtn = el('button',{class:'btn', style:'margin-top:10px;'}, '🧾 Generate SOA');
    soaBtn.addEventListener('click', ()=>{
      if(!fromInp.value || !toInp.value){ alert('Please pick both dates above.'); return; }
      if(fromInp.value > toInp.value){ alert('The From date should be on or before the To date.'); return; }
      const accts = soaAcct.value==='__all' ? [...acctSel.options].map(o=>o.value) : [soaAcct.value];
      openBankSOA(computed, fromInp.value, toInp.value, accts, prepInp.value, apprInp.value);
    });
    soaWrap.appendChild(soaBtn);
    card.appendChild(soaWrap);
  }
  container.appendChild(card);
}
/* Formal Statement of Account for one or more bank accounts: summary of
   beginning / cash in / cash out / ending per account, then each account's
   transactions with the balance after each, and a signature block. Plain
   black-and-white so it prints cleanly for Sir Arnold. */
/* Sales type for Midori bank entries, read from the description. */
const MIDORI_SALES_TYPES = ['Grab Sales','Debit Cash Sales','Cash Sales','Maya Sales'];
function midoriSalesType(rowOrDesc){
  if(rowOrDesc && typeof rowOrDesc==='object'){
    if(rowOrDesc.salesType) return rowOrDesc.salesType==='Other Cash In (not sales)' ? 'Other Cash In' : rowOrDesc.salesType;
    rowOrDesc = rowOrDesc.description;
  }
  const d = String(rowOrDesc||'').toLowerCase();
  if(!d.includes('sale')) return '';
  if(d.includes('grab')) return 'Grab Sales';
  if(d.includes('maya')) return 'Maya Sales';
  if(d.includes('debit')) return 'Debit Cash Sales';
  if(d.includes('cash')) return 'Cash Sales';
  return '';
}
function openBankSOA(computed, from, to, accounts, preparedBy, approvedBy){
  const fmtD = d=> monthDisplay(d);
  const counts = r => !r._autoReversed;
  const sections = accounts.map(acct=>{
    const all = computed.filter(r=> r.date && r.account===acct);
    const before = all.filter(r=> r.date < from);
    const rowsAll = all.filter(r=> r.date >= from && r.date <= to);
    const beginning = before.length ? num(before[before.length-1].runningBalance) : (rowsAll.length ? num(rowsAll[0].runningBalance) - num(rowsAll[0].cashIn) + num(rowsAll[0].cashOut) : 0);
    /* Rows with no amount (balance-override markers, blank entries) are left
       out, and the balance column is re-run from the beginning balance so it
       flows line by line. If the dashboard's own recorded balance differs from
       Beginning + In - Out, the SOA says so instead of hiding it. */
    let run = beginning;
    const rows = rowsAll.filter(r=> num(r.cashIn) || num(r.cashOut)).map(r=>{
      if(counts(r)) run = Math.round((run + num(r.cashIn) - num(r.cashOut))*100)/100;
      return { ...r, runningBalance: run };
    });
    const totalIn = rows.filter(counts).reduce((s,r)=>s+num(r.cashIn),0);
    const totalOut = rows.filter(counts).reduce((s,r)=>s+num(r.cashOut),0);
    const ending = run;
    const recordedEnding = rowsAll.length ? num(rowsAll[rowsAll.length-1].runningBalance) : beginning;
    const variance = Math.round((recordedEnding - ending)*100)/100;
    const isMidori = /midori/i.test(acct);
    let breakdown = null;
    if(isMidori){
      const types = [...MIDORI_SALES_TYPES, 'Other Cash In'];
      breakdown = types.map(t=>{
        const list = rows.filter(counts).filter(r=>{
          const st = midoriSalesType(r);
          return t==='Other Cash In' ? (!st && num(r.cashIn)>0) : st===t;
        });
        const cin = list.reduce((s,r)=>s+num(r.cashIn),0);
        const cout = t==='Other Cash In' ? 0 : list.reduce((s,r)=>s+num(r.cashOut),0);
        return { type:t, count:list.length, cin, cout, net: cin - cout };
      }).filter(b=> b.count>0 || MIDORI_SALES_TYPES.slice(0,3).includes(b.type));
    }
    return { acct, number: (typeof BANK_ACCOUNT_NUMBERS!=='undefined' && BANK_ACCOUNT_NUMBERS[acct]) || '', rows, beginning, totalIn, totalOut, ending, recordedEnding, variance, isMidori, breakdown };
  });
  const sum = k => sections.reduce((s,x)=>s+x[k],0);
  const summaryRows = sections.map(x=>`<tr><td>${esc(x.acct)}</td><td>${esc(x.number)}</td><td class="num">${money(x.beginning)}</td><td class="num">${money(x.totalIn)}</td><td class="num">${money(x.totalOut)}</td><td class="num"><b>${money(x.ending)}</b></td></tr>`).join('');
  const breakdownHtml = x => !x.breakdown ? '' : `
    <h3 style="font-size:12px; margin:12px 0 4px;">Sales Breakdown</h3>
    <table>
      <thead><tr><th>Type</th><th class="num" style="width:80px;">No. of Entries</th><th class="num" style="width:110px;">Cash In</th><th class="num" style="width:110px;">Less: Cash Out</th><th class="num" style="width:115px;">Net</th></tr></thead>
      <tbody>

/* ============================= REPORT GENERATORS ============================= */
function rawNum(v){ return String(num(v)); }
function dmy2(dateStr){
  const parts = (dateStr||'').split('-');
  if(parts.length!==3) return dateStr||'';
  const [y,m,d] = parts;
  return m+'.'+d+'.'+y.slice(2);
}
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
function ddmmmyyyy(dateStr){
  const parts = (dateStr||'').split('-');
  if(parts.length!==3) return dateStr||'';
  const [y,m,d] = parts;
  const mi = parseInt(m,10)-1;
  const monShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mi] || m;
  return `${d}-${monShort}-${y}`;
}
function monthDisplay(dateStr){
  const parts = (dateStr||'').split('-');
  if(parts.length!==3) return dateStr||'';
  const [y,m,d] = parts;
  return MONTH_NAMES[parseInt(m,10)-1]+'.'+d+', '+y;
}
function acctBalanceAsOf(rowsForAccountAll, dateStr, inclusive){
  let bal = 0;
  rowsForAccountAll.forEach(r=>{
    if(inclusive ? r.date<=dateStr : r.date<dateStr) bal = num(r.runningBalance);
  });
  return bal;
}

/* ---- Visual "screenshot" summary: Petty Cash + Borrowed Funds + Bank Balances
   for one date, carrying every field the old notepad-text reports had (company
   name, itemized lines, Less/Cash Available, per-account transactions) — just
   laid out as a styled card instead of a plain-text block, so it can be
   screenshotted straight to Sir Kento instead of copy-pasted. ---- */
async function buildScreenshotSummaryData(dateStr){
  const pcMod = MODULES.find(m=>m.key==='bgc_pettycash');
  const bfMod = MODULES.find(m=>m.key==='bgc_borrowed');
  const bbMod = MODULES.find(m=>m.key==='bank_balances');

  function fundSection(mod, rows){
    const computed = withComputed(mod, rows);
    const rowsForDate = computed.filter(r=>r.date===dateStr);
    const cashOutRows = rowsForDate.filter(r=>num(r.cashOut)>0);
    const cashInRows = rowsForDate.filter(r=>num(r.cashIn)>0);
    const beforeRows = computed.filter(r=>r.date<dateStr);
    const beginning = beforeRows.length ? num(beforeRows[beforeRows.length-1].runningBalance) : 0;
    // Entries flagged "Exclude from Balance" (already reflected in a prior
    // beginning balance) still show here for the audit trail, but shouldn't
    // move today's totals a second time -- same rule the main ledger view
    // already applies via runningBalance.
    const totalOut = cashOutRows.filter(r=>!r._autoReversed).reduce((s,r)=>s+num(r.cashOut),0);
    const totalIn = cashInRows.filter(r=>!r._autoReversed).reduce((s,r)=>s+num(r.cashIn),0);
    const ending = beginning + totalIn - totalOut;
    return { beginning, cashOutRows, cashInRows, totalOut, totalIn, ending };
  }

  const pcRows = await getModuleData(pcMod);
  const bfRows = await getModuleData(bfMod);
  const bbRows = await getModuleData(bbMod);

  const pettyCash = fundSection(pcMod, pcRows);
  const borrowed = fundSection(bfMod, bfRows);

  const bbComputed = withComputed(bbMod, bbRows);
  const maintainingMap = await loadObj('bank_maintaining_balances', {});
  const allocatedMap = await loadObj('bank_allocated_funds', {});
  const bankAccounts = BANK_ACCOUNTS.map(acct=>{
    const rowsForAccountAll = bbComputed.filter(r=>r.account===acct);
    const rowsForDate = rowsForAccountAll.filter(r=>r.date===dateStr);
    const ending = acctBalanceAsOf(rowsForAccountAll, dateStr, true);
    const maintaining = num(maintainingMap[acct]);
    const allocEntry = allocatedMap[acct] || {};
    const allocated = num(allocEntry.amount);
    const usable = ending - maintaining;
    return {
      acct,
      number: BANK_ACCOUNT_NUMBERS[acct] || '',
      starting: acctBalanceAsOf(rowsForAccountAll, dateStr, false),
      ending,
      maintaining,
      usable,
      allocated,
      allocatedNote: allocEntry.note || '',
      truly: usable - allocated,
      cashInRows: rowsForDate.filter(r=>num(r.cashIn)>0),
      cashOutRows: rowsForDate.filter(r=>num(r.cashOut)>0),
    };
  });

  // Daily sales snapshot for Daimasu & Midori, so Sir Kento sees these
  // alongside the BGC/Head Office fund summary he already gets. Both
  // cashiers typically report a day late, so instead of requiring an exact
  // match on dateStr (which would usually come up empty), we pull the most
  // recent entry on or before dateStr and label it with its actual date.
  const daimasuMod = MODULES.find(m=>m.key==='daimasu_sales');
  const daimasuRows = withComputed(daimasuMod, await getModuleData(daimasuMod));
  const daimasuUpToDate = sortedByDate(daimasuRows.filter(r=>r.date && r.date<=dateStr), 'date');
  const daimasuLatest = daimasuUpToDate.length ? daimasuUpToDate[daimasuUpToDate.length-1] : null;
  const daimasuSales = daimasuLatest
    ? { hasEntry:true, grandTotal: num(daimasuLatest.grandTotal), asOfDate: daimasuLatest.date, isLagged: daimasuLatest.date !== dateStr }
    : { hasEntry:false, grandTotal:0, asOfDate:'', isLagged:false };

  const midoriMod = MODULES.find(m=>m.key==='midori_sales');
  const midoriRows = withComputed(midoriMod, await getModuleData(midoriMod));
  const midoriUpToDate = sortedByDate(midoriRows.filter(r=>r.date && r.date<=dateStr), 'date');
  const midoriLatest = midoriUpToDate.length ? midoriUpToDate[midoriUpToDate.length-1] : null;
  const midoriSales = midoriLatest
    ? { hasEntry:true, channelTotal: num(midoriLatest.channelTotal), asOfDate: midoriLatest.date, isLagged: midoriLatest.date !== dateStr }
    : { hasEntry:false, channelTotal:0, asOfDate:'', isLagged:false };

  return { pettyCash, borrowed, bankAccounts, daimasuSales, midoriSales };
}
function buildScreenshotSummaryHTML(dateStr, data, companyName, lessPC, lessBF){
  const { pettyCash, borrowed, bankAccounts, daimasuSales, midoriSales } = data;
  const grandCurrent = bankAccounts.reduce((s,b)=>s+num(b.ending),0);
  const grandMaintaining = bankAccounts.reduce((s,b)=>s+num(b.maintaining),0);

/* ============================= BANK BALANCES (reconciliation sheet) ============================= */
/* Lock / unlock a balanced bank day (see BANK BALANCE LOCKS above). */
async function lockBankDays(list){
  if(!list.length) return;
  const locks = readBankLocks();
  list.forEach(x=>{ locks[x.acct+'||'+x.date] = { lockedAt: new Date().toISOString(), balance: Math.round(num(x.balance)*100)/100, actual: String(x.actual) }; });
  await saveObj('bank_locks', locks);
  const byAcct = {};
  list.forEach(x=>{ (byAcct[x.acct] = byAcct[x.acct] || []).push(x); });
  auditPush(Object.entries(byAcct).map(([acct, xs])=>{
    xs.sort((a,b)=> a.date.localeCompare(b.date));
    const last = xs[xs.length-1];
    return { mod:'Bank Balances', key:'bank_locks', action:'Locked', label:`${acct} · through ${last.date}`, detail: xs.length>1 ? `${xs.length} balanced days locked (${xs[0].date} to ${last.date}) · ending ₱${money(last.balance)}` : `Balanced at ₱${money(last.balance)}` };
  }));
}
async function unlockBankDay(acct, date){
  const reason = prompt(`Unlock ${acct} from ${monthDisplay(date)} onwards?\n\nEntries on these days can be edited again. Type the reason (it goes to the Audit Trail for Ma'am Tin):`, '');
  if(reason===null) return false;
  if(!reason.trim()){ alert('Please type a short reason so the unlock can be checked later.'); return false; }
  const locks = readBankLocks();
  const removed = Object.keys(locks).filter(k=>{ const i = k.lastIndexOf('||'); return k.slice(0,i)===acct && k.slice(i+2)>=date; });
  removed.forEach(k=> delete locks[k]);
  await saveObj('bank_locks', locks);
  auditPush([{ mod:'Bank Balances', key:'bank_locks', action:'Unlocked', label:`${acct} · from ${date}`, detail:`Reason: ${reason.trim()} (${removed.length} locked day${removed.length===1?'':'s'} opened)` }]);
  return true;
}
/* Days that can be locked now: per account, the days with an Actual Balance
   typed in, after the current lock, in order — stopping at the first day
   that doesn't match (so a lock never covers an unbalanced day). */
function bankLockCandidates(computed, actualMap, locks){
  const out = [];
  BANK_ACCOUNTS.forEach(acct=>{
    const through = bankLockedThrough(locks, acct);
    const acctRows = computed.filter(r=>r.account===acct);
    const days = Object.keys(actualMap).filter(k=>{ const i = k.lastIndexOf('||'); return k.slice(0,i)===acct && actualMap[k]!=='' && actualMap[k]!==undefined && actualMap[k]!==null; })
      .map(k=> k.slice(k.lastIndexOf('||')+2)).filter(d=> d>through).sort();
    for(const d of days){
      const ending = acctBalanceAsOf(acctRows, d, true);
      if(Math.abs(num(actualMap[acct+'||'+d]) - ending) >= 0.01) break;
      out.push({ acct, date:d, balance: ending, actual: actualMap[acct+'||'+d] });
    }
  });
  return out;
}

    varianceBox.textContent = Math.abs(diff)<0.005 ? '✓ Matches' : ('Variance: '+(diff>0?'+':'')+money(diff));
  }
  actualInput.addEventListener('change', async ()=>{
    actualMap[actualKey] = actualInput.value;
    await saveObj('bank_actual_balances', actualMap);
    render();
  });
  updateVariance();
  if(dayLocked){ actualInput.disabled = true; actualInput.title = 'Locked — unlock this day to change it'; }
  actualRow.appendChild(actualInput);
  actualRow.appendChild(varianceBox);
  const matchesNow = actualInput.value!=='' && Math.abs(num(actualInput.value) - endingBalance) < 0.01;
  if(!dayLocked && matchesNow){
    const earlierOpen = bankLockCandidates(computed, actualMap, bankLocks).filter(c=>c.acct===acctName && c.date<=dateStr);
    const reachable = earlierOpen.some(c=>c.date===dateStr);
    const lockBtn = el('button',{class:'btn small', style:'margin-left:auto;'}, '🔒 Lock this day');
    lockBtn.title = reachable ? 'Balanced — lock it so it can\u2019t be changed by mistake' : 'An earlier day with an Actual Balance does not match yet, so this day can\u2019t be locked until that is fixed.';
    if(!reachable) lockBtn.disabled = true;
    lockBtn.addEventListener('click', async ()=>{
      const list = earlierOpen.length ? earlierOpen : [{ acct:acctName, date:dateStr, balance:endingBalance, actual:actualInput.value }];
      const msg = list.length>1 ? `Lock ${acctName} through ${monthDisplay(dateStr)}? (${list.length} balanced days)` : `Lock ${acctName} for ${monthDisplay(dateStr)}?`;
      if(!confirm(msg + "\n\nEntries on or before this day can't be edited or deleted until unlocked.")) return;
      await lockBankDays(list); render();
    });

    if(!reachable) actualRow.appendChild(el('span',{style:'font-size:11.5px; color:var(--danger);'}, 'An earlier day doesn\u2019t match yet'));

  typeWrap.appendChild(el('label',{},'Type'));

  typeSel.appendChild(el('option',{value:'Inflow'},'Inflow (Credit)'));

  addGrid.appendChild(typeWrap);

  const amtWrap = el('div',{class:'field'});
  amtWrap.appendChild(el('label',{},'Amount'));
  const amtInput = el('input',{type:'number', step:'any'});
  if(editingRow) amtInput.value = num(editingRow.cashOut)>0 ? editingRow.cashOut : editingRow.cashIn;
  amtWrap.appendChild(amtInput);
  addGrid.appendChild(amtWrap);

  /* Sales Type for inflows: what the credit really is per the UB statement
     (INREM GPAY = Grab, Online Fund Transfer without ref = card/debit,
     CASH DEP = cash). The SOA sales breakdown uses this before the text. */
  const stWrap = el('div',{class:'field'});
  stWrap.appendChild(el('label',{},'Sales Type (inflows)'));
  const stSel = el('select',{});
  [['','— Read from description —'],['Grab Sales','Grab Sales (INREM · GPAY/GRAB)'],['Debit Cash Sales','Card / Debit Sales (Online Fund Transfer, no ref)'],['Cash Sales','Cash Sales (CASH DEP)'],['Maya Sales','Maya Sales'],['Other Cash In (not sales)','Not sales (fund transfer / returned funds)']]
    .forEach(([v,l])=> stSel.appendChild(el('option',{value:v}, l)));
  if(editingRow) stSel.value = editingRow.salesType||'';
  stWrap.appendChild(stSel);
  addGrid.appendChild(stWrap);
  /* Suggest a type as the description is typed, without overriding a choice. */
  descInput.addEventListener('input', ()=>{
    if(stSel.dataset.touched) return;
    const guess = midoriSalesType(descInput.value);
    stSel.value = guess || '';
  });
  stSel.addEventListener('change', ()=>{ stSel.dataset.touched = '1'; });

  const ovrWrap = el('div',{class:'field'});
  ovrWrap.appendChild(el('label',{},'Override Last Balance for this date (optional)'));
  const ovrInput = el('input',{type:'number', step:'any'});
  if(editingRow && editingRow.openingOverride!==undefined) ovrInput.value = editingRow.openingOverride;

  addGrid.appendChild(ovrWrap);

  const acctEnteredWrap = el('div',{class:'field'});
  acctEnteredWrap.appendChild(el('label',{},'Account No. You Typed on Transfer Screen (outflow transfers only)'));

  const bankCats = await loadReceiptCategories();
  const forCoWrap = el('div',{class:'field'});
  forCoWrap.appendChild(el('label',{},'Record as expense of (outflows only)'));
  const forCoSel = el('select',{});
  forCoSel.appendChild(el('option',{value:''},'— Not an expense (transfer, funding, etc.) —'));
  ['B-Ticket Inc.','Daimasu','Midori No Mart'].forEach(c=> forCoSel.appendChild(el('option',{value:c}, c)));
  if(editingRow) forCoSel.value = editingRow.forCompany||'';
  forCoWrap.appendChild(forCoSel);
  addGrid.appendChild(forCoWrap);
  const catWrap = el('div',{class:'field'});
  catWrap.appendChild(el('label',{},'Expense category'));
  const catInput = el('input',{type:'text', list:'bankExpCats', placeholder:'e.g. Subscriptions, Utilities'});
  const catDl = el('datalist',{id:'bankExpCats'}); bankCats.forEach(c=> catDl.appendChild(el('option',{value:c})));

  catWrap.appendChild(catInput); catWrap.appendChild(catDl);

  addCard.appendChild(addGrid);
  addCard.appendChild(el('p',{class:'note'},
    'Pick a company under "Record as expense of" and the payment is added to that company\u2019s Expenses automatically (paid by Bank), with the category you choose. It stays in sync if you edit or delete it here. Leave it blank for transfers between accounts, funding of petty cash or borrowed funds, and other non-expenses.'));

  const btnRow = el('div',{style:'display:flex; gap:8px; margin-top:12px;'});
  const addBtn = el('button',{class:'btn'}, editingRow ? '💾 Save changes' : 'Add transaction');
  addBtn.addEventListener('click', async ()=>{
    let allRows = await getModuleData(mod);
    const isOut = typeSel.value==='Outflow';
    const payload = {
      date: dateStr, account: acctName, description: descInput.value,
      cashIn: isOut ? '' : amtInput.value, cashOut: isOut ? amtInput.value : '',
      openingOverride: ovrInput.value,

    if(editingRow){
      const idx = allRows.findIndex(x=>x.id===editingRow.id);
      if(idx>-1){

        await syncExpenseCompanion(mod, updated);
        allRows[idx] = updated;
      }
      state.editing = null;
    } else {
      const newRow = { id: uid(), _seq: Date.now(), ...payload };
      await syncLinkedCompanion(mod, newRow);
      await syncExpenseCompanion(mod, newRow);
      allRows.push(newRow);
    }
    state.cache[mod.key] = allRows;
    await saveRows(mod.key, allRows);
    render();
  });
  btnRow.appendChild(addBtn);
  if(editingRow){
    const cancelBtn = el('button',{class:'savebtn secondary', style:'width:auto; padding:9px 16px;'}, 'Cancel');
    cancelBtn.addEventListener('click', ()=>{ state.editing=null; render(); });
    btnRow.appendChild(cancelBtn);
  }
  addCard.appendChild(btnRow);
  if(dayLocked){
    const lc = el('div',{class:'card', style:'background:#F4FAF6; border:1px solid #CFE8D7;'});
    lc.appendChild(el('div',{style:'font-size:13px; font-weight:700; color:#2f6e42;'}, '🔒 This day is balanced and locked'));
    lc.appendChild(el('div',{style:'font-size:12px; color:var(--ink-soft); margin-top:4px;'}, `New transactions can't be added on or before ${monthDisplay(lockedThrough)} for this account. Pick a later date, or click Unlock above if something was really missed.`));
    container.appendChild(lc);
  } else container.appendChild(addCard);
  await renderBankToExpensesCard(container, mod, bankCats);
  renderRunningBalanceStatementCard(container, mod, computed);

  /* Entries with no amount and no balance override don't show in the
     inflow/outflow lists, so they can't be deleted there. This finds and
     removes them (kept in the Recycle Bin in case one was needed). */
  const notLocked = r=> !isBankDayLocked(bankLocks, r.account, r.date);
  const emptyRows = rows.filter(r=> notLocked(r) && !num(r.cashIn) && !num(r.cashOut)
    && (r.openingOverride===undefined || r.openingOverride===null || String(r.openingOverride).trim()==='')
    && !/no transaction/i.test(r.description||''));
  /* Balance-marker rows (no amount, only a balance override) repeated on the
     same account and date with the same balance: every copy after the first
     changes nothing, so they can go. */
  /* Only markers that change nothing are offered: the balance they set is
     already the balance carried in from the entry before them. Markers that
     actually correct a balance are left alone. */
  const dupMarkers = [];
  /* Keep at least one entry for every account and date, so days that only
     have a balance marker still show up. */
  const leftPerDay = {};
  computed.forEach(r=>{ const k = r.account+'||'+r.date; leftPerDay[k] = (leftPerDay[k]||0) + 1; });
  /* A balance marker (no amount, only an override) can go when taking it
     out leaves every day's closing balance for that account the same — or,
     on days with an "Actual Balance (from bank)" typed in, makes the closing
     balance match the bank. That second case catches a marker that was
     covering a missing entry which has since been added. */
  const isMarker = r => !num(r.cashIn) && !num(r.cashOut) && r.openingOverride!==undefined && r.openingOverride!==null && String(r.openingOverride).trim()!=='';
  const closingByDay = list => { const m = {}; list.forEach(r=>{ m[r.date] = num(r.runningBalance); }); return m; };
  const acctsWithMarkers = [...new Set(rows.filter(isMarker).map(r=>r.account))];
  acctsWithMarkers.forEach(acct=>{
    let acctRows = rows.filter(r=>r.account===acct);
    for(const m of acctRows.filter(r=> isMarker(r) && notLocked(r))){
      const dayKey = acct+'||'+m.date;
      if(!(leftPerDay[dayKey] > 1)) continue;
      const withIt = closingByDay(withComputed(mod, acctRows));
      const without = acctRows.filter(r=>r.id!==m.id);
      const withoutIt = closingByDay(withComputed(mod, without));
      const ok = Object.keys(withIt).filter(d=> d>=m.date).every(d=>{
        const actual = actualMap[acct+'||'+d];
        if(actual!==undefined && actual!=='') return Math.abs(withoutIt[d] - num(actual)) < 0.01;
        return Math.abs(withoutIt[d] - withIt[d]) < 0.01;
      });
      if(ok){ dupMarkers.push(m); leftPerDay[dayKey]--; acctRows = without; }
    }
  });
  const blankNoDesc = emptyRows.filter(r=>{
    if(String(r.description||'').trim()) return false;
    const k = r.account+'||'+r.date;
    if(leftPerDay[k] > 1){ leftPerDay[k]--; return true; }
    return false;
  });
  if(dupMarkers.length || blankNoDesc.length){
    const dupCard = el('div',{class:'card'});
    dupCard.appendChild(el('h3',{}, '🧹 Duplicate / blank entries'));
    const lines = [];
    if(dupMarkers.length) lines.push(`${dupMarkers.length} balance marker${dupMarkers.length>1?'s':''} no longer needed (no amount; the balances stay the same, or match the bank, without ${dupMarkers.length>1?'them':'it'})`);
    if(blankNoDesc.length) lines.push(`${blankNoDesc.length} blank entr${blankNoDesc.length>1?'ies':'y'} (no description, no amount, no balance)`);
    dupCard.appendChild(el('p',{style:'font-size:12px; color:var(--ink-soft); margin:-4px 0 8px 0;'},
      lines.join(' and ') + '. Removing them keeps every day\'s balance the same (or matching the bank). They will be kept in the Recycle Bin.'));
    const dupBtn = el('button',{class:'btn small'}, `🧹 Remove ${dupMarkers.length + blankNoDesc.length} duplicate/blank entr${(dupMarkers.length + blankNoDesc.length)>1?'ies':'y'}`);
    dupBtn.addEventListener('click', async ()=>{
      if(!confirm('Remove these duplicate/blank entries? Balances stay the same, and they are kept in the Recycle Bin.')) return;
      let allRows = await getModuleData(mod);
      const ids = new Set([...dupMarkers, ...blankNoDesc].map(r=>r.id));
      for(const r of allRows.filter(x=>ids.has(x.id))) await stashToRecycleBin(mod.key, r);
      allRows = allRows.filter(x=>!ids.has(x.id));
      state.cache[mod.key] = allRows;
      await saveRows(mod.key, allRows);
      render();
    });
    dupCard.appendChild(dupBtn);
    container.appendChild(dupCard);
  }
  if(emptyRows.length){
    const cleanCard = el('div',{class:'card'});
    cleanCard.appendChild(el('h3',{}, '🧹 Entries with no amount'));
    cleanCard.appendChild(el('p',{style:'font-size:12px; color:var(--ink-soft); margin:-4px 0 8px 0;'},
      'These have no Cash In, no Cash Out and no balance override, so they are hidden from the lists above. Add the amount (✎) or remove them (kept in the Recycle Bin). "No transaction" notes are not listed here.'));
    const tbl = el('table',{style:'width:100%; font-size:12px;'});
    emptyRows.sort((a,b)=> (a.date||'').localeCompare(b.date||'')).forEach(r=>{
      const tr = el('tr');
      tr.appendChild(el('td',{}, monthDisplay(r.date)));
      tr.appendChild(el('td',{}, r.account||''));
      tr.appendChild(el('td',{}, r.description || '(blank)'));
      const act = el('td',{style:'white-space:nowrap; text-align:right;'});
      const editBtn = el('button',{class:'btn small ghost', style:'padding:1px 8px;'}, '✎ Edit');
      editBtn.addEventListener('click', ()=>{ state.editing = {modKey:'bank_balances', rowId:r.id}; state.bankSheet = { ...(state.bankSheet||{}), account: r.account, date: r.date }; render(); window.scrollTo({top:0, behavior:'smooth'}); });
      const delBtn = el('button',{class:'btn small ghost', style:'padding:1px 8px; margin-left:4px;'}, '✕ Remove');
      delBtn.addEventListener('click', async ()=>{
        if(!confirm('Remove this entry? It will be kept in the Recycle Bin.')) return;
        let allRows = await getModuleData(mod);
        const hit = allRows.find(x=>x.id===r.id);
        if(hit) await stashToRecycleBin(mod.key, hit);
        allRows = allRows.filter(x=>x.id!==r.id);
        state.cache[mod.key] = allRows;
        await saveRows(mod.key, allRows);
        render();
      });
      act.appendChild(editBtn); act.appendChild(delBtn);
      tr.appendChild(act);
      tbl.appendChild(tr);
    });
    cleanCard.appendChild(tbl);
    container.appendChild(cleanCard);
  }
}

/* ============================= CASH & BANK (reconciliation sheet, single stream) ============================= */
function balanceAsOfGeneric(rows, dateStr, inclusive, balanceKey){
  let bal = 0;
  rows.forEach(r=>{
    if(inclusive ? r.date<=dateStr : r.date<dateStr) bal = num(r[balanceKey]);
  });
  return bal;
}
/* Per-account running balance within a single combined Cash & Bank ledger —
   the ledger's own Closing Balance stays one continuous, chronological total
   across every account/channel (the merged figure), but this breaks that same
   data out by the "Account / Channel" each entry was tagged with, so you can
   see e.g. how much of B-Ticket's cash sits in the Betrnk Tours account vs
   B-Ticket Inc.'s own account, without splitting the ledger itself. */
function perAccountRunning(rowsAll, dateStr, overrideKey, inclusive){
  if(inclusive===undefined) inclusive = true;
  const sorted = sortedByDate(rowsAll.map(r=>({...r})), 'date');
  const byAccount = {};
  sorted.forEach(r=>{
    if(inclusive ? (r.date > dateStr) : (r.date >= dateStr)) return;
    const acct = (r.account && r.account.trim()) ? r.account : '(unspecified)';
    const base = (byAccount[acct] !== undefined) ? byAccount[acct] : 0;
    const ovr = r[overrideKey];
    const startBal = (ovr!==undefined && ovr!=='' && ovr!==null) ? num(ovr) : base;
    byAccount[acct] = startBal + num(r.cashIn) - num(r.cashOut);
  });
  return byAccount;
}
async function renderCashBankSheet(container, mod){
  container.innerHTML = '';
  const g = GROUPS[mod.group];
  container.appendChild(el('span',{class:'pill', style:`background:${g.color}`}, g.label));
  container.appendChild(el('div',{class:'pagehead'},[ el('h1',{},mod.title) ]));
  container.appendChild(sharedFlag());

  const rows = await getModuleData(mod);
  const computed = withComputed(mod, rows);

  const sheetKey = mod.key+'Sheet';
  if(!state[sheetKey]) state[sheetKey] = { date: todayISO(), viewAccount: '' };

  const selCard = el('div',{class:'card'});
  const selGrid = el('div',{class:'form-grid'});
  const dateWrap = el('div',{class:'field'});
  dateWrap.appendChild(el('label',{},'Date'));
  const dateSel = el('input',{type:'date'});
  dateSel.value = state[sheetKey].date;
  dateSel.addEventListener('change', ()=>{ state[sheetKey].date = dateSel.value || todayISO(); state.editing=null; render(); });
  dateWrap.appendChild(dateSel);
  selGrid.appendChild(dateWrap);

  /* Accounts known to feed this ledger (e.g. both the parent Betrnk Tours
     account and B-Ticket Inc.'s own account for bticket_cashbank) — listed
     even before any entries exist for one of them, so you can switch to it
     the moment it's used. */
  const linkedAccounts = BANK_ACCOUNTS.filter(a => BANK_ACCOUNT_TO_CASHBANK[a]===mod.key);
  let viewSel;
  if(linkedAccounts.length > 1){
    const viewWrap = el('div',{class:'field'});
    viewWrap.appendChild(el('label',{},'View'));
    viewSel = el('select',{});
    viewSel.appendChild(el('option',{value:''},'All accounts (combined)'));
    linkedAccounts.forEach(a=> viewSel.appendChild(el('option',{value:a}, a)));
    viewSel.value = state[sheetKey].viewAccount || '';
    viewSel.addEventListener('change', ()=>{ state[sheetKey].viewAccount = viewSel.value; render(); });
    viewWrap.appendChild(viewSel);
    selGrid.appendChild(viewWrap);
  }
  selCard.appendChild(selGrid);
  container.appendChild(selCard);

  const dateStr = state[sheetKey].date;
  const viewAccount = linkedAccounts.length > 1 ? (state[sheetKey].viewAccount || '') : '';
  const maintainingMap = await loadObj('bank_maintaining_balances', {});

  const acctBalances = perAccountRunning(rows, dateStr, mod.overrideKey || 'opening');
  linkedAccounts.forEach(a=>{ if(acctBalances[a]===undefined) acctBalances[a] = 0; });
  const acctNames = linkedAccounts.length > 1 ? linkedAccounts : [];
  if(acctNames.length > 1 && !viewAccount){
    const balCard = el('div',{class:'card'});
    balCard.appendChild(el('h3',{}, '💳 Balance by Account (as of '+monthDisplay(dateStr)+')'));
    balCard.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft); margin:-6px 0 12px 0;'},
      'Kept separate here so you can see each account on its own — the Ending Balance below is the same figures merged into one total. Use "View" above to switch to just one account.'));
    const balTable = el('table',{style:'width:100%; border-collapse:collapse; font-size:12.5px;'});
    balTable.appendChild(el('thead',{},el('tr',{},[el('th',{},'Account'),el('th',{style:'text-align:right;'},'Balance')])));
    const balBody = el('tbody');
    let combinedTotal = 0;
    acctNames.forEach(acct=>{
      combinedTotal += acctBalances[acct];
      const tr = el('tr');
      tr.appendChild(el('td',{}, acct));
      tr.appendChild(el('td',{style:'text-align:right;'}, '₱'+money(acctBalances[acct])));
      balBody.appendChild(tr);
    });
    balTable.appendChild(balBody);
    balTable.appendChild(el('tfoot',{},el('tr',{class:'totalrow'},[
      el('td',{},'↳ Combined'), el('td',{style:'text-align:right;'}, '₱'+money(combinedTotal)),
    ])));
    balCard.appendChild(balTable);
    container.appendChild(balCard);
  }

  /* Combined Last Balance / Ending Balance must be built the same reliable
     way as the "Balance by Account" breakdown above (each account's own
     isolated running total, summed) — NOT read off the ledger's single
     merged 'closing' field. That merged field treats every row as one
     continuous story regardless of account, so when two accounts each carry
     their own independent Beginning Balance override on different dates,
     one account's override silently resets the other's running total too.
     Summing perAccountRunning's per-account results avoids that entirely,
     and also naturally includes any manual/pure-cash entries tagged with an
     account name outside the official bank-account list. */
  function combinedAccountTotal(dateStr, inclusive){
    const byAcct = perAccountRunning(rows, dateStr, mod.overrideKey || 'opening', inclusive);
    return Object.values(byAcct).reduce((s,v)=>s+v, 0);
  }
  const lastBalance = viewAccount
    ? (perAccountRunning(rows, dateStr, mod.overrideKey || 'opening', false)[viewAccount] || 0)
    : combinedAccountTotal(dateStr, false);
  const endingBalance = viewAccount
    ? (acctBalances[viewAccount] || 0)
    : combinedAccountTotal(dateStr, true);
  const rowsForDate = computed.filter(r=> r.date===dateStr && (!viewAccount || r.account===viewAccount));
  const outRows = rowsForDate.filter(r=>num(r.cashOut)>0);
  const inRows = rowsForDate.filter(r=>num(r.cashIn)>0);

  const sheetTitle = viewAccount ? mod.title + ' — ' + viewAccount : mod.title;
  const sheetCard = el('div',{class:'card', style:'padding:0; overflow:hidden;'});
  sheetCard.appendChild(el('div',{style:'background:#1f4e6b; color:#fff; padding:12px 18px; text-align:center; font-weight:700; font-size:15px;'}, sheetTitle));
  const infoRow = el('div',{style:'display:flex; justify-content:space-between; padding:12px 18px; font-size:13px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px;'});
  infoRow.appendChild(el('div',{},[el('strong',{},'Date: '), document.createTextNode(monthDisplay(dateStr))]));
  infoRow.appendChild(el('div',{},[el('strong',{},'Last Balance: '), el('span',{style:'color:#2a6fb0; font-weight:700;'}, '₱'+money(lastBalance))]));
  sheetCard.appendChild(infoRow);

  /* Usable Funds: Last Balance net of each linked account's own maintaining
     balance (set once per account in Bank Balances). Every account here
     carries its own separate maintaining requirement — e.g. Tours and
     B-Ticket Inc. each hold their own ₱100k — so a combined view subtracts
     all of them, not just one. This is the figure that should drive real
     funding decisions; the Last Balance above stays the raw reconciled
     total so it keeps matching the actual bank statement. */
  const accountsForUsable = viewAccount ? [viewAccount] : linkedAccounts;
  const totalMaintaining = accountsForUsable.reduce((s,a)=> s + num(maintainingMap[a]), 0);
  const usableFunds = lastBalance - totalMaintaining;
  const usableRow = el('div',{style:'padding:10px 18px; font-size:12.5px; border-bottom:1px solid var(--line); background:#F7FBFF;'});
  usableRow.appendChild(el('div',{style:'display:flex; justify-content:space-between;'},[

/* ============================= FUND REQUEST (custom module) ============================= */
const FUND_REQUEST_DEFAULT = {
  title: 'Fund Request — [Enter Date]',
  sections: {
    betrnk: { label:'A. Betrnk Tours', lines:[], lessAvailable:0, cashOnHand:0 },
    bticket: { label:'B. B-Ticket', lines:[] },
    daimasu: { label:'C. Daimasu Payments', lines:[], cashBank:0, upcomingSale:0, cashOnHand:0 },
    midori: { label:'D. Midori Payments', lines:[], cashBank:0, upcomingSale:0, cashOnHand:0 },
    others: { label:'E. Others', lines:[], lessAvailable:0 },
  },
};

function sectionTotal(sec){ return (sec.lines||[]).filter(l=>!l.cancelled).reduce((s,l)=>s+num(l.amount),0); }
function sectionFinal(key, sec){
  const total = sectionTotal(sec);
  if(key==='betrnk') return total - num(sec.lessAvailable) - num(sec.cashOnHand);
  if(key==='bticket') return total;
  if(key==='daimasu' || key==='midori') return total - num(sec.cashBank) - num(sec.upcomingSale) - num(sec.cashOnHand);
  if(key==='others') return total - num(sec.lessAvailable);
  return total;
}
function fundSectionLessLines(key, sec){
  if(key==='betrnk') return [
    ['Less: Available bank and cash balance', sec.lessAvailable],
    ['Less: Cash on Hand (from last borrowed funds)', sec.cashOnHand],
  ];
  if(key==='daimasu' || key==='midori') return [
    ['Less: Cash and bank balance', sec.cashBank],
    ['Less: Expected Upcoming Sale', sec.upcomingSale],
    ['Less: Cash on Hand', sec.cashOnHand],
  ];
  if(key==='others') return [['Less: Available bank and cash balance', sec.lessAvailable]];
  return [];
}

  const overall = Object.values(finals).reduce((s,v)=>s+v,0);

    async function downloadFundRequestPDF(){
      const btns = document.querySelector('.toolbar');
      btns.style.display='none';
      try{
        const canvas = await html2canvas(document.querySelector('.doc'), {scale:2, backgroundColor:'#ffffff'});
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p','pt','a4');
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const imgWidth = pageWidth;
        const imgHeight = canvas.height * imgWidth / canvas.width;
        const imgData = canvas.toDataURL('image/png');
        let heightLeft = imgHeight;
        let position = 0;
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        while(heightLeft > 0){
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;

}

  const reportCard = el('div',{class:'card'});
  reportCard.appendChild(el('h3',{}, '📋 Fund Request Report'));
  reportCard.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft);margin:-6px 0 12px 0;'},
    'Generates the fund request write-up as a formatted document, ready to send or save as PDF for Sir Arnold before payroll.'));
  const btnRow = el('div',{style:'display:flex; gap:8px; flex-wrap:wrap;'});
  const pdfBtn = el('button',{class:'btn'}, '🖨️ View / Download as PDF');
  pdfBtn.addEventListener('click', ()=> printFundRequestReport(data, finals));
  btnRow.appendChild(pdfBtn);
  const saveBtn = el('button',{class:'btn'}, isEditingSaved ? '💾 Update saved request' : '💾 Save to Dashboard');
  saveBtn.addEventListener('click', async ()=>{
    const history = await loadObj('fund_request_history', []);
    if(isEditingSaved){
      const cleanData = JSON.parse(JSON.stringify(data));
      delete cleanData.editingId; delete cleanData.editingTitle;
      const idx = history.findIndex(r=>r.id===data.editingId);
      const updated = {
        id: data.editingId,
        savedAt: idx>=0 ? history[idx].savedAt : new Date().toISOString(),
        editedAt: new Date().toISOString(),
        title: cleanData.title,
        data: cleanData,
        finals: JSON.parse(JSON.stringify(finals)),
        overall: overall,
        trackWaiting: idx>=0 ? !!history[idx].trackWaiting : true,
      };
      if(idx>=0) history[idx] = updated; else history.unshift(updated);
      await saveObj('fund_request_history', history);
      const stash = await loadObj('fund_request_stash', null);
      const keepThis = confirm('Saved request updated.\n\nOK = keep this version on screen as your working draft (the next request carries over from it).\nCancel = go back to the draft you had before editing (Released / Not needed marks are copied over to matching items).');
      if(keepThis || !stash){
        await saveObj('fund_request', { ...cleanData, savedId: data.editingId });
      } else {
        syncFundLineStatuses(stash, cleanData);
        await saveObj('fund_request', stash);
      }
      localStorage.removeItem(STORAGE_PREFIX+'obj:fund_request_stash');
      render();
      return;
    }
    const newId = 'fr_' + Date.now().toString(36);
    history.unshift({
      id: newId,
      savedAt: new Date().toISOString(),

      overall: overall,
