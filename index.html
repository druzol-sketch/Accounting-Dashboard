/* ---- Estimated card balance between balance updates ----
   Latest actual balance (SOA / bank)  − payments made after it
   + known charges logged after it     + recurring subscriptions that fell due after it.
   Also looks ahead at recurring charges due in the next CC_LOOKAHEAD_DAYS days. */
/* Starter list of monthly subscriptions (from the Aug–Sep 2026 SOAs), added
   once. After that the list is Danna's to edit on the Credit Card page. */
const CC_RECURRING_DEFAULTS = [
  ['Kento Shincho','ChatGPT (OpenAI)',14451.16,12], ['Kento Shincho','Claude (Anthropic)',14432.90,3], ['Kento Shincho','Flova',12870.10,2],
  ['Kento Shincho','TLDX',1871.47,7], ['Kento Shincho','AI Designer',1682.42,13], ['Kento Shincho','Cloudflare',360.82,3], ['Kento Shincho','DeepL',354.40,11],
  ['Julie Ann Ingua','Shutterstock',10305.25,20], ['Julie Ann Ingua','Adobe',8793.95,17], ['Julie Ann Ingua','Genspark',7258.40,20], ['Julie Ann Ingua','QuickBooks Online (Intuit)',6460.55,21],
  ['Julie Ann Ingua','IPR',1915.74,10], ['Julie Ann Ingua','Shopify',1649.78,15], ['Julie Ann Ingua','Resend',1312.32,8], ['Julie Ann Ingua','Cursor',1296.26,19],
  ['Julie Ann Ingua','Vercel',1293.45,18], ['Julie Ann Ingua','Google',1111.00,18], ['Julie Ann Ingua','ExpressVPN',902.55,12], ['Julie Ann Ingua','Netlify',579.55,10], ['Julie Ann Ingua','Evernote',383.79,14],
];
/* Which SOA description a subscription matches (upper-case text that appears in it). */
const CC_REC_MATCH = { 'ChatGPT (OpenAI)':'CHATGPT SUBSCR', 'Claude (Anthropic)':'CLAUDE SUB', 'QuickBooks Online (Intuit)':'INTUIT' };
function ccRecMatch(rec){
  if(rec.match) return String(rec.match).toUpperCase();
  if(CC_REC_MATCH[rec.name]) return CC_REC_MATCH[rec.name];
  return String(rec.name||'').toUpperCase().replace(/\(.*?\)/g,'').trim();
}
const CC_NOT_SUBSCRIPTION = /INTEREST|OVERLIMIT|LATE PAYMENT|PAYMENT|FINANCE CHARGE|ANNUAL FEE/i;
function ccMerchantGroupKey(desc){
  return String(desc).toUpperCase().split(',')[0].replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ');
}
/* After an SOA is saved: update amount/day of subscriptions seen on it, and add
   new ones that show up about a month apart at about the same amount. */
async function ccRefreshRecurring(holder, allCharges, freshKeys){
  const list = await ccLoadRecurring();
  const fresh = allCharges.filter(c=> c.type==='DB' && freshKeys.has(c.key) && !CC_NOT_SUBSCRIPTION.test(c.desc));
  let updated = 0, added = 0;
  list.filter(r=>r.cardholder===holder).forEach(r=>{
    const key = ccRecMatch(r);
    const hits = fresh.filter(c=> String(c.desc).toUpperCase().includes(key));
    if(!hits.length) return;
    hits.sort((a,b)=> Math.abs(a.amount-num(r.amount)) - Math.abs(b.amount-num(r.amount)));
    const h = hits[0];
    if(Math.abs(h.amount - num(r.amount)) > Math.max(50, num(r.amount)*0.25)) return;   /* too different — likely a different plan/usage */
    const day = parseInt(String(h.transDate).slice(8,10),10);
    if(Math.abs(h.amount-num(r.amount))>=0.01 || day!==parseInt(r.day,10)){ r.amount = Math.round(h.amount*100)/100; r.day = day; updated++; }
    r.lastSeen = h.transDate;
  });
  const known = list.filter(r=>r.cardholder===holder).map(ccRecMatch);
  const debits = allCharges.filter(c=> c.type==='DB' && !CC_NOT_SUBSCRIPTION.test(c.desc));
  const groups = {};
  debits.forEach(c=>{ const g = ccMerchantGroupKey(c.desc); if(g) (groups[g] = groups[g] || []).push(c); });
  Object.entries(groups).forEach(([g, cs])=>{
    if(known.some(k=> cs.some(c=> String(c.desc).toUpperCase().includes(k)))) return;
    const newest = cs.filter(c=> freshKeys.has(c.key)).sort((a,b)=> b.transDate.localeCompare(a.transDate))[0];
    if(!newest) return;
    const monthAgo = cs.find(c=>{
      if(c===newest) return false;
      const days = (isoToDate(newest.transDate) - isoToDate(c.transDate))/86400000;
      return days>=25 && days<=35 && Math.abs(c.amount-newest.amount) <= Math.max(20, newest.amount*0.10);
    });

    list.push({ id:'rec_'+Date.now().toString(36)+added, cardholder:holder, name: ccShortName(newest.desc), match: g, amount: Math.round(newest.amount*100)/100, day: parseInt(newest.transDate.slice(8,10),10), lastSeen: newest.transDate, auto:true });

const CC_LOOKAHEAD_DAYS = 7;
function ccRecurringDates(rec, fromISO, toISO){
  /* occurrences of a monthly charge on day rec.day, with fromISO < date <= toISO */
  const out = [];
  const day = Math.max(1, Math.min(31, parseInt(rec.day,10)||1));
  const f = isoToDate(fromISO), t = isoToDate(toISO);
  let y = f.getFullYear(), m = f.getMonth();
  for(let i=0; i<24; i++){
    const last = new Date(y, m+1, 0).getDate();
    const d = new Date(y, m, Math.min(day, last));
    if(d > f && d <= t) out.push(d);
    if(d > t) break;
    m++; if(m>11){ m=0; y++; }
  }
  return out;
}
function ccEstimate(name, computedRows, recurring, minThreshold){
  const rowsFor = computedRows.filter(r=>r.cardholder===name);
  const balanceRows = rowsFor.filter(r=>r.entryType!=='Payment Made' && r.entryType!=='Charge (known)' && !(r.balance==='' || r.balance===undefined || r.balance===null));
  const latest = balanceRows.length ? balanceRows[balanceRows.length-1] : null;
  if(!latest) return null;
  const today = todayISO();
  const since = latest.date || today;
  const limit = CREDIT_CARD_LIMITS[name] || 0;
  const bal = num(latest.balance);
  /* After the balance: a later date, or the same date but entered after the
     balance update (e.g. paid in the afternoon after the morning SOA) — unless
     it came from the SOA itself, which the balance already includes. */
  const afterLatest = r=> (r.date||'') > since || ((r.date||'')===since && (r._seq||0) > (latest._seq||0) && !/From SOA/i.test(r.notes||''));
  const paid = rowsFor.filter(r=>r.entryType==='Payment Made' && afterLatest(r)).reduce((t,r)=>t+num(r.paymentAmount),0);
  const charged = rowsFor.filter(r=>r.entryType==='Charge (known)' && afterLatest(r)).reduce((t,r)=>t+num(r.chargeAmount),0);
  const recs = (recurring||[]).filter(x=>x.cardholder===name && num(x.amount)>0);
  let recurDue = 0;
  recs.forEach(x=>{ recurDue += ccRecurringDates(x, since, today).length * num(x.amount); });
  const ahead = new Date(isoToDate(today)); ahead.setDate(ahead.getDate()+CC_LOOKAHEAD_DAYS);
  const aheadISO = ahead.getFullYear()+'-'+String(ahead.getMonth()+1).padStart(2,'0')+'-'+String(ahead.getDate()).padStart(2,'0');
  const upcoming = [];
  recs.forEach(x=> ccRecurringDates(x, today, aheadISO).forEach(d=> upcoming.push({ name:x.name, amount:num(x.amount), date:d })));
  upcoming.sort((a,b)=>a.date-b.date);
  const upcomingAmt = upcoming.reduce((t,u)=>t+u.amount,0);
  const estBalance = bal - paid + charged + recurDue;
  const estAvailable = limit - estBalance;
  const afterUpcoming = estAvailable - upcomingAmt;
  const floor = minThreshold;
  const needTopUp = Math.max(0, floor - afterUpcoming);
  return { latest, bal, limit, paid, charged, recurDue, estBalance, estAvailable, upcoming, upcomingAmt, afterUpcoming, floor, needTopUp,
    lowNow: estAvailable < floor, lowSoon: afterUpcoming < floor };
}

function officeDuesCoverageOffset(row){

  if(c.startsWith('Two months before')) return -2;
  if(c.startsWith('Next')) return 1;

function officeDuesCoverage(row, dueYm){

  const e = officeDuesEntryFor(row, dueYm);
  if(e && (e.coverFrom || e.coverTo)){
    const start = e.coverFrom ? isoToDate(e.coverFrom) : null;
    const end = e.coverTo ? isoToDate(e.coverTo) : null;
    return { start: start || end, end: end || start, isRange:true, custom:true };
  }
  const sd = parseInt(row && row.coverageStartDay, 10);

    const due = officeDuesDueDate(dueYm, row.dueDay) || clampDay(dueYm, 1);

    return { start: clampDay(covYm, 1), end: clampDay(endYm, 31), isRange:true, covYm };

/* True when this due month is the one already paid by the 1-month advance:

function officeDuesIsAdvanceMonth(row, ym){
  const mode = (row && row.advanceAppliedTo) || '';
  const anchors = [];
  if(mode==='First month' || mode==='First and last month') anchors.push(row.contractStart);
  if(mode==='Last month' || mode==='First and last month') anchors.push(row.contractEnd);
  const c = officeDuesCoverage(row, ym);

function officeDuesInterval(row){

  const now = new Date();
  const thisYm = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const sorted = log.filter(x=>x.month).sort((a,b)=> a.month.localeCompare(b.month));
  if(row.frequency==='One-time'){
    if(!sorted.length) return { month: thisYm, entry: null };

    return { month: lastOne.month, entry: lastOne };

  const step = officeDuesInterval(row);

     one (so a lease starting later isn't flagged overdue today). */

    if(last.month > thisYm){

    month = ymShift(last.month, step);

  for(let i=0; i<3 && !log.find(x=>x.month===month) && officeDuesIsAdvanceMonth(row, month); i++){

  const due = officeDuesDueDate(month, row.dueDay);
  const today = new Date(); today.setHours(0,0,0,0);
  const pastDue = due ? today > due : false;
  if(stored==='' || stored==='Not yet due') return pastDue ? 'Overdue' : (due ? 'Not yet due' : stored);
  return stored;
}

/* Shrinks an uploaded picture (max 1000px, JPEG) before it's saved, so
   screenshots don't fill up the browser's storage and slow the dashboard. */
function shrinkImageDataUrl(dataUrl){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const out = c.toDataURL('image/jpeg', 0.6);
      resolve(out.length < dataUrl.length ? out : dataUrl);
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove();
  }
  if(btn){ const old = btn.textContent; btn.textContent = '✓ Copied'; setTimeout(()=>{ btn.textContent = old; }, 1200); }
}

/* ============ Google Form → Pending Requests ============
   Staff fill in a Google Form; its responses sheet is copied (or downloaded
   as CSV) and pasted here. Columns are matched by their question titles, and
   rows already imported are skipped, so the whole sheet can be pasted again. */
function prParseTable(text){
  const t = String(text||'').replace(/\r/g,'').trim();
  if(!t) return [];
  const delim = t.split('\n')[0].includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<t.length;i++){
    const ch = t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += ch; continue; }
    if(ch==='"'){ q = true; continue; }
    if(ch===delim){ row.push(cell); cell=''; continue; }
    if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; continue; }
    cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r=> r.some(c=> String(c).trim()!==''));
}
function prFormDate(v){
  const s = String(v||'').trim(); if(!s) return '';
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  const d = new Date(s); if(!isNaN(d)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return '';
}
function prPick(options, v){
  const x = String(v||'').toLowerCase(); if(!x) return '';
  const hit = options.find(o=> x.includes(o.toLowerCase()) || o.toLowerCase().includes(x));
  if(hit) return hit;
  if(/daimasu/.test(x)) return 'Daimasu';
  if(/midori/.test(x)) return 'Midori No Mart';
  if(/b-?ticket/.test(x)) return 'B-Ticket Inc.';
  if(/tours|betrnk/.test(x)) return 'Betrnk Tours';
  if(/bgc|head/.test(x)) return 'BGC / Head Office';
  if(/reimburs/.test(x)) return 'Reimbursement';
  if(/advance|\bca\b/.test(x)) return 'Cash Advance';
  if(/pay/.test(x)) return 'Payment';
  return '';
}
const PR_FORM_COLS = [
  ['approvedBy', /approved by|approver/i], ['approvalProof', /proof|approval/i],
  ['releaseMethod', /release|method|mode of/i], ['bankDetails', /bank|e-?wallet|gcash|account no|account number/i],
  ['timestamp', /timestamp/i], ['requestedBy', /name|requested by|requester/i], ['company', /company|entity|branch/i],
  ['requestType', /type/i], ['description', /purpose|description|details|for what|particular/i], ['amount', /amount|how much/i],
  ['dueDate', /due|needed by|when/i], ['attachment', /receipt|attach|upload|file|photo|proof/i], ['remarks', /remark|note|comment/i],
];
function prMapRows(table){
  if(table.length<2) return [];
  const head = table[0].map(h=>String(h).trim());
  const idx = {};
  PR_FORM_COLS.forEach(([k, re])=>{ const i = head.findIndex((h,j)=> re.test(h) && !Object.values(idx).includes(j)); if(i>=0) idx[k] = i; });
  const fields = pendingRequestFields();
  const companyOpts = fields.find(f=>f.key==='company').options, typeOpts = fields.find(f=>f.key==='requestType').options;
  return table.slice(1).map(r=>{
    const g = k=> idx[k]!==undefined ? String(r[idx[k]]||'').trim() : '';
    const amount = num(String(g('amount')).replace(/[^0-9.\-]/g,''));
    const remarks = [g('remarks'), g('approvedBy') ? 'Approved by: '+g('approvedBy') : '', g('approvalProof') ? 'Approval proof: '+g('approvalProof') : '', g('releaseMethod') ? 'Release: '+g('releaseMethod') : '', g('bankDetails') ? 'Bank/e-wallet: '+g('bankDetails').replace(/\s*\n\s*/g,' – ') : '', g('attachment') ? 'Receipt: '+g('attachment') : ''].filter(Boolean).join(' · ');
    return {
      _formKey: [g('timestamp'), g('requestedBy'), amount].join('|'),
      date: prFormDate(g('timestamp')) || todayISO(),
      requestedBy: g('requestedBy'), company: prPick(companyOpts, g('company')) || (g('company') ? 'Other' : ''),
      description: g('description'), amount: amount ? String(amount) : '',
      requestType: prPick(typeOpts, g('requestType')), requestedVia: 'Google Form',
      sourceOfFund: '', dueDate: prFormDate(g('dueDate')), status: 'Pending', dateReleased: '', remarks,
    };
  }).filter(x=> x.requestedBy || x.description || x.amount);
}

/* ============ Daimasu cashbox expenses → one Expenses entry per week ============
   The cashiers' petty cash spending (Cash Disbursement on the daily sales report)
   is recorded once a week, every Friday, as a single Daimasu expense covering
   Saturday to Friday. */
function dmWeekEnd(iso){ const d = isoToDate(iso); const add = (5 - d.getDay() + 7) % 7; d.setDate(d.getDate()+add); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dmShiftISO(iso, days){ const d = isoToDate(iso); d.setDate(d.getDate()+days); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dmCashOut(r){
  const has = !(r.reportedCashDisbursement==='' || r.reportedCashDisbursement===undefined || r.reportedCashDisbursement===null);
  return has ? num(r.reportedCashDisbursement) : (num(r.foodExpenses)+num(r.beverageExpenses)+num(r.otherExpenses));
}
const WEEKLY_CASHBOX = {
  daimasu_sales: { exp:'daimasu_expenses', name:'Daimasu', cashOut: r=> dmCashOut(r), note:'Cash Disbursement from the daily sales reports' },
  midori_sales:  { exp:'midori_expenses',  name:'Midori',  cashOut: r=> num(r.otherExpense), note:'Other Expense taken from the store cash in the daily sales reports' },
};
async function dmWeeklySummary(salesKey){
  salesKey = salesKey || 'daimasu_sales';
  const cfg = WEEKLY_CASHBOX[salesKey];
  const sm = MODULES.find(m=>m.key===salesKey), em = MODULES.find(m=>m.key===cfg.exp);
  const sales = await getModuleData(sm), exps = await getModuleData(em);
  const today = todayISO();
  const weeks = {};
  /* Saturday–Friday weeks, cut at the end of the month so each entry stays within one month. */
  sales.forEach(r=>{
    if(!r.date) return;
    const we = dmWeekEnd(r.date), ws = dmShiftISO(we,-6);
    const ym = r.date.slice(0,7), mStart = ym+'-01';
    const mEndD = new Date(parseInt(ym.slice(0,4),10), parseInt(ym.slice(5,7),10), 0);
    const mEnd = ym+'-'+String(mEndD.getDate()).padStart(2,'0');
    const end = we < mEnd ? we : mEnd, start = ws > mStart ? ws : mStart;
    (weeks[end] = weeks[end] || { end, start, days:[], total:0 });
    const c = cfg.cashOut(r); weeks[end].days.push({date:r.date, amt:c}); weeks[end].total += c;
  });
  return Object.values(weeks).map(w=>{
    w.total = Math.round(w.total*100)/100;
    w.rec = exps.find(e=> e._dmWeek===w.end);
    w.due = w.end <= today;
    return w;
  }).sort((a,b)=> b.end.localeCompare(a.end));
}
async function daimasuWeeklyCard(mod){
  const cfg = WEEKLY_CASHBOX[mod.key];
  const card = el('div',{class:'card', style:'background:#FFF7FB;'});
  const OPEN = STORAGE_PREFIX+'meta:weeklyOpen:'+mod.key;
  const open = localStorage.getItem(OPEN)!=='0';
  const weeks = (await dmWeeklySummary(mod.key)).filter(w=> w.total>0).slice(0,8);
  const pending = weeks.filter(w=> w.due && (!w.rec || Math.abs(num(w.rec.amount)-w.total)>=0.01));

/* One-time fill: copy the receipt no., date, TIN, VAT and WTax from the
   itemized receipts of Petty Cash / Borrowed Funds into the Expenses rows
   they already created (older rows were made before these fields existed). */
let _receiptBackfillDone = false;
async function receiptBackfillOnce(){
  if(_receiptBackfillDone) return; _receiptBackfillDone = true;
  const FLAG = STORAGE_PREFIX+'meta:receiptBackfill1';
  if(localStorage.getItem(FLAG)==='1') return;
  const changed = {};
  for(const srcKey of ['bgc_pettycash','bgc_borrowed']){
    const sm = MODULES.find(m=>m.key===srcKey); if(!sm) continue;
    for(const row of await getModuleData(sm)){
      const map = row._linkedReceiptMap || {};
      for(const rc of (row.receipts||[])){
        const info = map[rc.id]; if(!info || !info.key || !info.id) continue;
        if(!changed[info.key]){ const tm = MODULES.find(m=>m.key===info.key); if(!tm) continue; changed[info.key] = { rows: await getModuleData(tm), dirty:false }; }
        const t = changed[info.key]; const i = t.rows.findIndex(r=>r.id===info.id); if(i<0) continue;
        const r = t.rows[i]; const add = {};
        if(!r.receiptNo && rc.refNo) add.receiptNo = rc.refNo;
        if(!r.receiptDate && rc.date) add.receiptDate = rc.date;
        if(!r.supplierTin && rc.tin) add.supplierTin = rc.tin;
        if(!r.vatAmount && rc.vatAmount) add.vatAmount = rc.vatAmount;
        if(!r.withholdingTax && rc.withholdingTax) add.withholdingTax = rc.withholdingTax;
        if(Object.keys(add).length){ t.rows[i] = Object.assign({}, r, add); t.dirty = true; }
      }
    }
  }
  _auditMuted = true;
  try{ for(const [k,t] of Object.entries(changed)){ if(t.dirty){ state.cache[k] = t.rows; await saveRows(k, t.rows); } } }
  finally{ _auditMuted = false; }
  try{ localStorage.setItem(FLAG,'1'); }catch(e){}
}

/* Declared gross drives the mandatories; what the employee is really paid
   (from the payroll register) drives the labor cost. Once any cutoff has
   actual pay, only the actual amounts typed in are counted. */
function laborCostCompute(row){
  const totalEmployerShare = num(row.sssEr)+num(row.philhealthEr)+num(row.pagibigEr)+num(row.ec);
  const has = v => !(v===''||v===undefined||v===null);
  const h1 = has(row.actual1), h2 = has(row.actual2);
  const half = num(row.grossSalary)/2;
  const actualPay = (h1||h2) ? num(row.actual1) + num(row.actual2) : num(row.grossSalary);
  const totalLaborCost = actualPay + totalEmployerShare;
  return { totalEmployerShare, actualPay, totalLaborCost };
}
function laborCostColumns(){
  return ['payDate','employeeName','grossSalary','actualPay','sssEr','philhealthEr','pagibigEr','ec','totalEmployerShare','totalLaborCost','notes'];
}

async function saveRows(key, rows){

  catch(e){ console.error('save failed', e); alert('Could not save — this browser\'s storage may be full. Save a backup to file now.'); return false; }

async function saveObj(key, obj){

  try{ localStorage.setItem(STORAGE_PREFIX+'obj:'+key, JSON.stringify(obj)); markSaved();

/* ============================= AUDIT TRAIL =============================
   Every add / edit / delete saved on this device is written to a compact
   change log (kept with the backup file). The Audit Trail page lists it and
   prints / exports it so Ma'am Tin can review changes without opening the
   dashboard itself. Only the most recent AUDIT_MAX changes are kept. */
const AUDIT_MAX = 2000;
const AUDIT_OBJ_KEYS = ['bank_actual_balances'];
/* Only these are recorded for Ma'am Tin's review — Petty Cash, Borrowed Funds
   and Bank Balances (incl. actual balances and lock/unlock). Other tabs are
   shared by screenshot instead. */
const AUDIT_KEYS = new Set(['bgc_pettycash', 'bgc_borrowed', 'bank_balances', 'bank_actual_balances', 'bank_locks', 'audit_meta']);
let _auditMuted = false;
const AUDIT_SKIP = new Set(['id','_seq','runningBalance','beginning','closing','match','change','_autoReversed','_linkedKey','_linkedId','totalEmployerShare','totalLaborCost','floatCheck','check','computedCashboxFloat','endingUndeposited','computedForDeposit','shiftTotal','channelTotal','grandTotal','restaurantTotal','barTotal','discrepancy','total']);
function auditShort(v){
  if(v===undefined || v===null) return '';
  let t = (typeof v==='object') ? JSON.stringify(v) : String(v);
  if(/^data:/.test(t) || t.length>2000) return '[file/image]';
  t = t.replace(/\s+/g,' ').trim();
  return t.length>60 ? t.slice(0,57)+'…' : t;
}
function auditModLabel(key){
  const OBJ_LABELS = { fund_request:'Fund Request', fund_request_history:'Fund Request (saved)', bank_actual_balances:'Bank Balances', bank_locks:'Bank Balances', audit_meta:'Audit Trail' };
  if(OBJ_LABELS[key]) return OBJ_LABELS[key];
  const m = MODULES.find(x=>x.key===key);
  if(!m) return key;
  return m.group==='shared' ? m.label.replace(/^[^A-Za-z]+/,'') : (GROUPS[m.group] ? GROUPS[m.group].label+' — ' : '') + m.label;
}
function auditRowLabel(r){
  const txt = r.description || r.particulars || r.payee || r.employeeName || r.notes || r.cardholder || r.detail || r.voucherRef || r.voucherNo || r.purpose || '';
  const amtKey = ['amount','cashOut','cashIn','balance','reportedTotal','grandTotal','actualPay','claimedAmt'].find(k=> r[k]!==undefined && r[k]!=='' && r[k]!==null);
  const parts = [r.date || r.payDate || r.month || '', r.account && !txt ? r.account : '', auditShort(txt), amtKey ? '₱'+money(r[amtKey]) : ''];
  return parts.filter(Boolean).join(' · ') || '(entry)';
}
function auditPush(entries){
  if(_auditMuted || !entries || !entries.length) return;
  entries = entries.filter(e=> AUDIT_KEYS.has(e.key));
  if(!entries.length) return;
  const k = STORAGE_PREFIX+'obj:audit_log';
  let log = [];
  try{ log = JSON.parse(localStorage.getItem(k) || '[]'); }catch(e){ log = []; }
  const now = new Date().toISOString();
  entries.forEach(e=> log.push({ t: now, ...e }));
  if(log.length > AUDIT_MAX) log = log.slice(-AUDIT_MAX);
  try{ localStorage.setItem(k, JSON.stringify(log)); }
  catch(e){ try{ localStorage.setItem(k, JSON.stringify(log.slice(-Math.floor(AUDIT_MAX/4)))); }catch(_){} }
}
function auditDiffRows(key, oldRows, newRows){
  const out = [];
  const mod = auditModLabel(key);
  const oldById = new Map((oldRows||[]).map(r=>[r.id, r]));
  const newIds = new Set((newRows||[]).map(r=>r.id));
  const added = [], edited = [], deleted = [];
  (newRows||[]).forEach(r=>{
    const o = oldById.get(r.id);
    if(!o){ added.push(r); return; }
    const changes = [];
    new Set([...Object.keys(o), ...Object.keys(r)]).forEach(f=>{
      if(AUDIT_SKIP.has(f) || f.startsWith('_') && f!=='_lateNoted') return;
      const a = o[f], b = r[f];
      const sa = (a===undefined||a===null) ? '' : (typeof a==='object' ? JSON.stringify(a) : String(a));
      const sb = (b===undefined||b===null) ? '' : (typeof b==='object' ? JSON.stringify(b) : String(b));
      if(sa===sb) return;
      if(sa.length>2000 || sb.length>2000 || /^data:/.test(sa) || /^data:/.test(sb) || Array.isArray(a) || Array.isArray(b)){ changes.push((COLUMN_LABELS[f]||f)+' updated'); return; }
      changes.push(`${COLUMN_LABELS[f]||f}: ${auditShort(sa)||'(blank)'} → ${auditShort(sb)||'(blank)'}`);
    });
    if(changes.length) edited.push({ r, changes });
  });
  (oldRows||[]).forEach(o=>{ if(!newIds.has(o.id)) deleted.push(o); });
  const bulk = (list, action)=>{
    if(list.length > 25){ out.push({ mod, key, action, label: `${list.length} entries`, detail: 'Bulk change (import / cleanup)' }); return true; }
    return false;
  };
  if(!bulk(added,'Added')) added.forEach(r=> out.push({ mod, key, action:'Added', label: auditRowLabel(r), detail: r._autoGenerated || r._linkedId ? 'auto-linked entry' : '' }));
  if(!bulk(edited,'Edited')) edited.forEach(x=> out.push({ mod, key, action:'Edited', label: auditRowLabel(x.r), detail: x.changes.slice(0,6).join('; ') + (x.changes.length>6 ? ` (+${x.changes.length-6} more)` : '') }));
  if(!bulk(deleted,'Deleted')) deleted.forEach(r=> out.push({ mod, key, action:'Deleted', label: auditRowLabel(r), detail: '' }));
  return out;
}
function auditDiffObj(key, oldObj, newObj){
  const out = [], mod = auditModLabel(key);
  if(key==='bank_actual_balances'){
    const a = oldObj||{}, b = newObj||{};
    new Set([...Object.keys(a), ...Object.keys(b)]).forEach(k=>{
      const va = a[k]===undefined ? '' : String(a[k]), vb = b[k]===undefined ? '' : String(b[k]);
      if(va===vb) return;
      const [acct, d] = k.split('||');
      out.push({ mod, key, action: vb==='' ? 'Deleted' : (va==='' ? 'Added' : 'Edited'), label: `Actual balance · ${acct} · ${d}`, detail: `${va===''?'(blank)':'₱'+money(va)} → ${vb===''?'(blank)':'₱'+money(vb)}` });
    });
  } else if(key==='fund_request_history'){
    const a = oldObj||[], b = newObj||[];
    const ai = new Set(a.map(r=>r.id)), bi = new Set(b.map(r=>r.id));
    b.forEach(r=>{
      if(!ai.has(r.id)) out.push({ mod, key, action:'Saved', label: r.title||'Fund Request', detail: 'Total needed ₱'+money(r.overall) });
      else { const o = a.find(x=>x.id===r.id); if(o && o.editedAt!==r.editedAt) out.push({ mod, key, action:'Edited', label: r.title||'Fund Request', detail: 'Total needed ₱'+money(o.overall)+' → ₱'+money(r.overall) }); }
    });
    a.forEach(r=>{ if(!bi.has(r.id)) out.push({ mod, key, action:'Deleted', label: r.title||'Fund Request', detail: 'Total needed ₱'+money(r.overall) }); });
  } else if(key==='fund_request'){
    const a = oldObj||{sections:{}}, b = newObj||{sections:{}};
    if(a.editingId || b.editingId) return out; /* editing a saved copy — logged when it is saved */
    if((a.title||'')!==(b.title||'') && a.title!==undefined) out.push({ mod, key, action:'Edited', label:'Title', detail: `${auditShort(a.title)} → ${auditShort(b.title)}` });
    const sig = l=> String(l.description||'').trim().toLowerCase()+'|'+num(l.amount);
    Object.keys({...(a.sections||{}), ...(b.sections||{})}).forEach(sk=>{
      const sa = (a.sections||{})[sk] || {lines:[]}, sb = (b.sections||{})[sk] || {lines:[]};
      const secLabel = (sb.label || sa.label || sk).replace(/^[A-E]\.\s*/,'');
      const la = sa.lines||[], lb = sb.lines||[];
      const lineLabel = l=> `${secLabel} · ${auditShort(l.description)||'(no description)'} · ₱${money(l.amount)}`;
      if(la.length===lb.length){
        lb.forEach((l,i)=>{
          const o = la[i];
          if(sig(o)!==sig(l) || (o.dueDate||'')!==(l.dueDate||'') || (o.remarks||'')!==(l.remarks||'')){
            const ch = [];
            if((o.description||'')!==(l.description||'')) ch.push(`Description: ${auditShort(o.description)||'(blank)'} → ${auditShort(l.description)||'(blank)'}`);
            if(num(o.amount)!==num(l.amount)) ch.push(`Amount: ₱${money(o.amount)} → ₱${money(l.amount)}`);
            if((o.dueDate||'')!==(l.dueDate||'')) ch.push(`Due: ${o.dueDate||'(blank)'} → ${l.dueDate||'(blank)'}`);
            if((o.remarks||'')!==(l.remarks||'')) ch.push(`Remarks: ${auditShort(o.remarks)||'(blank)'} → ${auditShort(l.remarks)||'(blank)'}`);
            out.push({ mod, key, action:'Edited', label: lineLabel(l), detail: ch.join('; ') });
          }
          if(!!o.released !== !!l.released) out.push({ mod, key, action: l.released ? 'Funded' : 'Unfunded', label: lineLabel(l), detail: l.released ? 'Marked funded ✓' : 'Funded mark removed' });
          if(!!o.cancelled !== !!l.cancelled) out.push({ mod, key, action: l.cancelled ? 'Not needed' : 'Restored', label: lineLabel(l), detail: l.cancelled ? 'Marked not needed' : 'Back on the list' });
        });
      } else {
        const used = new Set();
        lb.forEach(l=>{ const i = la.findIndex((o,j)=>!used.has(j) && sig(o)===sig(l)); if(i>=0) used.add(i); else out.push({ mod, key, action:'Added', label: lineLabel(l), detail:'' }); });
        la.forEach((o,j)=>{ if(!used.has(j)) out.push({ mod, key, action:'Removed', label: lineLabel(o), detail:'' }); });
      }
    });
  }
  return out;
}

/* ============================= BANK BALANCE LOCKS =============================
   Once a bank account's day is balanced (the Actual Balance from the bank
   matches the Ending Balance), Danna can lock it. A lock covers that day and
   every earlier day of the same account: entries there can't be added,
   edited or deleted — from any screen — until the day is unlocked again
   (with a reason, which goes to the Audit Trail). */
const CASHBANK_DEFAULT_ACCT = { bticket_cashbank:'Unionbank - Betrnk Tours', daimasu_cashbank:'Unionbank - Betrnk Tours (Daimasu)', midori_cashbank:'Unionbank - Midori No Mart' };
const LOCK_SIG_FIELDS = {
  bank_balances: ['date','account','description','cashIn','cashOut','openingOverride'],
  bticket_cashbank: ['date','account','notes','cashIn','cashOut','opening'],
  daimasu_cashbank: ['date','account','notes','cashIn','cashOut','opening'],
  midori_cashbank: ['date','account','notes','cashIn','cashOut','opening'],
};
function readBankLocks(){ try{ return JSON.parse(localStorage.getItem(STORAGE_PREFIX+'obj:bank_locks') || '{}') || {}; }catch(e){ return {}; } }
function bankLockedThrough(locks, acct){
  let max = '';
  Object.keys(locks||{}).forEach(k=>{ const i = k.lastIndexOf('||'); if(k.slice(0,i)===acct && k.slice(i+2)>max) max = k.slice(i+2); });
  return max;
}
function isBankDayLocked(locks, acct, date){ const t = bankLockedThrough(locks, acct); return !!(t && date && date<=t); }
function lockAcctFor(key, row){
  if(key==='bank_balances') return row.account;
  if(row.account && BANK_ACCOUNT_TO_CASHBANK[row.account]===key) return row.account;
  return CASHBANK_DEFAULT_ACCT[key];
}
let _lockAlertPending = false;
function bankLockGuard(key, oldRows, newRows){
  const sig = LOCK_SIG_FIELDS[key];
  if(!sig) return newRows;
  const locks = readBankLocks();
  if(!Object.keys(locks).length) return newRows;
  const prot = r=> isBankDayLocked(locks, lockAcctFor(key, r), r.date);
  const val = v=> (v===undefined || v===null) ? '' : String(v).trim();
  const same = (a,b)=> sig.every(f=> val(a[f])===val(b[f]));
  const oldById = new Map(oldRows.map(r=>[r.id, r]));
  const newIds = new Set(newRows.map(r=>r.id));
  const blocked = []; const out = [];
  newRows.forEach(r=>{
    const o = oldById.get(r.id);
    if(!o){ if(prot(r)){ blocked.push(r); return; } out.push(r); return; }
    if((prot(o) || prot(r)) && !same(o, r)){ blocked.push(o); out.push(o); return; }
    out.push(r);
  });
  oldRows.forEach(o=>{ if(!newIds.has(o.id) && prot(o)){ blocked.push(o); out.push(o); } });
  if(!blocked.length) return newRows;
  state.cache[key] = out;
  if(!_lockAlertPending){
    _lockAlertPending = true;
    const b = blocked[0];
    setTimeout(()=>{
      _lockAlertPending = false;
      alert(`🔒 Not saved — ${lockAcctFor(key,b)} is balanced and locked through ${monthDisplay(bankLockedThrough(locks, lockAcctFor(key,b)))}.\n\nEntries on or before that date can't be added, changed or deleted. If you really need to change it, open Bank Balances, go to that date and click "Unlock".`);
      render();
    }, 30);
  }
  return out;
}

/* ===================== AUTO-BACKUP TO FILE (Chrome / Edge) =====================
   Danna picks a backup file once per session; after that every save on this
   device is also written to that file automatically (1.5s after the last
   change), so the .json on her computer is always up to date. */
let _abHandle = null, _abTimer = null, _abBusy = false, _abPending = false;
let _abText = 'Auto-backup is OFF';
function autoBackupSupported(){ return typeof window.showSaveFilePicker === 'function'; }
function abStatus(txt){ _abText = txt; const e = document.getElementById('autoBackupStatus'); if(e) e.textContent = txt; }
function abIdb(){ return new Promise((res,rej)=>{ const r = indexedDB.open('acct_dash_autobackup',1); r.onupgradeneeded = ()=> r.result.createObjectStore('h'); r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error); }); }
async function abSaveHandle(h){ try{ const db = await abIdb(); await new Promise((res,rej)=>{ const tx = db.transaction('h','readwrite'); tx.objectStore('h').put(h,'file'); tx.oncomplete = res; tx.onerror = ()=> rej(tx.error); }); }catch(e){} }
async function abLoadHandle(){ try{ const db = await abIdb(); return await new Promise(res=>{ const tx = db.transaction('h','readonly'); const g = tx.objectStore('h').get('file'); g.onsuccess = ()=> res(g.result||null); g.onerror = ()=> res(null); }); }catch(e){ return null; } }
async function autoBackupWriteNow(){
  if(!_abHandle) return;
  if(_abBusy){ _abPending = true; return; }
  _abBusy = true;
  try{
    const w = await _abHandle.createWritable(); await w.write(buildBackupJSON()); await w.close();
    abStatus('🟢 Auto-backup ON · saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' → ' + _abHandle.name);
    try{ localStorage.setItem(STORAGE_PREFIX+'meta:lastBackupAt', String(Date.now())); }catch(e){}
  }catch(e){ console.error('auto-backup', e); _abHandle = null; abStatus('⚠️ Auto-backup stopped — click "Turn on auto-backup" again'); }
  _abBusy = false;
  if(_abPending){ _abPending = false; autoBackupWriteNow(); }
}
function autoBackupSchedule(){ if(!_abHandle) return; clearTimeout(_abTimer); _abTimer = setTimeout(autoBackupWriteNow, 1500); }
async function autoBackupTurnOn(){
  if(!autoBackupSupported()){ alert('Auto-backup works in Google Chrome or Microsoft Edge. In this browser, please keep using 💾 Save backup to file.'); return; }
  const saved = await abLoadHandle();
  if(saved){
    try{ const perm = await saved.requestPermission({mode:'readwrite'}); if(perm==='granted'){ _abHandle = saved; await autoBackupWriteNow(); return; } }catch(e){}
  }
  try{
    const h = await window.showSaveFilePicker({ suggestedName:'Accounting_Dashboard_AutoBackup.json', types:[{description:'Dashboard backup', accept:{'application/json':['.json']}}] });
    _abHandle = h; await abSaveHandle(h); await autoBackupWriteNow();
  }catch(e){ if(!e || e.name!=='AbortError') alert('Could not turn on auto-backup: ' + (e && e.message ? e.message : e)); }
}
async function autoBackupInit(){
  if(!autoBackupSupported()) return;
  const saved = await abLoadHandle(); if(!saved) return;
  try{ const perm = await saved.queryPermission({mode:'readwrite'}); if(perm==='granted'){ _abHandle = saved; abStatus('🟢 Auto-backup ON → ' + saved.name); return; } }catch(e){}
  abStatus('⏸ Click "Turn on auto-backup" to keep saving to ' + saved.name);
}

/* ---- Build the full backup as a JSON string ---- */
function buildBackupJSON(){
  const backup = { exportedAt: new Date().toISOString(), ledger:{}, obj:{} };
  LEDGER_KEYS.forEach(k=>{
    const raw = localStorage.getItem(STORAGE_PREFIX+'ledger:'+k);
    if(raw) backup.ledger[k] = JSON.parse(raw);
  });
  OBJ_KEYS.forEach(k=>{
    const raw = localStorage.getItem(STORAGE_PREFIX+'obj:'+k);
    if(raw) backup.obj[k] = JSON.parse(raw);
  });
  return JSON.stringify(backup, null, 2);
}

/* Office Dues: older category names that mean the same thing are folded
   into the dropdown's names, so each shows up as one group. */
const OFFICE_DUES_CATEGORY_MERGE = { 'Rent Expense':'Rental Payments', 'Utilities Expense':'Utility Bills' };
/* One-time clean-ups for Office Dues, run when the data is loaded:
   - folds old category names into one (Rent Expense -> Rental Payments, ...)
   - joins Jaisun Lee's renewed condo lease into the original Bayshore row
   - links each due to its Bank Directory entry when the account number in
     the remarks matches */
async function odMigrate(rows){
  let changed = false;
  rows = rows.map(r=>{
    if(OFFICE_DUES_CATEGORY_MERGE[r.category]){ changed = true; return { ...r, category: OFFICE_DUES_CATEGORY_MERGE[r.category] }; }
    return r;
  });
  const bi = rows.findIndex(r=>r.id==='mwu0lkiz30u33');
  const ni = rows.findIndex(r=>r.id==='jason_lease_2627');
  if(bi>-1 && ni>-1){
    const base = rows[bi], renew = rows[ni];
    const renewLog = (renew.monthlyLog||[]).map(x=>({...x}));
    const renewMonths = renewLog.map(x=>x.month);
    const oldLog = (base.monthlyLog||[]).map(x=>({...x}));
    const octPlaceholder = oldLog.find(x=>x.month==='2026-10');
    const kept = oldLog.filter(x=> x.month < '2026-10' && !renewMonths.includes(x.month));
    const nov = renewLog.find(x=>x.month==='2026-11');
    if(nov && !nov.status && octPlaceholder && octPlaceholder.status) nov.status = octPlaceholder.status;
    rows[bi] = { ...base,
      detail: 'Bayshore Staff House – Condo Rent incl. Association Dues',
      frequency: 'Every 2 months', dueDay: renew.dueDay||'15', amount: renew.amount||'70000',
      remarks: 'PDC Checks (every 2 months) – to be deposited to UB Tours for funding',
      coverage: '', coverageStartDay: renew.coverageStartDay||'15',
      contractStart: renew.contractStart||'', contractEnd: renew.contractEnd||'',
      monthlyLog: [...kept, ...renewLog].sort((a,b)=>(a.month||'').localeCompare(b.month||''))
    };
    rows.splice(ni, 1);
    changed = true;
  }
  if(rows.some(r=>!r.bankDirId && !r._bankAutoChecked)){
    let dir = [];
    try{ dir = (state.cache.bank_directory) || (await loadRows('bank_directory')) || []; }catch(e){ dir = []; }
    const dig = v=> String(v||'').replace(/\D/g,'');
    rows = rows.map(r=>{
      if(r.bankDirId || r._bankAutoChecked) return r;
      const rd = dig(r.remarks);
      const hit = rd ? dir.find(b=>{ const a = dig(b.pbAccountNo); return a.length>=6 && rd.includes(a); }) : null;
      changed = true;
      return hit ? { ...r, bankDirId: hit.id, _bankAutoChecked: true } : { ...r, _bankAutoChecked: true };
    });
  }
  return { rows, changed };
}

function sortedByDate(rows, dateField){
  return [...rows].sort((a,b)=> (a[dateField]||'').localeCompare(b[dateField]||'') || (a._seq||0)-(b._seq||0));
}

/* ===== Daimasu: expenses in the cashier report that were paid by Accounting =====
   The cashiers list every expense in Food / Beverage / Other, including supplier
   bills that Accounting paid by bank. Only the Reported Cash Disbursement left the
   cashbox, so anything above it was paid by Accounting. The dashboard looks for
   those payments in Daimasu's bank outflows (same date, ±2 days) and shows a tick
   when they are found. Nothing here changes the float, the weekly cashbox expense
   (which already uses the reported cash disbursement) or the Expenses tab. */
function dmPaidByAccounting(r){
  const has = !(r.reportedCashDisbursement==='' || r.reportedCashDisbursement===undefined || r.reportedCashDisbursement===null);
  if(!has) return 0;
  const d = Math.round((num(r.foodExpenses)+num(r.beverageExpenses)+num(r.otherExpenses) - num(r.reportedCashDisbursement))*100)/100;
  return d >= 1 ? d : 0;
}
function dmBankMatch(dateISO, target){
  const bank = (state.cache && state.cache.daimasu_cashbank) || null;
  if(!bank) return 'NOBANK';
  const lo = dmShiftISO(dateISO,-2), hi = dmShiftISO(dateISO,2);
  const cands = bank.filter(b=> b.date>=lo && b.date<=hi && num(b.cashOut)>0)
    .map(b=>({amt: Math.round(num(b.cashOut)*100), note: (b.notes||'').trim()}))
    .slice(0,20);
  const T = Math.round(target*100);
  /* exact single payment first */
  const one = cands.find(c=> Math.abs(c.amt-T)<=100);
  if(one) return 'OK:'+one.note;
  /* then the smallest combination of payments that adds up (within ₱1) */
  const n = cands.length;
  let best = null;
  for(let mask=1; mask<(1<<n); mask++){
    let sum=0, cnt=0;
    for(let k=0;k<n;k++) if(mask&(1<<k)){ sum+=cands[k].amt; cnt++; if(sum>T+100) break; }
    if(Math.abs(sum-T)<=100 && (!best || cnt<best.cnt)) best={mask,cnt};
  }
  if(best){
    const names=[]; for(let k=0;k<n;k++) if(best.mask&(1<<k)) names.push(cands[k].note+' ₱'+money(cands[k].amt/100));
    return 'OK:'+names.join(' + ');
  }
  return 'NONE';
}
function withComputed(mod, rows){
  let list = rows.map(r=>({...r}));
  if(mod.kind === 'sequential-balance'){
    list = sortedByDate(list, 'date');
    /* ---- Manual exclusion for cash advances already reflected in a fund's
       Beginning Balance ----
       This is a per-row decision (the "Exclude from Balance" field), not an
       automatic one: comparing Original CA Date to the fund's opening date
       looked appealing, but it silently assumed every row had always
       belonged to this fund's own history. That broke the moment a voucher
       got reclassified into a different fund's table (its cash could still
       be missing from the fund it's now filed under, even though it
       predates that fund's opening balance). Only Danna can confirm which
       is actually true for a given voucher, so this stays manual. ---- */
    let bal = 0;
    list = list.map(r=>{
      const extra = mod.compute ? mod.compute(r) : {};
      const isExcluded = !!(r.excludeFromBalance && String(r.excludeFromBalance).trim()!=='');
      const effIn = isExcluded ? 0 : num(r.cashIn);
      const effOut = isExcluded ? 0 : num(r.cashOut);
      if(mod.balanceKey === 'closing'){
        bal = num(r.opening) + effIn - effOut;
      } else {
        bal = bal + effIn - effOut;
      }
      return {...r, ...extra, [mod.balanceKey]: bal, _autoReversed: isExcluded};
    });
  } else if(mod.kind === 'grouped-diff'){
    list = sortedByDate(list, 'date');
    const lastByGroup = {};
    list = list.map(r=>{
      const g = r[mod.groupKey];
      const raw = r[mod.valueKey];
      const hasVal = !(raw==='' || raw===undefined || raw===null);
      if(!hasVal) return {...r, change:''};
      const val = num(raw);
      const prev = lastByGroup[g];
      const change = (prev!==undefined) ? (val - prev) : '';
      lastByGroup[g] = val;
      return {...r, change};
    });
  } else if(mod.kind === 'grouped-balance'){
    list = sortedByDate(list, 'date');
    const lastByGroup = {};
    list = list.map(r=>{
      const g = r[mod.groupKey];
      const extra = mod.compute ? mod.compute(r) : {};
      const base = (r.openingOverride!==undefined && r.openingOverride!==''&&r.openingOverride!==null)
        ? num(r.openingOverride)
        : (lastByGroup[g]!==undefined ? lastByGroup[g] : 0);
      const bal = base + num(r.cashIn) - num(r.cashOut);
      lastByGroup[g] = bal;
      return {...r, ...extra, beginning: base, [mod.balanceKey]: bal};
    });
  } else if(mod.kind === 'sequential-carry'){
    list = sortedByDate(list, 'date');
    let bal = 0;
    const ovrKey = mod.overrideKey || 'opening';
    list = list.map(r=>{
      const ovr = r[ovrKey];
      const base = (ovr!==undefined && ovr!==''&&ovr!==null) ? num(ovr) : bal;
      bal = base + num(r.cashIn) - num(r.cashOut);
      return {...r, beginning: base, [mod.balanceKey]: bal};
    });
  } else if(mod.compute){
    list = list.map(r=>({...r, ...mod.compute(r)}));
  }
  if(mod.key === 'midori_sales'){
    list = sortedByDate(list, 'date');
    let running = 0;
    list = list.map(r=>{
      const override = r.cashCarryover;
      const hasOverride = !(override==='' || override===undefined || override===null);
      const base = hasOverride ? num(override) : running;
      // Cash actually on hand before today's deposit, net of today's expense
      const preDeposit = base + num(r.cashSales) - num(r.otherExpense);
      const hasDeposit = !(r.actualDeposit==='' || r.actualDeposit===undefined || r.actualDeposit===null) && num(r.actualDeposit) !== 0;
      const ending = preDeposit - num(r.actualDeposit);
      running = ending;
      // Only reconcile on the day a deposit is actually made (weekly, e.g. Mondays):
      // the full accumulated float (net of expenses) should match what was deposited.
      // A deposit marked "partial" in Remarks keeps the rest on hand on purpose,
      // so it is shown as PARTIAL instead of a mismatch.
      const isPartial = /partial/i.test(r.remarks||'');
      const floatCheck = hasDeposit ? ((Math.abs(preDeposit-num(r.actualDeposit))<=1.00) ? 'OK' : (isPartial ? 'PARTIAL' : 'CHECK')) : '';
      return {...r, cashCarryover: base, endingUndeposited: ending, floatCheck};
    });
  }
  if(mod.key === 'daimasu_sales'){
    list = sortedByDate(list, 'date');
    let running = 0;
    let prevReported = null;
    list = list.map(r=>{
      const override = r.beginningFloat;
      const hasOverride = !(override==='' || override===undefined || override===null);
      const base = hasOverride ? num(override) : (prevReported!==null ? prevReported : running);
      const totalCashSale = num(r.cashSale)+num(r.barCashSale);
      const hasNewDisbursement = !(r.reportedCashDisbursement==='' || r.reportedCashDisbursement===undefined || r.reportedCashDisbursement===null);
      const hasSetAside = !(r.setAsideForDeposit==='' || r.setAsideForDeposit===undefined || r.setAsideForDeposit===null);
      const disbursementUsed = hasNewDisbursement ? num(r.reportedCashDisbursement) : (num(r.foodExpenses)+num(r.beverageExpenses)+num(r.otherExpenses));
      const setAsideUsed = hasSetAside ? num(r.setAsideForDeposit) : 0;
      const ending = base + totalCashSale - disbursementUsed - setAsideUsed + num(r.pettyCashReplenishment);
      running = ending;
      const hasReportedThisRow = !(r.reportedCashboxFloat==='' || r.reportedCashboxFloat===undefined || r.reportedCashboxFloat===null);
      prevReported = hasReportedThisRow ? num(r.reportedCashboxFloat) : ending;
      const hasReported = !(r.reportedCashboxFloat==='' || r.reportedCashboxFloat===undefined || r.reportedCashboxFloat===null);
      /* Cashiers round the float to whole pesos ("no centavo"), so allow up to ₱2.00. */
      const floatCheck = hasReported ? ((Math.abs(ending-num(r.reportedCashboxFloat))<=2.00) ? 'OK' : 'CHECK') : '';
      const pba = dmPaidByAccounting(r);
      return {...r, beginningFloat: base, computedCashboxFloat: ending, floatCheck, paidByAccounting: pba ? pba : '', bankMatch: pba ? dmBankMatch(r.date, pba) : ''};
    });
  }
  return list;
}

/* ============================= RENDER HELPERS ============================= */
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return e;
}

function formatCell(colKey, value){
  if(value===undefined||value===null||value==='') return '';
  if(typeof value==='string' && value.startsWith('data:image')){
    const link = document.createElement('a');
    link.href = value; link.target = '_blank'; link.textContent = '🖼️ View image';
    link.style.fontSize = '12px';
    return link;
  }
  if(colKey==='match'){
    if(value==='MATCH') return tagEl('MATCH','ok');
    if(value==='MISMATCH') return tagEl('MISMATCH','danger');
    return '';
  }
  if(colKey==='bankMatch'){
    if(String(value).startsWith('OK:')){ const t = tagEl('✓ Found','ok'); t.title = 'Paid by Accounting: '+String(value).slice(3); return t; }
    if(value==='NONE'){ const t = tagEl('⚠ Not yet in bank','warn'); t.title = 'No Daimasu bank payment (±2 days) adds up to this amount yet. Record the payment in Daimasu bank and this turns to ✓.'; return t; }
    return '';
  }
  if(colKey==='check' || colKey==='floatCheck'){
    if(value==='OK') return tagEl('OK','ok');
    if(value==='CHECK') return tagEl('CHECK','warn');
    if(value==='PARTIAL') return tagEl('PARTIAL','neutral');
    if(String(value||'').startsWith('EXP:')){ const d = num(String(value).slice(4)); const t = tagEl(`EXPENSES ${d>0?'+':'−'}₱${money(Math.abs(d))}`,'danger'); t.title = 'Food + Beverage + Other expenses do not add up to the reported cash disbursement. Cash paid by Accounting should go under Supplier Payments.'; return t; }
    return '';
  }
  if(colKey==='change'){
    if(value===''||value===undefined||value===null) return '';
    const v = num(value);
    const cls = v>0 ? 'danger' : (v<0 ? 'ok' : 'neutral');
    const sign = v>0 ? '+' : '';
    return tagEl(sign+money(v), cls);
  }
  if(colKey==='status'){
    const cls = value==='Flagged' ? 'danger' : (value==='Verified'||value==='Released'||value==='Liquidated'||value==='Proceed') ? 'ok' : (value==='Pending'||value==='Partially Liquidated') ? 'warn' : 'neutral';
    return tagEl(value, cls);
  }
  if(NUMERIC_COLS.has(colKey)) return money(value);
  return value;
}
function tagEl(text, cls){
  const s = document.createElement('span');
  s.className = 'tag '+cls;
  s.textContent = text;
  return s;
}

/* ============================= GENERIC MODULE VIEW ============================= */
/* ===== Office Dues: monthly table view =====
   One row per due, one column per month, grouped by category with
   subtotals. Click a cell to update that month. Uses the same monthlyLog
   data as the list view, so nothing is converted or lost. */
const OD_SHORT = {
  'Paid':'Paid','Covered by advance':'Advance','Not yet due':'Upcoming','Overdue':'Overdue',
  'For funding / Pending':'For funding','Funded (awaiting release)':'Funded',
  'No payment / Breached':'Breached','End of contract':'Ended','Skip':'Skip'
};
const OD_NOT_COUNTED = ['Skip','End of contract','Covered by advance'];
function odThisYm(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); }
function odMonthDiff(a, b){ const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); }
/* What one due looks like in one month. Returns null when nothing is
   scheduled or recorded for that month. */
function odCellInfo(row, ym){
  const entry = officeDuesEntryFor(row, ym);
  const amtOf = e => (e && e.billAmount!==undefined && e.billAmount!=='') ? num(e.billAmount) : num(row.amount);
  const today = new Date(); today.setHours(0,0,0,0);
  const due = officeDuesDueDate(ym, row.dueDay);
  if(entry){
    let st = entry.status||'';
    if(row.frequency!=='One-time' && (st==='' || st==='Not yet due')) st = (due && today>due) ? 'Overdue' : 'Not yet due';
    if(!st) st = 'Not yet due';
    const paidAmt = (entry.amountPaid!==undefined && entry.amountPaid!=='') ? num(entry.amountPaid) : amtOf(entry);
    return { status:st, amount: st==='Paid' ? paidAmt : amtOf(entry), entry, due };
  }
  if(row.frequency==='One-time') return null;
  const log = (Array.isArray(row.monthlyLog)?row.monthlyLog:[]).filter(x=>x.month).map(x=>x.month).sort();
  const step = officeDuesInterval(row);
  const cur = officeDuesCurrentPeriod(row).month;
  const anchor = log.length ? log[0] : ((row.contractStart && row.contractStart.slice(0,7)) || cur);
  if(step>1 && ((odMonthDiff(anchor, ym) % step)+step) % step !== 0) return null;
  if(row.contractStart && ym < row.contractStart.slice(0,7)) return null;
  if(officeDuesPastContract(row, ym)) return null;
  if(officeDuesIsAdvanceMonth(row, ym)) return { status:'Covered by advance', amount:num(row.amount), entry:null, due };
  if(ym < cur) return null; // earlier months with nothing recorded
  return { status: (due && today>due) ? 'Overdue' : 'Not yet due', amount:num(row.amount), entry:null, due };
}
function odSaveEntry(mod, rowId, ym, patch, remove){
  return (async ()=>{
    const rows = await getModuleData(mod);
    const idx = rows.findIndex(x=>x.id===rowId);
    if(idx<0) return;
    const r = rows[idx];
    let log = Array.isArray(r.monthlyLog) ? r.monthlyLog.map(x=>({...x})) : [];
    if(remove){ log = log.filter(x=>x.month!==ym); }
    else {
      let e = log.find(x=>x.month===ym);
      if(!e){ e = { id:uid(), month:ym, billAmount:'', amountPaid:'', datePaid:'', status:'', notes:'' }; log.push(e); }
      Object.assign(e, patch);
      if(e.status==='Paid'){
        if(!e.datePaid) e.datePaid = todayISO();
        if(e.amountPaid===''||e.amountPaid===undefined) e.amountPaid = (e.billAmount!==undefined && e.billAmount!=='') ? e.billAmount : (r.amount||'');
      }
    }
    rows[idx] = { ...r, monthlyLog: log };
    state.cache[mod.key] = rows;
    await saveRows(mod.key, rows);
    render();
  })();
}

  document.body.appendChild(overlay);
  setTimeout(()=> stSel.focus(), 0);

/* ===== Office Dues <-> Bank Directory =====
   Bank details live in the Bank Directory only; a due just points to its
   entry (bankDirId). Editing them from Office Dues updates the Bank
   Directory too, so both places always show the same account. */
function odBankFor(row, dir){
  if(!row || !row.bankDirId) return null;
  return (dir||[]).find(b=>b.id===row.bankDirId) || null;
}
function odBankBlock(mod, row, leave){

/* ===== Labor Cost: import a payroll register (.xlsx) =====
   Reads the "2. Summary" sheet of the BGC / Daimasu / Midori payroll
   files and fills the Actual Pay for one cutoff. Actual pay = Gross
   Compensation + Other Incentive / Adjustments + Others (when added to
   pay). Declared gross and employer shares are not touched. */
const LC_NAME_ALIASES = { 'kento fuji':'kento sincho', 'eisuke maemura':'eisuke arnold maemura' };
let _xlsxLoading = null;
function lcLoadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=> res(window.XLSX);
    sc.onerror = ()=>{ _xlsxLoading = null; rej(new Error('Could not load the Excel reader. Please check your internet connection.')); };
    document.head.appendChild(sc);
  });
  return _xlsxLoading;
}
function lcNormName(n){
  let s = String(n||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
  if(LC_NAME_ALIASES[s]) s = LC_NAME_ALIASES[s];
  return s.split(' ').filter(t=>t.length>1 && !['jr','sr','ma'].includes(t));
}
function lcSameName(a, b){
  const x = lcNormName(a), y = lcNormName(b);
  if(!x.length || !y.length) return false;
  if(x[0]===y[0] && x[x.length-1]===y[y.length-1]) return true;
  return x[x.length-1]===y[y.length-1] && x[0].slice(0,3)===y[0].slice(0,3);
}
const LC_MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
function lcParseRegister(XLSX, buf){
  const wb = XLSX.read(buf, { type:'array', sheets:['2. Summary'], sheetRows:150 });
  const ws = wb.Sheets['2. Summary'];
  if(!ws) throw new Error('This file has no "2. Summary" sheet. Please upload the payroll register file.');
  const grid = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
  const txt = v => String(v==null?'':v).trim();
  let company = '', period = '';
  grid.slice(0,10).forEach(r=>{
    (r||[]).forEach((v,i)=>{
      const t = txt(v);
      if(/period covered/i.test(t)) period = txt(r[i+1]) || txt(r[i+2]);
      if(!company && /(betrnk|daimasu|midori)/i.test(t)) company = t;
    });
  });
  const hIdx = grid.findIndex(r=> (r||[]).some(v=> txt(v).toLowerCase()==='full name'));
  if(hIdx<0) throw new Error('Could not find the "Full Name" header in the Summary sheet.');
  const h = grid[hIdx], h2 = grid[hIdx+1] || [];
  const find = (row, re)=> row.findIndex(v=> re.test(txt(v)));
  const cName = find(h, /^full name$/i), cGross = find(h, /gross compensation/i);
  const cOthers = find(h2, /^others$/i), cInc = find(h2, /(other incentive|adjustment)/i);
  if(cGross<0) throw new Error('Could not find the "Gross Compensation" column.');
  const rows = [];
  for(let i=hIdx+2; i<grid.length; i++){
    const r = grid[i] || [];
    if(r.some(v=> /^total$/i.test(txt(v)))) break;
    const name = txt(r[cName]);
    if(!name || typeof r[0]!=='number') continue;
    const gross = num(r[cGross]), others = cOthers>-1 ? num(r[cOthers]) : 0, inc = cInc>-1 ? num(r[cInc]) : 0;
    rows.push({ name, gross, extra: inc + (others>0 ? others : 0), amount: Math.round((gross + inc + (others>0?others:0))*100)/100 });
  }
  let month = '', cutoff = '';
  const m = period.toLowerCase().match(/([a-z]+)\s+(\d{1,2})\s*-\s*(\d{1,2}),?\s*(\d{4})/);
  if(m && LC_MONTHS.indexOf(m[1])>-1){
    month = m[4]+'-'+String(LC_MONTHS.indexOf(m[1])+1).padStart(2,'0');
    cutoff = parseInt(m[2],10) <= 15 ? '1' : '2';
  }
  let entities = [];
  if(/daimasu/i.test(company)) entities = ['Daimasu'];
  else if(/midori/i.test(company)) entities = ['Midori No Mart'];
  else if(/betrnk/i.test(company)) entities = ['Betrnk Tours','B-Ticket Inc.'];
  return { company, period, month, cutoff, entities, rows };
}
function lcImportCard(mod){
  const card = el('div',{class:'card', style:'background:#FFF7FB;'});
  card.appendChild(el('h3',{style:'margin-top:0;'}, '📥 Import Payroll Register'));
  card.appendChild(el('p',{class:'note', style:'margin:-4px 0 10px 0;'}, 'Upload the BGC, Daimasu or Midori payroll file (.xlsx). It reads the "2. Summary" sheet and fills the Actual Pay for that cutoff. You will see a preview before anything is saved. Needs internet the first time.'));
  const inp = el('input',{type:'file', accept:'.xlsx,.xls'});
  const status = el('div',{class:'note', style:'margin-top:8px;'});
  inp.addEventListener('change', async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    status.textContent = 'Reading file…';
    try{
      const XLSX = await lcLoadXlsx();
      const buf = await f.arrayBuffer();
      const parsed = lcParseRegister(XLSX, buf);
      status.textContent = '';
      await lcOpenPreview(mod, parsed, f.name);
    }catch(e){ status.textContent = '⚠️ '+(e.message||e); }
    inp.value = '';
  });
  card.appendChild(inp); card.appendChild(status);
  return card;
}
async function lcOpenPreview(mod, parsed, fileName){
  const old = document.getElementById('lcImpOverlay'); if(old) old.remove();
  const overlay = el('div',{class:'modal-overlay', id:'lcImpOverlay'});
  const box = el('div',{class:'modal-box', style:'max-width:860px;'});
  box.appendChild(el('h3',{}, '📥 '+fileName));
  box.appendChild(el('p',{}, `${parsed.company||'Company not found'} · ${parsed.period||'Period not found'} · ${parsed.rows.length} employees`));
  const ctr = el('div',{class:'od-controls'});
  const mInp = el('input',{type:'month'}); mInp.value = parsed.month || '';
  const cSel = el('select'); [['1','1st cutoff (1–15)'],['2','2nd cutoff (16–end)']].forEach(([v,l])=> cSel.appendChild(el('option',{value:v},l))); cSel.value = parsed.cutoff || '1';
  const eSel = el('select');
  [['Betrnk Tours|B-Ticket Inc.','BGC (Betrnk Tours + B-Ticket)'],['Daimasu','Daimasu'],['Midori No Mart','Midori No Mart']].forEach(([v,l])=> eSel.appendChild(el('option',{value:v},l)));
  eSel.value = (parsed.entities.join('|')) || 'Betrnk Tours|B-Ticket Inc.';
  ctr.appendChild(el('div',{},[el('label',{},'Month'), mInp]));
  ctr.appendChild(el('div',{},[el('label',{},'Cutoff'), cSel]));
  ctr.appendChild(el('div',{},[el('label',{},'Company'), eSel]));
  box.appendChild(ctr);
  const body = el('div');
  box.appendChild(body);
  const all = await getModuleData(mod);
  let plan = null;
  const build = ()=>{
    body.innerHTML = '';
    const month = mInp.value, key = cSel.value==='2' ? 'actual2' : 'actual1', ents = eSel.value.split('|');
    const pool = all.filter(r=> (r.payDate||'').slice(0,7)===month && ents.includes(r.entity));
    const used = new Set();
    const lines = parsed.rows.map(p=>{
      const hit = pool.find(r=> !used.has(r.id) && lcSameName(p.name, r.employeeName));
      if(hit) used.add(hit.id);
      return { p, hit, key, add:true, newEntity: ents[0] };
    });
    const missing = pool.filter(r=> !used.has(r.id));
    plan = { month, key, ents, lines, missing, zeroMissing:true };
    if(!month){ body.appendChild(el('p',{style:'color:#C0396B;'}, 'Please pick the month.')); return; }
    if(!pool.length) body.appendChild(el('p',{class:'note', style:'color:#9E2B55;'}, `No Labor Cost rows for ${ymLabel(month)} yet. Add the declared payroll first (from the mandatory monitoring), or import anyway and everyone will be added as new rows with actual pay only.`));
    const t = el('table');
    t.appendChild(el('thead',{}, el('tr',{}, ['','Payroll register','Matched to','Actual pay','Now',''].map(x=>el('th',{},x)))));
    const tb = el('tbody');
    let total = 0;
    lines.forEach(l=>{
      const tr = el('tr');
      const cb = el('input',{type:'checkbox'}); cb.checked = true; cb.addEventListener('change', ()=>{ l.add = cb.checked; });
      tr.appendChild(el('td',{}, cb));
      tr.appendChild(el('td',{style:'white-space:normal;'}, l.p.name));
      if(l.hit){
        tr.appendChild(el('td',{style:'white-space:normal;'}, `${l.hit.employeeName} (${l.hit.entity})`));
      } else {
        const s = el('select'); ents.forEach(e=> s.appendChild(el('option',{value:e}, e))); s.addEventListener('change', ()=>{ l.newEntity = s.value; });
        tr.appendChild(el('td',{style:'white-space:normal; color:#9E2B55;'}, [el('div',{}, '➕ New row (not in declared payroll)'), s]));
      }
      tr.appendChild(el('td',{style:'text-align:right;'}, '₱'+money(l.p.amount) + (l.p.extra ? '' : '')));
      const cur = l.hit && l.hit[key]!==undefined && l.hit[key]!=='' ? '₱'+money(l.hit[key]) : '—';
      tr.appendChild(el('td',{style:'text-align:right; color:var(--ink-soft);'}, cur));
      tr.appendChild(el('td',{style:'font-size:10.5px; color:var(--ink-soft);'}, l.p.extra ? 'incl. ₱'+money(l.p.extra)+' incentive/adj.' : ''));
      tb.appendChild(tr);
      total += l.p.amount;
    });
    t.appendChild(tb);
    body.appendChild(el('div',{class:'tablewrap', style:'max-height:46vh; overflow:auto;'}, t));
    body.appendChild(el('p',{style:'text-align:right; font-weight:700; margin:8px 0 0 0;'}, 'Total actual pay: ₱'+money(total)));
    if(missing.length){
      const cb = el('input',{type:'checkbox'}); cb.checked = true; cb.addEventListener('change', ()=>{ plan.zeroMissing = cb.checked; });
      body.appendChild(el('label',{style:'display:flex; gap:8px; align-items:flex-start; font-size:12px; margin-top:10px;'},[cb, el('span',{}, `Set ₱0 for ${missing.length} in Labor Cost but not in this register (e.g. resigned or on leave): ${missing.map(r=>r.employeeName).join(', ')}`)]));
    }
  };
  [mInp,cSel,eSel].forEach(x=> x.addEventListener('change', build));
  build();
  const close = ()=> overlay.remove();
  const actions = el('div',{class:'modal-actions'});
  const saveBtn = el('button',{class:'savebtn primary', style:'width:auto; padding:8px 16px;'}, '💾 Save to Labor Cost');
  saveBtn.addEventListener('click', async ()=>{
    if(!plan || !plan.month){ alert('Please pick the month.'); return; }
    const rows = (await getModuleData(mod)).map(r=>({...r}));
    const [y,mo] = plan.month.split('-').map(Number);
    const lastDay = plan.month+'-'+String(new Date(y, mo, 0).getDate()).padStart(2,'0');
    let seq = Date.now(), done = 0, added = 0;
    plan.lines.forEach(l=>{
      if(!l.add) return;
      if(l.hit){
        const i = rows.findIndex(r=>r.id===l.hit.id);
        if(i>-1){ rows[i][plan.key] = String(l.p.amount); done++; }
      } else {
        rows.push({ id:uid(), _seq:seq++, payDate:lastDay, entity:l.newEntity, employeeName:l.p.name, grossSalary:'0', [plan.key]:String(l.p.amount), sssEr:'0', philhealthEr:'0', pagibigEr:'0', ec:'0', notes:'Not in declared payroll — actual pay only' });
        added++;
      }
    });
    if(plan.zeroMissing) plan.missing.forEach(m=>{ const i = rows.findIndex(r=>r.id===m.id); if(i>-1 && (rows[i][plan.key]===undefined || rows[i][plan.key]==='')) rows[i][plan.key] = '0'; });
    state.cache[mod.key] = rows;

const MC_TYPES = [

function mcTypeOf(m){
  if(m.contributionType==='Loans') return /pag/i.test(m.notes||'') ? 'Pag-IBIG Loans' : 'SSS Loans';
  return m.contributionType;
}
function mcIsPaid(m){ if(!m) return false; if(m.funded && m.paid!==true) return false; if(m.paid===true) return true; if(m.paid===false) return false; return !!(m.datePaid || num(m.payment)>0); }
function mcIsFunded(m){ return !!(m && m.funded && !mcIsPaid(m)); }
function mcDueDate(ym, day){
  const nx = ymShift(ym, 1); const [y,mo] = nx.split('-').map(Number);
  const last = new Date(y, mo, 0).getDate();
  return new Date(y, mo-1, Math.min(day, last));
}
async function mcSave(mod, rec){

/* ===== Labor Cost: import the mandatory monitoring (.xlsx) =====
   Reads one month's block from the BETRNK TOURS (rows tagged DAIMASU go
   to Daimasu), B-TICKET and MIDORI sheets. Adds or updates the declared
   payroll rows; Actual Pay already typed in is kept. */
function mmMonthOf(v){
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0');
  const m = String(v||'').trim().toLowerCase().match(/^([a-z]+)\s+(\d{4})$/);
  if(m && LC_MONTHS.indexOf(m[1])>-1) return m[2]+'-'+String(LC_MONTHS.indexOf(m[1])+1).padStart(2,'0');
  return '';
}
function mmParse(XLSX, buf, ym){
  const wb = XLSX.read(buf, { type:'array', cellDates:true });
  const want = [['BETRNK TOURS','Betrnk Tours',true],['B-TICKET','B-Ticket Inc.',false],['MIDORI','Midori No Mart',false]];
  const out = [], notes = [];
  want.forEach(([sn, ent, hasFlag])=>{
    const name = wb.SheetNames.find(n=> n.trim().toUpperCase()===sn);
    if(!name){ notes.push(`Sheet "${sn}" not found`); return; }
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:null, raw:true });
    const hi = grid.findIndex(r=> r && String(r[1]||'').trim().toLowerCase()==='employee name' && mmMonthOf(r[0])===ym);
    if(hi<0){ notes.push(`${sn}: no ${ymLabel(ym)} block`); return; }
    const h = grid[hi].map(v=>String(v||'').trim());
    if(!/^PHIC/i.test(h[5]) || !/^HDMF/i.test(h[6]) || !/SSS ER/i.test(h[18])){ notes.push(`${sn}: columns look different, skipped`); return; }
    for(let i=hi+1; i<grid.length; i++){
      const r = grid[i] || [];
      if(/^total/i.test(String(r[0]||'').trim())) break;
      if(!r[1]) { if(out.length && i>hi+2) break; else continue; }
      if(typeof r[2]!=='number') continue;
      const e = hasFlag && String(r[13]||'').trim().toUpperCase()==='DAIMASU' ? 'Daimasu' : ent;
      const n = v=> num(v);
      out.push({ entity:e, employeeName:String(r[1]).trim(), grossSalary:n(r[2]), sssEr:n(r[18]), philhealthEr:n(r[5]), pagibigEr:n(r[6]), ec:n(r[17]),
        sssEe:n(r[16]), philhealthEe:Math.round((n(r[14])-n(r[5]))*100)/100, pagibigEe:Math.round((n(r[15])-n(r[6]))*100)/100, sssLoan:n(r[7]), pagibigLoan:n(r[8]), wtax:n(r[11]) });
    }
  });
  return { rows: out, notes };
}

      if(hit){ const i = rows.findIndex(r=>r.id===hit.id); if(i>-1){ rows[i] = { ...rows[i], ...vals }; upd++; } }
      else { rows.push({ id:uid(), _seq:seq++, payDate:lastDay, entity:p.entity, employeeName:p.employeeName, ...vals, notes: ymLabel(ym)+' declared payroll' }); add++; }
    });

function ccMdyToIso(s){ const [m,d,y] = s.split('/').map(Number); return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function ccAmt(s){ return Math.round(parseFloat(String(s).replace(/,/g,''))*100)/100; }
function ccParseSoa(text){

  const prev = (t.match(/Previous Balance\s+([\d,]+\.\d{2})\s*(DB|CR)?/i)||[]);
  const close = (t.match(/Closing Balance\s+([\d,]+\.\d{2})\s*(DB|CR)?/i)||[]);
  const re = /(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+(.+?)\s+(?:([A-Z]{3})\s*([\d,]+(?:\.\d+)?)\s+)?([\d,]+\.\d{2})\s*(DB|CR)/g;
  const lines = []; let m;

    lines.push({ postDate: ccMdyToIso(m[1]), transDate: ccMdyToIso(m[2]), desc: m[3].trim(), foreign: m[4] ? m[4]+' '+m[5] : '', amount: ccAmt(m[6]), type: m[7].toUpperCase() });

let _pdfjsLoading = null;
function ccLoadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjsLoading) return _pdfjsLoading;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  _pdfjsLoading = new Promise((res, rej)=>{
    const sc = document.createElement('script'); sc.src = base+'pdf.min.js';
    sc.onload = ()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+'pdf.worker.min.js'; }catch(e){} res(window.pdfjsLib); };
    sc.onerror = ()=>{ _pdfjsLoading = null; rej(new Error('Could not load the PDF reader. Please check your internet connection.')); };
    document.head.appendChild(sc);
  });
  return _pdfjsLoading;
}
/* Rebuild the page's text line by line (items on the same height joined
   left to right), so each SOA row reads like the table does. */
async function ccPdfText(file){
  const pdfjsLib = await ccLoadPdfjs();
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  for(let pn=1; pn<=doc.numPages; pn++){
    const page = await doc.getPage(pn);
    const tc = await page.getTextContent();
    const lines = [];
    tc.items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let ln = lines.find(l=> Math.abs(l.y - y) < 3);
      if(!ln){ ln = { y, items: [] }; lines.push(ln); }
      ln.items.push({ x, s: it.str });
    });
    lines.sort((a,b)=> b.y - a.y).forEach(l=> out.push(l.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')));
  }
  return out.join('\n');
}

/* ===== Daily sales report paste (Midori / Daimasu) =====
   Paste the store's daily Telegram report; the entry fills in and the
   report is checked against itself and against the dashboard. */
function dsFirstNum(s){ const m = String(s||'').replace(/[₱,]/g,'').match(/-?\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; }
function dsLines(text){ return String(text||'').split(/\r?\n/).map(s=>s.replace(/^[\s+\-−–•⭐️✨]+/,'').trim()).filter(Boolean); }
function dsVal(lines, re, from){ for(let i=(from||0); i<lines.length; i++){ const m = lines[i].match(re); if(m) return dsFirstNum(m[1]); } return null; }
function dsTxt(lines, re){ for(const l of lines){ const m = l.match(re); if(m) return m[1].trim(); } return ''; }
function dsDate(text){ const m = String(text).match(/DATE TODAY\s*:?\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i); if(!m) return ''; const y = m[3].length===2 ? '20'+m[3] : m[3]; return y+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0'); }
const r2 = v=> Math.round((v||0)*100)/100;
function dsCheck(label, a, b, note){ const ok = a!==null && b!==null && Math.abs(a-b)<0.01; return { ok, label, text: (a===null||b===null) ? `${label}: not in the report` : ok ? `${label}: ₱${money(a)} ✓` : `${label}: ₱${money(a)} vs ₱${money(b)} — diff ₱${money(r2(a-b))}${note?' ('+note+')':''}`, skip: a===null||b===null }; }
function dsParseMidori(text){
  const L = dsLines(text), date = dsDate(text);
  const f = {
    date, cashSales: dsVal(L,/^CASH SALES?\s*:\s*(.*)$/i), creditCard: dsVal(L,/^CREDIT\s*\/?\s*CARD SALES?\s*:\s*(.*)$/i), qrph: dsVal(L,/^QR\s*PH\s*:\s*(.*)$/i),
    maya: dsVal(L,/^MAYA\s*:\s*(.*)$/i), grab: dsVal(L,/^GRAB\s*:\s*(.*)$/i), foodPanda: dsVal(L,/^FOOD\s*PANDA\s*:\s*(.*)$/i),
    graveyard: dsVal(L,/^GRAVEYARD(?:\s*SHIFT)?\s*:\s*(.*)$/i), morning: dsVal(L,/^MORNING(?:\s*SHIFT)?\s*:\s*(.*)$/i), afternoon: dsVal(L,/^AFTERNOON(?:\s*SHIFT)?\s*:\s*(.*)$/i),
    beginningFloat: dsVal(L,/^CASH DRAWER\s*:\s*(.*)$/i), otherExpense: dsVal(L,/^OTHER EXPENSES?\s*:\s*(.*)$/i), reportedForDeposit: dsVal(L,/^FOR DEPOSIT\s*:\s*(.*)$/i),
    actualDeposit: dsVal(L,/^CASH DEPOSITED(?:\s*TODAY)?\s*:\s*(.*)$/i),
  };
  const info = { previous: dsVal(L,/^PREVIOUS SALES\s*:\s*(.*)$/i), monthly: dsVal(L,/MONTHLY SALES\s*:\s*(.*)$/i), total: dsVal(L,/^TOTAL\s*:\s*(.*)$/i), discounts: dsVal(L,/^DISCOUNTS?\s*:\s*(.*)$/i), staff: dsTxt(L,/This is\s+(.+?)\s+from/i) };
  const ci = L.findIndex(l=>/^category sales/i.test(l)); const cats = []; let catTotal = null;
  if(ci>-1){ for(let i=ci+1;i<L.length;i++){ const t = L[i].match(/^TOTAL\s*[-:]\s*(.*)$/i); if(t){ catTotal = dsFirstNum(t[1]); break; } const m = L[i].match(/^(.+?)\s*[-:]\s*₱?\s*([\d,]+(?:\.\d+)?)\s*$/); if(m) cats.push({ name:m[1].trim(), amount: dsFirstNum(m[2]) }); } }
  info.cats = cats; info.catTotal = catTotal;
  return { f, info };
}
async function dsMidoriChecks(mod, p){
  const f = p.f, i = p.info, out = [];
  const pay = r2(['cashSales','creditCard','qrph','maya','grab','foodPanda'].reduce((s,k)=>s+(f[k]||0),0));
  const shifts = r2(['graveyard','morning','afternoon'].reduce((s,k)=>s+(f[k]||0),0));
  out.push(dsCheck('Payment methods vs shifts', pay, shifts));
  if(i.catTotal!==null) out.push(dsCheck('Payment methods vs category total', pay, i.catTotal));
  if(i.cats.length) out.push(dsCheck('Categories add up to the category total', r2(i.cats.reduce((s,c)=>s+c.amount,0)), i.catTotal));
  if(i.total!==null) out.push(dsCheck('Reported TOTAL', i.total, pay));
  const gm = i.cats.filter(c=>/grab/i.test(c.name)).reduce((s,c)=>s+c.amount,0);
  if(gm && f.grab!==null) out.push(dsCheck('Grab vs GrabMart + GrabFood', f.grab, r2(gm)));
  const rows = withComputed(mod, (await getModuleData(mod)).filter(r=>r.date!==f.date));
  const before = sortedByDate(rows.filter(r=>r.date<f.date),'date');
  const prev = before[before.length-1];
  if(prev && i.previous!==null) out.push(dsCheck(`Previous sales vs ${prev.date} in dashboard`, i.previous, r2(prev.channelTotal)));
  if(i.monthly!==null){ const mtd = r2(before.filter(r=>r.date.slice(0,7)===f.date.slice(0,7)).reduce((s,r)=>s+num(r.channelTotal),0) + pay); out.push(dsCheck('Monthly sales vs dashboard', i.monthly, mtd, 'dashboard is Sept 1 to today')); }
  if(f.reportedForDeposit!==null && prev && prev.reportedForDeposit!=='' && prev.reportedForDeposit!==undefined){
    const run = r2(num(prev.reportedForDeposit) + (f.cashSales||0));
    if(Math.abs(f.reportedForDeposit - (f.cashSales||0))<0.01 && Math.abs(f.reportedForDeposit-run)>=0.01) out.push({ ok:true, label:'For Deposit', text:`For Deposit: ₱${money(f.reportedForDeposit)} = today's cash only (reset after a deposit) ✓` });
    else out.push(dsCheck(`For Deposit vs ${prev.date} For Deposit + today's cash`, f.reportedForDeposit, run));
  }
  return out;
}
function dsParseDaimasu(text){

  const cashToday = dsVal(L,/^CASH SALES TODAY\s*:\s*(.*)$/i), cashSale = dsVal(L,/^CASH SALE\s*:\s*(.*)$/i);
  const f = {

    grab: dsVal(L,/^GRAB\s*:\s*(.*)$/i), cashSale, cardSale: dsVal(L,/^CARD SALE\s*:\s*(.*)$/i), qrph: dsVal(L,/^QRPH\s*:\s*(.*)$/i),

    barFood: dsVal(L,/^FOOD SALES\s*:\s*(.*)$/i), barBeverage: dsVal(L,/^BEVERAGE SALES\s*:\s*(.*)$/i),
    barCashSale: (cashToday!==null && cashSale!==null) ? Math.max(0, r2(cashToday - cashSale)) : null,
    beginningFloat: dsVal(L,/^OPENING FLOAT\s*:\s*(.*)$/i), foodExpenses: dsVal(L,/^FOOD EXPENSES?\s*:\s*(.*)$/i), beverageExpenses: dsVal(L,/^BEVERAGE EXPENSES?\s*:\s*(.*)$/i), otherExpenses: dsVal(L,/^OTHER EXPENSES?\s*:\s*(.*)$/i),
    reportedCashDisbursement: dsVal(L,/^PROCUREMENT DISBURSEMENT\s*:\s*(.*)$/i), setAsideForDeposit: dsVal(L,/^SET ASIDE FOR DEPOSIT\s*:\s*(.*)$/i),
    pettyCashReplenishment: dsVal(L,/^PETTY CASH\s*:\s*(.*)$/i), reportedCashboxFloat: dsVal(L,/^CLOSING FLOAT\s*:\s*(.*)$/i),
  };
  const info = { restTotal: dsVal(L,/^RESTAURANT TOTAL\s*:\s*(.*)$/i), barTotal: dsVal(L,/^DAIMASU BAR TOTAL\s*:\s*(.*)$/i), grand: dsVal(L,/^GRAND TOTAL\s*:\s*(.*)$/i),
    previous: dsVal(L,/^PREVIOUS TOTAL SALES\s*:\s*(.*)$/i), cashToday,
    mRest: mi>-1 ? dsVal(L,/^Restaurant\s*:\s*(.*)$/i, mi) : null, mBar: mi>-1 ? dsVal(L,/^Daimasu Bar\s*:\s*(.*)$/i, mi) : null,
    mTotal: dsFirstNum(monthLine.split(':').slice(1).join(':')), mLabel: (monthLine.match(/^TOTAL\s+([A-Z]+)\s+SALES/i)||[])[1] || '',
    staff: dsTxt(L,/This is\s+(.+?)\s+from/i) };
  return { f, info };
}
async function dsDaimasuChecks(mod, p){
  const f = p.f, i = p.info, out = [];
  const rest = r2(['grab','cashSale','cardSale','qrph','credit','bankTransfer','membership'].reduce((s,k)=>s+(f[k]||0),0));
  const bar = r2((f.barFood||0)+(f.barBeverage||0));
  out.push(dsCheck('Restaurant total', i.restTotal, rest));
  out.push(dsCheck('Bar total', i.barTotal, bar));
  out.push(dsCheck('Grand total', i.grand, r2(rest+bar)));
  const rows = withComputed(mod, (await getModuleData(mod)).filter(r=>r.date!==f.date));
  const mtdRows = rows.filter(r=>r.date<f.date && r.date.slice(0,7)===f.date.slice(0,7));
  const mRest = r2(mtdRows.reduce((s,r)=>s+num(r.restaurantTotal),0)), mBar = r2(mtdRows.reduce((s,r)=>s+num(r.barTotal),0));
  if(i.previous!==null) out.push(dsCheck('Previous total sales vs dashboard', i.previous, r2(mRest+mBar)));
  if(i.mRest!==null) out.push(dsCheck('Monthly restaurant vs dashboard', i.mRest, r2(mRest+rest)));
  if(i.mBar!==null) out.push(dsCheck('Monthly bar vs dashboard', i.mBar, r2(mBar+bar)));
  if(i.mTotal!==null) out.push(dsCheck('Monthly total = previous + today', i.mTotal, r2((i.previous||0)+(i.grand||0))));
  if(i.mLabel && f.date){ const want = LC_MONTHS[parseInt(f.date.slice(5,7),10)-1].toUpperCase(); out.push({ ok: i.mLabel.toUpperCase()===want, label:'Month label', text: i.mLabel.toUpperCase()===want ? `Month label: ${i.mLabel} ✓` : `Month label says "${i.mLabel}" but the date is ${want}` }); }
  if(f.beginningFloat!==null && f.reportedCashboxFloat!==null){ const calc = r2(f.beginningFloat + (i.cashToday||0) - (f.reportedCashDisbursement||0) - (f.setAsideForDeposit||0) + (f.pettyCashReplenishment||0)); const d = r2(f.reportedCashboxFloat - calc); out.push({ ok: Math.abs(d)<=1, label:'Cash float', text: `Cash float: opening + cash sales − disbursement − set aside + petty cash = ₱${money(calc)} vs closing ₱${money(f.reportedCashboxFloat)}${Math.abs(d)>=0.01?' (diff ₱'+money(d)+')':' ✓'}` }); }
  if((f.foodExpenses||0)>0 && (f.reportedCashDisbursement||0)===0) out.push({ ok:true, label:'note', text:`Food expenses ₱${money(f.foodExpenses)} with ₱0 procurement disbursement — treated as not paid from the cashbox.` });
  return out;
}
